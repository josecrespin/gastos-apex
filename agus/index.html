/* ==== VARIANTE AGUS — v5 "una sola app": obra + personal juntos.
   La base viene de ../apex-sync.css (compartida, no se duplica). ==== */
:root{
  --accent:      #E8E2D5;
  --accent-hi:   #F5F0E4;
  --accent-deep: #CBBFA4;
  --accent-soft: rgba(232,226,213,.14);
  --on-accent:   #20261F;
  --glow-accent: 0 10px 28px -10px rgba(232,226,213,.28);
  --c-mio: #E8E2D5;                 /* color de "lo personal" en esta app */
}

/* ---- Selector de destino (lo primero que se ve al cargar) ---- */
.modo-sw{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin:var(--sp-3) 0 0;
}
.modo-sw .chip{
  min-height:56px; padding:8px 6px; font-size:15px; font-weight:800;
  line-height:1.2; justify-content:center; text-align:center;
}
.modo-sw .chip--mio.on{ background:var(--c-mio); border-color:var(--c-mio); color:#20261F; }
.modo-nota{
  margin:10px 2px 0; font-size:var(--fs-caption); font-weight:600;
  color:var(--ink-faint); text-align:center; min-height:1em;
}
.modo-nota b{ color:var(--ink-dim); }

/* Filete por fuente en el historial */
.gasto{ --edge: var(--c-mio); }
.gasto--obra{ --edge:var(--c-obra); }
.gasto--tafi{ --edge:var(--c-tafi); }
.gasto--mio{  --edge:var(--c-mio); }
.badge--obra{ background:var(--c-obra-soft); color:var(--copper-hi); }
.badge--tafi{ background:var(--c-tafi-soft); color:var(--c-tafi); }
.badge--mio{  background:var(--accent-soft); color:var(--accent-hi); }
.stat-card--mio{ --stat-c:var(--c-mio); }
.bar-row--mio .bar-fill{ --bc:var(--c-mio); }

/* Encabezado de bloque dentro del Resumen — misma familia que .seccion h2
   pero en pearl, para que se lean como los dos grandes cortes del resumen. */
.bloque{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  margin:var(--sp-6) 2px var(--sp-2);
  padding-bottom:8px; border-bottom:1px solid var(--line);
}
.bloque h2{
  margin:0; font-size:var(--fs-label); font-weight:800;
  letter-spacing:.12em; text-transform:uppercase; color:var(--pearl);
}
.bloque .bl-sub{ font-size:var(--fs-caption); color:var(--ink-faint); font-weight:600; }
.badge--relevar{ background:rgba(239,199,94,.14); color:var(--warn); }
.toast--warn{ border-color:var(--warn); color:var(--warn); }
.aviso{
  margin:var(--sp-3) 0 0; padding:10px var(--sp-3);
  background:rgba(239,199,94,.10); border:1px solid rgba(239,199,94,.28);
  border-radius:var(--r-card); color:var(--warn);
  font-size:var(--fs-caption); font-weight:600; text-align:center;
}

const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaXl3aXFpdmlia3R6YWtjbHl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTA1MTgsImV4cCI6MjA5ODc4NjUxOH0.Z1DQW5ySGolzrjsqeesg824cpctqa04BOS2RSH4NTNo';
const H = {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY};

const YO      = 'agus';

const TABLA_OBRAS    = 'gastos_obras';

const TABLA_PERSONAL = 'gastos_agus';
const RPC_PERSONAL   = 'gastos_agus_lista';
const CLAVE_PERSONAL = '2989913b7b';

// La cola local es la MISMA que traía la app vieja (mismo origen), así que
// lo que haya quedado pendiente en el teléfono se sube igual. A los items
// viejos les falta `dest` → eran todos personales.
const LS_KEY   = 'gastos_agus_v1';
const LS_MODO  = 'gastos_agus_modo';
const LS_CLAVE_VIEJA = 'gastos_agus_clave';

const NOMBRES     = {jose:'José', facu:'Facu', agus:'Agus'};
const PROYECTOS   = {fagu_obra:'Obra FAGU', tafi:'Casa Tafí'};
const PROY_CLASE  = {fagu_obra:'obra', tafi:'tafi'};
const METODO_TXT  = {efectivo:'Efectivo', transferencia:'Transferencia', debito:'Débito', credito:'Crédito'};
// Regla de negocio heredada de la app de Obras: en la obra los hermanos
// pagan solo en efectivo o por transferencia. En lo personal, los 4 métodos.

              tarjeta:'Visa', cuotas:1, recurrente:false, recMeses:'12' };
const filtro = { q:'', fuente:'todo' };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const fmtK = n => n >= 1e6 ? (n/1e6).toLocaleString('es-AR', {maximumFractionDigits:1}) + ' M'
              : n >= 1e3 ? Math.round(n/1e3) + ' k' : String(Math.round(n));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const num = v => Number(v) || 0;

// Redondeo consistente: devuelve las partes ya en pesos enteros, ajustadas
// para que sumen EXACTO el total redondeado que se muestra al lado.
// Sin esto, dos centavos sueltos (una cuota de $3.284,52) hacen que las
// partes den $1 mas que el total. Metodo del resto mayor: el peso que sobra
// o falta se le da a la parte con la fraccion mas grande.
function partesRedondeadas(total, partes){
  const objetivo = Math.round(num(total));
  const base = partes.map(v => Math.floor(num(v)));
  const orden = partes
    .map((v, i) => ({i, frac: num(v) - Math.floor(num(v))}))
    .sort((a, b) => b.frac - a.frac);
  let resto = objetivo - base.reduce((s, v) => s + v, 0);
  if(!orden.length) return base;
  for(let k = 0; resto > 0; k++, resto--) base[orden[k % orden.length].i]++;
  for(let k = 0; resto < 0; k++, resto++) base[orden[orden.length - 1 - (k % orden.length)].i]--;
  return base;
}

let toastTimer = null;
function toast(msg, tipo){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' toast--' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const hoyLocal = () => isoLocal(new Date());
function fechaElegida(){
  if(sel.fecha === 'otra') return $('fecha').value || hoyLocal();
  if(sel.fecha === 'ayer'){ const d = new Date(); d.setDate(d.getDate()-1); return isoLocal(d); }
  return hoyLocal();
}
function etiquetaDia(fechaISO){
  const d = new Date(); d.setDate(d.getDate()-1);
  const ayer = isoLocal(d);
  const [y, m, dd] = fechaISO.split('-').map(Number);
  const txt = new Date(y, m-1, dd).toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
  if(fechaISO === hoyLocal()) return 'Hoy · ' + txt;
  if(fechaISO === ayer) return 'Ayer · ' + txt;
  return txt;
}

const mesNombre = new Date().toLocaleDateString('es-AR', {month:'long'});
$('periodo').textContent = mesNombre.charAt(0).toUpperCase() + mesNombre.slice(1);

// Higiene: la clave vieja ya no se usa nunca más.
try{ localStorage.removeItem(LS_CLAVE_VIEJA); }catch(e){}

// ---------- chips del form ----------
function initChips(id, campo, cb){
  const box = $(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b || b.classList.contains('off')) return;
    box.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}

initChips('chips-modo','modo', v => { localStorage.setItem(LS_MODO, v); aplicarModo(); });
initChips('chips-fecha','fecha', v => {
  const f = $('fecha');
  f.hidden = v !== 'otra';
  if(v === 'otra' && !f.value) f.value = hoyLocal();
});
initChips('chips-proyecto','proyecto');
initChips('chips-metodo','metodo', aplicarGruposTarjeta);
initChips('chips-tarjeta','tarjeta', v => { $('tarjeta-otra').hidden = v !== '__otra'; });
initChips('chips-cuotas','cuotas');

// El destino manda: en la obra solo efectivo/transferencia; el detalle de
// obra (qué obra) solo aparece cuando corresponde.
function aplicarModo(){
  const esObra = sel.modo === 'obra';
  $('grupo-proyecto').hidden = !esObra;
  $('descripcion').placeholder = esObra
    ? '¿En qué? (ej: membrana, cemento, flete)'
    : '¿En qué? (ej: nafta, super, salida)';
  $('modo-nota').innerHTML = esObra
    ? 'Va a la caja de la obra · <b>lo ven los tres hermanos</b>'
    : 'Tus gastos · <b>solo los ves vos</b>';
  document.querySelectorAll('#chips-metodo .chip').forEach(c => {
    const bloqueado = esObra && !METODOS_OBRA.includes(c.dataset.v);
    c.classList.toggle('off', bloqueado);
  });
  if(esObra && !METODOS_OBRA.includes(sel.metodo)){
    sel.metodo = 'efectivo';
    document.querySelectorAll('#chips-metodo .chip').forEach(c => c.classList.toggle('on', c.dataset.v === 'efectivo'));
  }
  aplicarGruposTarjeta();
}

function aplicarGruposTarjeta(){
  const conTarjeta = sel.metodo === 'debito' || sel.metodo === 'credito';
  $('grupo-tarjeta').hidden = !conTarjeta;
  $('grupo-cuotas').hidden = sel.metodo !== 'credito';
  if(!conTarjeta) $('tarjeta-otra').hidden = true;
  else $('tarjeta-otra').hidden = sel.tarjeta !== '__otra';
}

// Arranca en el último destino usado (memoria del selector).
(function restaurarModo(){
  const guardado = localStorage.getItem(LS_MODO);
  if(guardado === 'personal' || guardado === 'obra') sel.modo = guardado;
  document.querySelectorAll('#chips-modo .chip').forEach(c => c.classList.toggle('on', c.dataset.v === sel.modo));
  aplicarModo();
})();

// "se repite N meses" (2-24) o sin fin.
// Crédito + recurrente: manda el crédito (las cuotas ya proyectan solas).
const recEl = $('recurrente');

  recEl.classList.toggle('on', sel.recurrente);
  recEl.textContent = !sel.recurrente ? '🔁 Gasto que se repite'

recEl.addEventListener('click', () => { sel.recurrente = !sel.recurrente; pintarRec(); });

// ---------- foto ----------
const fotoInput = $('foto-input');
const btnFoto = $('btn-foto');
btnFoto.addEventListener('click', () => fotoInput.click());
fotoInput.addEventListener('change', () => {
  const hay = fotoInput.files && fotoInput.files.length;
  btnFoto.classList.toggle('on', !!hay);

async function comprimirFoto(file){
  const img = await createImageBitmap(file);
  const max = 1600;
  const escala = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * escala);
  c.height = Math.round(img.height * escala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

async function subirFoto(file, fecha, carpeta){
  const blob = await comprimirFoto(file);
  const path = carpeta + '/' + fecha + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/facturas/' + path, {
    method:'POST', headers:{...H, 'Content-Type':'image/jpeg'}, body: blob,
  });
  return r.ok ? path : null;
}

// ---------- monto ----------
const montoEl = $('monto');
montoEl.addEventListener('input', () => {

// ---------- persistencia local + POST resiliente ----------
function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function escribirLS(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }

// Anti-duplicados: local_id es UNIQUE en la DB; un reintento de un gasto
// que ya llegó contesta 409 (duplicado) y se toma como "ya guardado".
let nubeLista = true;
const esNubeNoLista = (status, msg) =>
  status === 404 || /PGRST20[25]|Could not find/i.test(msg);

// Resiliencia de esquema: si a la DB le falta una columna nueva se reintenta
// sin ella — la marca queda solo local hasta que corra el SQL.
const OPCIONALES = {recurrente_meses:true};

// Un item de la cola sabe a qué tabla va: `dest` = 'obra' | 'personal'.
// Los items viejos (app v4) no lo traen → eran personales.
const destDe = it => (it && it.dest === 'obra') ? 'obra' : 'personal';
const tablaDe = it => destDe(it) === 'obra' ? TABLA_OBRAS : TABLA_PERSONAL;

async function postSupabase(item){
  const tabla = tablaDe(item);
  const {estado, dest, ...gasto} = item;
  for(let i = 0; i <= Object.keys(OPCIONALES).length; i++){
    const body = {...gasto};
    for(const c in OPCIONALES) if(!OPCIONALES[c]) delete body[c];
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + tabla, {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify(body),
    });
    if(r.ok){ nubeLista = true; return true; }
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(r.status === 409 && /23505|duplicate/i.test(msg)) return true;   // ya estaba
    let cambio = false;
    for(const c in OPCIONALES){
      if(OPCIONALES[c] && (c in body) && msg.includes(c)){ OPCIONALES[c] = false; cambio = true; }
    }
    if(cambio) continue;              // reintenta sin la columna que rebotó
    if(esNubeNoLista(r.status, msg)) nubeLista = false;
    return false;
  }
  return false;
}

let reintentando = false;
async function reintentarPendientes(avisar){
  if(reintentando || !navigator.onLine) { refrescarPendientes(); return; }
  reintentando = true;
  const hist = leerLS();
  let enviados = 0;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    if(item.local_id != null) item.local_id = String(item.local_id);
    try{ if(await postSupabase(item)){ item.estado = 'ok'; enviados++; } }catch(e){}
  }
  if(enviados){ escribirLS(hist); invalidarCache(); }
  reintentando = false;
  refrescarPendientes();
  if(avisar && enviados) toast('✓ ' + enviados + ' gasto(s) sincronizado(s)', 'ok');
}

let cacheObras = null;      // TODAS las filas de la obra (los tres hermanos)
let cachePersonal = null;   // solo las mías
let ultimoFallo = '';

function invalidarCache(){ cacheObras = null; cachePersonal = null; }

async function rpcLista(rpc, clave){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpc, {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({clave}),
  });
  if(!r.ok){
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(esNubeNoLista(r.status, msg)){ nubeLista = false; return []; }
    throw new Error('server');
  }
  nubeLista = true;
  const filas = await r.json();
  return Array.isArray(filas) ? filas : [];
}

// Las dos fuentes en paralelo. Si una falla, la app igual muestra la otra.
async function traerTodo(force){
  if(cacheObras && cachePersonal && !force) return;
  const [o, p] = await Promise.allSettled([
    rpcLista(RPC_OBRAS, CLAVE_OBRAS),
    rpcLista(RPC_PERSONAL, CLAVE_PERSONAL),
  ]);
  ultimoFallo = '';
  if(o.status === 'fulfilled') cacheObras = o.value.map(f => ({...f, _src:'obra'}));
  else { cacheObras = cacheObras || []; ultimoFallo = 'obra'; }
  if(p.status === 'fulfilled') cachePersonal = p.value.map(f => ({...f, _src:'personal'}));
  else { cachePersonal = cachePersonal || []; ultimoFallo = ultimoFallo ? 'ambas' : 'personal'; }
  if(o.status === 'rejected' && p.status === 'rejected') throw new Error('server');
}

// Lo que todavía está en cola en el teléfono, sin duplicar lo que ya llegó.
function pendientes(){
  const enServer = new Set([...(cacheObras||[]), ...(cachePersonal||[])].map(f => f.local_id).filter(Boolean));
  return leerLS()
    .filter(x => x.estado === 'pendiente' && !enServer.has(x.local_id))
    .map(x => ({...x, _src: destDe(x), _pendiente:true, id: Infinity}));
}

// Regla: TODA compra a crédito impacta los meses siguientes (aun en 1 cuota).
// Recurrentes: respetan el horizonte elegido — N meses en total (el gasto
// cargado cuenta como pago 1) o sin fin si no se puso límite.
// Crédito + recurrente: manda el crédito (sin doble conteo).
function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const marca = f._src === 'obra' ? '🏗️ ' : '👤 ';
    const esCredito = f.metodo === 'credito';
    if(f.es_recurrente && !esCredito){
      const N = num(f.recurrente_meses);          // 0 = sin fin
      for(let k = Math.max(0, base + 1); k < meses.length; k++){
        const nro = k - base + 1;                 // el gasto original fue el pago 1
        if(N && nro > N) break;
        meses[k].items.push({t: etiqueta, sub: marca + (METODO_TXT[f.metodo] || f.metodo),
                             rec:true, cuota: N ? nro + '/' + N : null, v: num(f.monto)});
      }
    }
    if(esCredito){
      const n = Math.max(1, num(f.cuotas) || 1);
      const cuota = num(f.monto) / n;
      for(let i = 1; i <= n; i++){
        const k = base + i;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta, sub: marca + (f.tarjeta || 'Crédito'), cuota: i + '/' + n, v: cuota});
      }
    }
  }
  return meses;
}

function barPath(x, y, w, h, r){
  r = Math.min(r, h);
  return 'M' + x + ' ' + (y + h) + ' V' + (y + r) +
         ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
         ' H' + (x + w - r) +
         ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) +
         ' V' + (y + h) + ' Z';
}

// Barras apiladas: abajo la obra (cobre), arriba lo personal (acento).
// Solo el segmento de más arriba lleva las esquinas redondeadas.
function chartMeses(filasObra, filasPers){
  const hoy = new Date();
  const labs = [], vO = [], vP = [];
  for(let k = 5; k >= 0; k--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - k, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    labs.push(d.toLocaleDateString('es-AR', {month:'short'}).replace('.',''));
    vO.push(filasObra.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + num(f.monto), 0));
    vP.push(filasPers.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + num(f.monto), 0));
  }
  const tot = vO.map((v, i) => v + vP[i]);
  const max = Math.max(...tot, 1);
  const base = 124, top = 26, bw = 34;
  const gap = (320 - 6 * bw) / 7;
  const alto = v => v > 0 ? Math.max(v / max * (base - top), 2) : 0;

  let s = '<svg class="grafico" viewBox="0 0 320 150" role="img" aria-label="Gasto por mes: ' +
    labs.map((l, i) => l + ' ' + fmt$(tot[i])).join(', ') + '">';
  s += '<line x1="0" y1="' + (base + .5) + '" x2="320" y2="' + (base + .5) + '" stroke="rgba(232,226,213,.18)" stroke-width="1"/>';
  tot.forEach((v, i) => {
    const x = gap + (bw + gap) * i;
    const cur = i === 5;
    const op = cur ? '' : ' opacity=".55"';
    const hO = alto(vO[i]), hP = alto(vP[i]);
    const yTot = base - (hO + hP);
    if(hP > 0){
      s += '<path d="' + barPath(x, yTot, bw, hP, 4) + '" fill="' + ACCENT + '"' + op + '/>';
      if(hO > 0) s += '<rect x="' + x + '" y="' + (yTot + hP) + '" width="' + bw + '" height="' + hO + '" fill="#C98F5F"' + op + '/>';
    } else if(hO > 0){
      s += '<path d="' + barPath(x, yTot, bw, hO, 4) + '" fill="#C98F5F"' + op + '/>';
    } else {
      s += '<rect x="' + x + '" y="' + (base - 2) + '" width="' + bw + '" height="2" fill="rgba(232,226,213,.18)"/>';
    }
    s += '<text x="' + (x + bw/2) + '" y="' + (base - Math.max(hO + hP, 2) - 6) + '" class="g-val' + (cur ? ' g-val--cur' : '') + '" text-anchor="middle">' + (v ? fmtK(v) : '—') + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="142" class="g-lab" text-anchor="middle">' + esc(labs[i]) + '</text>';
  });
  s += '</svg>';
  s += '<div class="leyenda">' +
       '<span><i style="background:#C98F5F"></i>Obra</span>' +
       '<span><i style="background:' + ACCENT + '"></i>Personal</span></div>';
  return s;
}

function renderResumen(){
  const hoy = new Date();
  const ym = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0');
  const pend = pendientes();

  const obraTodos = [...(cacheObras || []), ...pend.filter(f => f._src === 'obra')];
  const obraMia   = obraTodos.filter(f => f.quien === YO);
  const persMia   = [...(cachePersonal || []), ...pend.filter(f => f._src === 'personal')];
  const todasMias = [...obraMia, ...persMia];

  const suma = a => a.reduce((s, f) => s + num(f.monto), 0);
  const delMes = a => a.filter(f => f.fecha.startsWith(ym));

  const mesObra = suma(delMes(obraMia));
  const mesPers = suma(delMes(persMia));
  const mesMio  = mesObra + mesPers;
  // Obra + Personal tienen que dar exacto el total grande de arriba.
  const [mesObraR, mesPersR] = partesRedondeadas(mesMio, [mesObra, mesPers]);
  const mesMioR = Math.round(mesMio);

  const meses = proyectar(todasMias).filter(m => m.items.length);

  // ===== HERO: lo mío de este mes, partido en dos =====
  let html = avisoParcial() +
    '<section class="hero">' +
      '<div class="etiqueta">Lo que gastaste este mes</div>' +
      '<div class="total money">' + fmt$(mesMioR) + '</div>' +
      '<svg class="onda" viewBox="0 0 220 14" aria-hidden="true">' +
        '<path d="M2 8 Q30 2 58 8 T114 8 T170 8 T226 8" fill="none" stroke="#C98F5F" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>' +
      '</svg>' +
      '<div class="leyenda">' +
        '<span><i style="background:#C98F5F"></i>Obra <b>' + fmt$(mesObraR) + '</b></span>' +
        '<span><i style="background:' + ACCENT + '"></i>Personal <b>' + fmt$(mesPersR) + '</b></span>' +
      '</div>' +
    '</section>';

  // ===== BLOQUE 1: OBRA FAGU =====
  const totalObraTodos = suma(obraTodos);
  const porQuien = {jose:0, facu:0, agus:0};
  const porProy = {};
  for(const f of obraTodos){
    porQuien[f.quien] = (porQuien[f.quien] || 0) + num(f.monto);
    if(f.quien === YO) porProy[f.proyecto] = (porProy[f.proyecto] || 0) + num(f.monto);
  }

  // Lo que puso cada hermano tiene que sumar EXACTO el total de la obra.
  // A partir de aca se muestran solo estos valores ya redondeados.
  const QUIENES = ['jose','facu','agus'];
  const quienR = {};
  partesRedondeadas(totalObraTodos, QUIENES.map(q => porQuien[q] || 0))
    .forEach((v, i) => { quienR[QUIENES[i]] = v; });
  const totalObraTodosR = Math.round(totalObraTodos);
  const totalObraMiaR   = quienR[YO];   // asi el stat card y la barra dicen lo mismo

  html += '<div class="bloque"><h2>🏗️ Obra FAGU</h2>' +
          '<span class="bl-sub">entre los tres</span></div>';

  if(!obraTodos.length){
    html += '<div class="vacio"><b>Todavía no hay gastos de obra</b>Cargá el primero desde la pestaña Cargar.</div>';
  } else {
    html += '<div class="stat-grid">' +
      '<div class="stat-card stat-card--mio">' +
        '<div class="lbl">Lo que pusiste vos</div>' +
        '<div class="val money">' + fmt$(totalObraMiaR) + '</div>' +
        '<div class="sub">' + obraMia.length + ' gasto' + (obraMia.length === 1 ? '' : 's') + '</div>' +
      '</div>' +
      '<div class="stat-card stat-card--obra">' +
        '<div class="lbl">Total de la obra</div>' +
        '<div class="val money">' + fmt$(totalObraTodosR) + '</div>' +
        '<div class="sub">' + obraTodos.length + ' gastos entre los tres</div>' +
      '</div></div>';

    // Quién puso cuánto — apilada + barras
    const pct = q => totalObraTodosR ? (quienR[q] / totalObraTodosR * 100) : 0;
    const maxQ = Math.max(...Object.values(quienR), 1);
    html += '<section class="card"><h3>Cuánto puso cada uno</h3>' +
      '<div class="stacked" role="img" aria-label="' +
        ['jose','facu','agus'].map(q => NOMBRES[q] + ' ' + Math.round(pct(q)) + '%').join(', ') + '">' +
        ['jose','facu','agus'].filter(q => quienR[q] > 0).map(q =>
          '<i style="width:' + pct(q).toFixed(1) + '%; background:var(--p-' + q + ')"></i>').join('') +
      '</div>' +
      '<div class="bars" style="margin-top:var(--sp-4)">' +
      ['jose','facu','agus'].map(q =>
        '<div class="bar-row bar-row--' + q + '">' +
          '<span class="quien">' + (q === YO ? 'Vos' : NOMBRES[q]) + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="--w:' + ((quienR[q] || 0) / maxQ * 100).toFixed(1) + '%"></div></div>' +
          '<span class="cuanto money">' + fmt$(quienR[q] || 0) + '</span>' +
        '</div>').join('') +
      '</div></section>';

    // Si tocó las dos obras, cómo se repartió LO SUYO
    const proys = Object.keys(porProy).filter(p => porProy[p]);
    if(proys.length > 1){
      // Las obras tienen que sumar exacto "Lo que pusiste vos" de arriba.
      const proyR = {};
      partesRedondeadas(totalObraMiaR, proys.map(p => porProy[p]))
        .forEach((v, i) => { proyR[proys[i]] = v; });
      html += '<section class="card"><h3>Lo tuyo por obra</h3>' +
        proys.sort((a, b) => proyR[b] - proyR[a]).map(p =>
          '<div class="tj-row"><span>' + esc(PROYECTOS[p] || p) + '</span><b class="money">' + fmt$(proyR[p]) + '</b></div>').join('') +
        '</section>';
    }
  }

  // ===== BLOQUE 2: MIS GASTOS PERSONALES =====
  const persMes = delMes(persMia);
  const totalPersHist = suma(persMia);
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const corte30 = isoLocal(d30);
  const pers30 = persMia.filter(f => f.fecha >= corte30);

  html += '<div class="bloque"><h2>👤 Mis gastos personales</h2>' +
          '<span class="bl-sub">solo tuyo</span></div>';

  if(!persMia.length){
    html += '<div class="vacio"><b>Todavía no cargaste nada personal</b>Cambiá el selector a 👤 Personal en Cargar.</div>';
  } else {
    html += '<div class="stat-grid">' +
      '<div class="stat-card stat-card--mio">' +
        '<div class="lbl">Este mes</div>' +
        '<div class="val money">' + fmt$(mesPersR) + '</div>' +
        '<div class="sub">' + persMes.length + ' gasto' + (persMes.length === 1 ? '' : 's') + '</div>' +
      '</div>' +
      '<div class="stat-card stat-card--pearl">' +
        '<div class="lbl">Últimos 30 días</div>' +
        '<div class="val money">' + fmt$(suma(pers30)) + '</div>' +
        '<div class="sub">histórico ' + fmt$(totalPersHist) + '</div>' +
      '</div></div>';

    const porMetodo = {}, porTarjeta = {};
    for(const f of persMes){
      porMetodo[f.metodo] = (porMetodo[f.metodo] || 0) + num(f.monto);
      if(f.tarjeta) porTarjeta[f.tarjeta] = (porTarjeta[f.tarjeta] || 0) + num(f.monto);
    }
    const metodos = ['efectivo','transferencia','debito','credito'].filter(m => porMetodo[m]);
    if(metodos.length){
      const maxM = Math.max(...metodos.map(m => porMetodo[m]), 1);
      html += '<section class="card"><h3>Este mes por método</h3><div class="bars bars--metodo">' +
        metodos.map(m =>
          '<div class="bar-row bar-row--mio"><span class="quien">' + METODO_TXT[m] + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="--w:' + (porMetodo[m] / maxM * 100).toFixed(1) + '%"></div></div>' +
          '<span class="cuanto money">' + fmt$(porMetodo[m]) + '</span></div>').join('') +
        '</div></section>';
    }
    const tarjetas = Object.keys(porTarjeta);
    if(tarjetas.length){
      html += '<section class="card"><h3>Este mes por tarjeta</h3>' +
        tarjetas.sort((a, b) => porTarjeta[b] - porTarjeta[a]).map(t =>
          '<div class="tj-row"><span>' + esc(t) + '</span><b class="money">' + fmt$(porTarjeta[t]) + '</b></div>').join('') +
        '</section>';
    }
  }

  // ===== GASTO POR MES (lo mío, apilado) =====
  html += '<div class="bloque"><h2>Tu gasto mes a mes</h2></div>' +
          '<section class="card">' + chartMeses(obraMia, persMia) + '</section>';

  // ===== COMPROMISOS QUE VIENEN =====
  html += '<div class="bloque"><h2>Compromisos que vienen</h2></div>';
  if(meses.length){
    // Las cuotas caen en decimales (una compra de $3.284,52 en 3). Cada mes
    // reparte su propio redondeo para que las filas den exacto el total del
    // mes, y el comprometido es la suma de esos totales ya redondeados.
    let comprometido = 0;
    html += meses.map(mes => {
      const t = mes.items.reduce((s, i) => s + i.v, 0);
      const itemsR = partesRedondeadas(t, mes.items.map(i => i.v));
      const tR = Math.round(t);
      comprometido += tR;
      let nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long'});
      nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      if(mes.y !== hoy.getFullYear()) nombre += ' ' + mes.y;
      return '<div class="mes-card">' +
        '<div class="mes-head"><span class="mes-nombre">' + esc(nombre) + '</span><span class="mes-total money">' + fmt$(tR) + '</span></div>' +
        mes.items.map((i, ix) =>
          '<div class="mes-item"><span class="dos-lineas">' +
            '<span class="mes-t">' + (i.rec ? '🔁 ' : '') + esc(i.t) + '</span>' +
            '<span class="mes-sub">' + esc(i.sub) + '</span></span>' +
          (i.cuota ? '<span class="cuota-n">' + i.cuota + '</span>' : '') +
          '<b class="money">' + fmt$(itemsR[ix]) + '</b></div>').join('') +
        '</div>';
    }).join('');
    html += '<p class="pie">Suma cuotas de crédito + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra. Total comprometido: ' + fmt$(comprometido) + '.</p>';
  } else {
    html += '<div class="vacio"><b>Nada proyectado</b>Sin cuotas pendientes ni gastos que se repitan.</div>';
  }

  $('res-contenido').innerHTML = html;
}

// ---------- arranque ----------
if(location.hash === '#historial') setVista('historial');
if(location.hash === '#resumen' || location.hash === '#proximos') setVista('resumen');
pintarRec();
reintentarPendientes(false);
refrescarPendientes();
// Si el navegador no deja registrar el worker (modo incognito, política del
// equipo), la app funciona igual online: no ensuciamos la consola por eso.
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
