/* ==== VARIANTE FACU — v5 "una sola app": obra + personal juntos.
   La base viene de ../apex-sync.css (compartida, no se duplica). ==== */
:root{
  --accent:      #4FB0C8;
  --accent-hi:   #6FC2D6;
  --accent-deep: #3A8CA0;
  --accent-soft: rgba(79,176,200,.15);
  --on-accent:   #062229;
  --glow-accent: 0 10px 28px -10px rgba(79,176,200,.40);
  --c-mio: #4FB0C8;                 /* color de "lo personal" en esta app */
}

/* ---- Selector de destino (lo primero que se ve al cargar) ---- */
.modo-sw{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin:var(--sp-3) 0 0;
}
.modo-sw .chip{
  min-height:56px; padding:8px 6px; font-size:15px; font-weight:800;
  line-height:1.2; justify-content:center; text-align:center;
}
.modo-sw .chip--mio.on{ background:var(--c-mio); border-color:var(--c-mio); color:#062229; }
.modo-nota{
  margin:10px 2px 0; font-size:var(--fs-caption); font-weight:600;
  color:var(--ink-faint); text-align:center; min-height:1em;
}
.modo-nota b{ color:var(--ink-dim); }

/* Filete por fuente en el historial */
.gasto{ --edge: var(--c-mio); }
.gasto--obra{ --edge:var(--c-obra); }
.gasto--tafi{ --edge:var(--c-tafi); }
.gasto--mio{  --edge:var(--c-mio); }
.badge--obra{ background:var(--c-obra-soft); color:var(--copper-hi); }
.badge--tafi{ background:var(--c-tafi-soft); color:var(--c-tafi); }
.badge--mio{  background:var(--accent-soft); color:var(--accent-hi); }
.stat-card--mio{ --stat-c:var(--c-mio); }
.bar-row--mio .bar-fill{ --bc:var(--c-mio); }

/* Encabezado de bloque dentro del Resumen — misma familia que .seccion h2
   pero en pearl, para que se lean como los dos grandes cortes del resumen. */
.bloque{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  margin:var(--sp-6) 2px var(--sp-2);
  padding-bottom:8px; border-bottom:1px solid var(--line);
}
.bloque h2{
  margin:0; font-size:var(--fs-label); font-weight:800;
  letter-spacing:.12em; text-transform:uppercase; color:var(--pearl);
}
.bloque .bl-sub{ font-size:var(--fs-caption); color:var(--ink-faint); font-weight:600; }
.badge--relevar{ background:rgba(239,199,94,.14); color:var(--warn); }
.toast--warn{ border-color:var(--warn); color:var(--warn); }
.aviso{
  margin:var(--sp-3) 0 0; padding:10px var(--sp-3);
  background:rgba(239,199,94,.10); border:1px solid rgba(239,199,94,.28);
  border-radius:var(--r-card); color:var(--warn);
  font-size:var(--fs-caption); font-weight:600; text-align:center;
}
</style>

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const fmtK = n => n >= 1e6 ? (n/1e6).toLocaleString('es-AR', {maximumFractionDigits:1}) + ' M'
              : n >= 1e3 ? Math.round(n/1e3) + ' k' : String(Math.round(n));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const num = v => Number(v) || 0;

// EL redondeo: cada gasto se redondea UNA sola vez, aca, al peso que se ve
// en su fila. De ahi para arriba solo se suman enteros, asi cualquier total
// es exactamente la suma de lo que se muestra. Sin esto, una factura de
// $3.284,52 hacia que Jose + Facu diera $1 mas que el total de la obra.
const montoEnt = f => Math.round(num(f.monto));

// Para lo unico que sigue dando decimales: las cuotas (un gasto dividido en
// N). Devuelve las partes en pesos enteros ajustadas para que sumen EXACTO
// el total redondeado. Metodo del resto mayor: el peso que sobra o falta va
// a la parte con la fraccion mas grande.
function partesRedondeadas(total, partes){
  const objetivo = Math.round(num(total));
  const base = partes.map(v => Math.floor(num(v)));
  const orden = partes
    .map((v, i) => ({i, frac: num(v) - Math.floor(num(v))}))
    .sort((a, b) => b.frac - a.frac);
  let resto = objetivo - base.reduce((s, v) => s + v, 0);
  if(!orden.length) return base;
  for(let k = 0; resto > 0; k++, resto--) base[orden[k % orden.length].i]++;
  for(let k = 0; resto < 0; k++, resto++) base[orden[orden.length - 1 - (k % orden.length)].i]--;
  return base;
}

let toastTimer = null;

  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' toast--' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

let errVisto = false;
function mostrarFalla(origen, detalle){
  if(errVisto) return;          // un solo cartel; no tapar la app con diez
  errVisto = true;
  const d = document.createElement('div');
  d.id = 'falla-global';
  d.setAttribute('role','alert');
  d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:96px;z-index:200;' +
    'background:#3A1410;border:1.5px solid #F2705F;border-radius:14px;padding:14px 16px;' +
    'color:#FFE9E4;font:600 13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;' +
    'box-shadow:0 12px 32px -8px rgba(0,0,0,.7)';
  d.innerHTML = '<b style="display:block;font-size:14px;margin-bottom:4px">Algo falló en la app</b>' +
    '<span style="display:block;opacity:.85;word-break:break-word">' + esc(origen + ': ' + detalle) + '</span>' +
    '<span style="display:block;margin-top:8px;opacity:.7">Mandale esta captura a Jarvis.</span>' +
    '<button style="margin-top:10px;width:100%;min-height:40px;border-radius:10px;cursor:pointer;' +
    'background:#F2705F;border:none;color:#2A0904;font-weight:800;font-size:13px">Recargar la app</button>';
  d.querySelector('button').addEventListener('click', () => location.reload());
  document.body.appendChild(d);
}
window.addEventListener('error', e => mostrarFalla('Error', (e.message || 'desconocido') + ' (línea ' + e.lineno + ')'));
window.addEventListener('unhandledrejection', e => {

});

function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const hoyLocal = () => isoLocal(new Date());
function fechaElegida(){
  if(sel.fecha === 'otra') return $('fecha').value || hoyLocal();
  if(sel.fecha === 'ayer'){ const d = new Date(); d.setDate(d.getDate()-1); return isoLocal(d); }
  return hoyLocal();
}
function etiquetaDia(fechaISO){
  const d = new Date(); d.setDate(d.getDate()-1);
  const ayer = isoLocal(d);
  const [y, m, dd] = fechaISO.split('-').map(Number);
  const txt = new Date(y, m-1, dd).toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
  if(fechaISO === hoyLocal()) return 'Hoy · ' + txt;
  if(fechaISO === ayer) return 'Ayer · ' + txt;
  return txt;
}

const mesNombre = new Date().toLocaleDateString('es-AR', {month:'long'});

// ---------- chips del form ----------
function initChips(id, campo, cb){
  const box = $(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b || b.classList.contains('off')) return;
    box.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}

initChips('chips-proyecto','proyecto');

async function comprimirFoto(file){
  const img = await createImageBitmap(file);
  const max = 1600;
  const escala = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * escala);
  c.height = Math.round(img.height * escala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

async function subirFoto(file, fecha, carpeta){
  const blob = await comprimirFoto(file);
  const path = carpeta + '/' + fecha + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/facturas/' + path, {
    method:'POST', headers:{...H, 'Content-Type':'image/jpeg'}, body: blob,
  });
  return r.ok ? path : null;
}

// ---------- persistencia local + POST resiliente ----------
function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }

// v10: escribir NUNCA puede tirar. Si el telefono se queda sin espacio
// (QuotaExceededError, iOS con poco disco) el boton "Guardar" se colgaba en
// "Guardando…" para siempre y no se podia cargar nada. Ahora, si no entra, se
// tiran los gastos VIEJOS YA SINCRONIZADOS (los que estan en el servidor, no
// se pierde nada) y se reintenta. Los pendientes no se tocan jamas.
function escribirLS(a){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(a)); return true; }
  catch(e){
    try{
      const pendientes = a.filter(x => x.estado === 'pendiente');
      const sincronizados = a.filter(x => x.estado !== 'pendiente');
      // se conservan los 30 sincronizados mas nuevos, el resto ya vive en la DB
      const podado = sincronizados.slice(-30).concat(pendientes);
      localStorage.setItem(LS_KEY, JSON.stringify(podado));
      toast('Se liberó espacio en el teléfono — tus gastos están a salvo', 'warn');
      return true;
    }catch(e2){
      toast('El teléfono no tiene espacio para guardar acá — revisá que el gasto haya subido', 'error');
      return false;
    }
  }
}

// Anti-duplicados: local_id es UNIQUE en la DB; un reintento de un gasto
// que ya llegó contesta 409 (duplicado) y se toma como "ya guardado".
let nubeLista = true;
const esNubeNoLista = (status, msg) =>
  status === 404 || /PGRST20[25]|Could not find/i.test(msg);

// Resiliencia de esquema: si a la DB le falta una columna nueva se reintenta
// sin ella — la marca queda solo local hasta que corra el SQL.
const OPCIONALES = {recurrente_meses:true};

// Un item de la cola sabe a qué tabla va: `dest` = 'obra' | 'personal'.
// Los items viejos (app v4) no lo traen → eran personales.
const destDe = it => (it && it.dest === 'obra') ? 'obra' : 'personal';
const tablaDe = it => destDe(it) === 'obra' ? TABLA_OBRAS : TABLA_PERSONAL;

async function postSupabase(item){
  const tabla = tablaDe(item);
  const {estado, dest, ...gasto} = item;
  for(let i = 0; i <= Object.keys(OPCIONALES).length; i++){
    const body = {...gasto};
    for(const c in OPCIONALES) if(!OPCIONALES[c]) delete body[c];
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + tabla, {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify(body),
    });
    if(r.ok){ nubeLista = true; return true; }
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(r.status === 409 && /23505|duplicate/i.test(msg)) return true;   // ya estaba
    let cambio = false;
    for(const c in OPCIONALES){
      if(OPCIONALES[c] && (c in body) && msg.includes(c)){ OPCIONALES[c] = false; cambio = true; }
    }
    if(cambio) continue;              // reintenta sin la columna que rebotó
    if(esNubeNoLista(r.status, msg)) nubeLista = false;
    return false;
  }
  return false;
}

function refrescarPendientes(){
  const n = leerLS().filter(x => x.estado === 'pendiente').length;
  const el = $('pendientes');
  el.textContent = n ? ('⏳ ' + n + ' en el teléfono — se suben solos (tocá para probar)') : '';
  el.classList.toggle('show', n > 0);
}

let reintentando = false;
async function reintentarPendientes(avisar){
  if(reintentando || !navigator.onLine) { refrescarPendientes(); return; }
  reintentando = true;
  const hist = leerLS();
  let enviados = 0;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    if(item.local_id != null) item.local_id = String(item.local_id);
    try{ if(await postSupabase(item)){ item.estado = 'ok'; enviados++; } }catch(e){}
  }
  if(enviados){ escribirLS(hist); invalidarCache(); }
  reintentando = false;
  refrescarPendientes();
  if(avisar && enviados) toast('✓ ' + enviados + ' gasto(s) sincronizado(s)', 'ok');
}

const btn = $('guardar');
btn.addEventListener('click', async () => {
  const monto = Number(montoEl.value.replace(/\D/g,''));
  const hayFoto = !!(fotoInput.files && fotoInput.files.length);
  // Con foto, el monto puede ir vacío: queda marcado para que Jarvis
  // lo saque de la factura (flag `relevar`).
  if(!monto && !hayFoto){ montoEl.focus(); return; }
  const esObra = sel.modo === 'obra';
  const esCredito = sel.metodo === 'credito';
  const conTarjeta = esCredito || sel.metodo === 'debito';
  let tarjeta = null;
  if(conTarjeta){
    tarjeta = sel.tarjeta === '__otra'
      ? ($('tarjeta-otra').value.trim() || 'Otra')
      : sel.tarjeta;
  }
  btn.disabled = true; btn.textContent = 'Guardando…';

  let foto_path = null;
  if(hayFoto){
    try{ foto_path = await subirFoto(fotoInput.files[0], fechaElegida(), esObra ? 'obras' : YO); }catch(e){}
  }

  const gasto = {
    fecha: fechaElegida(),
    monto: monto || 0,
    descripcion: $('descripcion').value.trim(),
    metodo: sel.metodo,
    tarjeta: tarjeta,
    cuotas: esCredito ? sel.cuotas : 1,
    es_recurrente: sel.recurrente,
    foto_path: foto_path,
    local_id: uuid(),
  };
  if(esObra){ gasto.proyecto = sel.proyecto; gasto.quien = YO; }
  if(sel.recurrente && sel.recMeses !== 'inf') gasto.recurrente_meses = Number(sel.recMeses);
  if(!monto && hayFoto) gasto.relevar = true;

  const hist = leerLS();
  const item = {...gasto, dest: esObra ? 'obra' : 'personal', estado:'pendiente'};
  hist.push(item); escribirLS(hist);

  let ok = false;
  try{ ok = await postSupabase(item); }catch(e){}
  if(ok){ item.estado = 'ok'; escribirLS(hist); }
  invalidarCache();

  const fotoFallo = hayFoto && !foto_path;
  if(navigator.vibrate) navigator.vibrate(ok ? 30 : [60,60,60]);
  btn.classList.add('ok');
  btn.textContent = '✓ Guardado';
  const donde = esObra ? 'a la obra' : 'a lo tuyo';
  if(ok && fotoFallo){
    toast(monto
      ? 'Gasto guardado, pero la foto no subió'
      : 'Guardado sin foto ni monto — completalo a mano después', 'warn');
  } else if(ok && !monto){
    toast('✓ Guardado — Jarvis saca el monto de la factura', 'ok');
  } else if(ok){
    toast('✓ Guardado ' + donde + ' — ya figura arriba del Historial', 'ok');
  } else if(!nubeLista){
    toast('✓ Guardado en el teléfono — se sube solo apenas esté lista la nube');
  } else if(!navigator.onLine){
    toast('Sin conexión — quedó en el teléfono, se envía al volver la señal');
  } else {
    toast('No llegó al servidor — quedó en el teléfono y se reintenta solo', 'error');
  }
  setTimeout(() => {
    btn.classList.remove('ok'); btn.disabled = false; btn.textContent = 'Guardar gasto';
    montoEl.value = ''; $('descripcion').value = '';
    sel.fecha = 'hoy'; $('fecha').hidden = true; $('fecha').value = '';
    document.querySelectorAll('#chips-fecha .chip').forEach(c => c.classList.toggle('on', c.dataset.v === 'hoy'));
    sel.recurrente = false; sel.recMeses = '12';
    document.querySelectorAll('#chips-rec-meses .chip').forEach(c => c.classList.toggle('on', c.dataset.v === '12'));
    pintarRec();
    fotoInput.value = ''; btnFoto.classList.remove('on'); btnFoto.textContent = '📷 Foto de la factura';
    $('foto-hint').hidden = true;
  }, 1500);
  refrescarPendientes();
});

// ---------- datos: las DOS fuentes, sin pedir nada ----------
let cacheObras = null;      // TODAS las filas de la obra (los tres hermanos)
let cachePersonal = null;   // solo las mías
let ultimoFallo = '';

function invalidarCache(){ cacheObras = null; cachePersonal = null; }

async function rpcLista(rpc, clave){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpc, {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({clave}),
  });
  if(!r.ok){
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(esNubeNoLista(r.status, msg)){ nubeLista = false; return []; }
    throw new Error('server');
  }
  nubeLista = true;
  const filas = await r.json();
  if(!Array.isArray(filas)) return [];
  // `fecha` se usa para ordenar, agrupar y proyectar. Una sola fila con
  // fecha nula tiraba TODO el render (pantalla trabada en "Cargando…").
  return filas.map(f => (typeof f.fecha === 'string' ? f : {...f, fecha: f.fecha ? String(f.fecha) : ''}));
}

// Las dos fuentes en paralelo. Si una falla, la app igual muestra la otra.
async function traerTodo(force){
  if(cacheObras && cachePersonal && !force) return;
  const [o, p] = await Promise.allSettled([
    rpcLista(RPC_OBRAS, CLAVE_OBRAS),
    rpcLista(RPC_PERSONAL, CLAVE_PERSONAL),
  ]);
  ultimoFallo = '';
  if(o.status === 'fulfilled') cacheObras = o.value.map(f => ({...f, _src:'obra'}));
  else { cacheObras = cacheObras || []; ultimoFallo = 'obra'; }
  if(p.status === 'fulfilled') cachePersonal = p.value.map(f => ({...f, _src:'personal'}));
  else { cachePersonal = cachePersonal || []; ultimoFallo = ultimoFallo ? 'ambas' : 'personal'; }
  if(o.status === 'rejected' && p.status === 'rejected') throw new Error('server');
}

// Lo que todavía está en cola en el teléfono, sin duplicar lo que ya llegó.
function pendientes(){
  const enServer = new Set([...(cacheObras||[]), ...(cachePersonal||[])].map(f => f.local_id).filter(Boolean));
  return leerLS()
    .filter(x => x.estado === 'pendiente' && !enServer.has(x.local_id))
    .map(x => ({...x, fecha: String(x.fecha || hoyLocal()), _src: destDe(x), _pendiente:true, id: Infinity}));
}

// El Historial muestra la obra COMPLETA (los tres hermanos — es plata
// compartida y el Resumen ya dice "18 gastos entre los tres") más mis
// gastos personales y lo que quedó en cola. Antes filtraba la obra por
// `quien === YO`: quien todavía no había cargado nada veía "Sin gastos
// todavía" aunque la obra tuviera 18 gastos.
const filasObra    = () => (cacheObras || []);
const misPersonales= () => (cachePersonal || []);
function mias(){
  return [...pendientes(), ...filasObra(), ...misPersonales()];
}

async function abrirHistorial(force){
  const cont = $('hist-lista');
  if(!cacheObras || !cachePersonal || force){
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    $('hist-stats').textContent = '';
    try{ await traerTodo(true); }
    catch(e){ cont.innerHTML = htmlError(); return; }
  }
  // Se pregunta UNA vez si el servidor sabe editar. Si falla la pregunta, no
  // pasa nada: se dibuja igual, solo que sin lápices.
  try{ await mantenimientoDisponible(); }catch(e){ mantenimientoOK = false; }
  // Si el render explota, el usuario tiene que VER algo — antes se quedaba
  // la pantalla trabada en "Cargando…" sin ninguna pista.
  try{ renderHistorial(); }
  catch(e){ cont.innerHTML = htmlFalla(e); }
}

function coincide(f){
  if(filtro.fuente !== 'todo' && f._src !== filtro.fuente) return false;
  if(!filtro.q) return true;
  const blob = [f.descripcion, f.tarjeta, METODO_TXT[f.metodo], PROYECTOS[f.proyecto],
                f._src === 'obra' ? 'obra' : 'personal', String(f.monto)].join(' ').toLowerCase();
  return blob.includes(filtro.q);
}

function chipFuente(f){
  if(f._src === 'obra'){
    const cls = PROY_CLASE[f.proyecto] || 'obra';
    return '<span class="badge badge--' + cls + '">🏗️ ' + esc(PROYECTOS[f.proyecto] || 'Obra') + '</span>';
  }
  return '<span class="badge badge--mio">👤 Personal</span>';
}

function filaHTML(f){
  const metodo = f.metodo === 'credito'
    ? '<span class="badge badge--credito">Crédito ' + (num(f.cuotas) || 1) + '×</span>'
    : '<span class="badge">' + (METODO_TXT[f.metodo] || esc(f.metodo)) + '</span>';
  const extra = f.tarjeta ? '<span class="extra">' + esc(f.tarjeta) + '</span>' : '';
  const rec = f.es_recurrente
    ? '<span class="badge badge--recurrente">🔁 ' + (num(f.recurrente_meses) ? num(f.recurrente_meses) + ' meses' : 'fijo') + '</span>' : '';
  const rev = f.relevar ? '<span class="badge badge--relevar">🔎 Jarvis la está leyendo</span>' : '';
  const cola = f._pendiente ? '<span class="badge badge--cola">⏳ en cola</span>' : '';
  const thumb = f.foto_path
    ? '<button class="thumb" data-foto="' + esc(f.foto_path) + '" aria-label="Ver factura"><span>📷</span></button>' : '';
  const importe = (f.relevar && !num(f.monto)) ? '$ —' : fmt$(montoEnt(f));
  const clase = f._src === 'obra' ? (PROY_CLASE[f.proyecto] || 'obra') : 'mio';
  // En obra ahora se ven los gastos de los tres: hay que decir quién pagó.
  const quien = f._src === 'obra'
    ? '<div class="f">' + (f.quien === YO ? 'Vos' : (NOMBRES[f.quien] || '')) + '</div>' : '';
  // v10: el lápiz aparece SOLO si el servidor sabe editar (ver
  // mantenimientoDisponible). Las de obra de OTRO hermano nunca lo llevan
  // (solo el que la cargó la puede editar). Y la hoja se abre SOLO tocando el
  // lápiz: tocar la fila entera hacía que, al recorrer el historial con el
  // pulgar, saltara la hoja encima de todo y pareciera que la app se trababa.
  const edita = editable(f);
  const k = claveFila(f);
  const lapiz = edita
    ? '<button class="ed-lapiz" data-k="' + esc(k) + '" aria-label="Editar ' + esc(f.descripcion || 'gasto') + '">✏️</button>' : '';
  const cls = 'gasto gasto--sinavatar gasto--' + clase + (thumb ? ' gasto--conthumb' : '') +
              (edita ? ' gasto--editable' : '');
  return '<div class="' + cls + '">' +
    '<div class="info"><div class="desc">' + esc(f.descripcion || '(sin detalle)') + '</div>' +
    '<div class="meta">' + chipFuente(f) + metodo + extra + rec + rev + cola + '</div></div>' +
    thumb +
    '<div class="importe"><div class="m money">' + importe + '</div>' + quien + '</div>' +
    lapiz +
  '</div>';
}

function renderHistorial(){
  const cont = $('hist-lista');
  if(!cacheObras && !cachePersonal) return;
  // Los pendientes primero (id = Infinity los deja arriba del día).
  const todas = mias().sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || num(b.id) - num(a.id));
  const filtradas = todas.filter(coincide);

  // Índice para la hoja de edición: de la fila del HTML al objeto real.
  filasIdx.clear();
  for(const f of filtradas) filasIdx.set(claveFila(f), f);

  const nPend = todas.filter(f => f._pendiente).length;
  const totalF = filtradas.reduce((s, f) => s + montoEnt(f), 0);
  $('hist-stats').textContent = filtradas.length
    ? filtradas.length + ' gasto' + (filtradas.length === 1 ? '' : 's') + ' · ' + fmt$(totalF) +
      (nPend ? ' · ⏳ ' + nPend + ' en cola' : '')
    : '';

  if(!filtradas.length){
    cont.innerHTML = avisoParcial() + (todas.length
      ? '<div class="vacio"><b>Nada con ese filtro</b>Probá con otra búsqueda.</div>'
      : '<div class="vacio"><b>Sin gastos todavía</b>Cargá el primero desde la pestaña Cargar.</div>');
    return;
  }

  let html = avisoParcial(), diaActual = null;
  for(const f of filtradas){
    if(f.fecha !== diaActual){
      diaActual = f.fecha;
      const delDia = filtradas.filter(x => x.fecha === f.fecha);
      const totDia = delDia.reduce((s, x) => s + montoEnt(x), 0);
      html += '<div class="dia-head"><span class="dia">' + esc(etiquetaDia(f.fecha)) + '</span>' +
              '<b class="money">' + fmt$(totDia) + '</b></div>';
    }
    html += filaHTML(f);
  }
  cont.innerHTML = html;
  cont.querySelectorAll('[data-foto]').forEach(el => {
    cargarThumb(el);
    el.addEventListener('click', e => { e.stopPropagation(); verFoto(el.dataset.foto); });
  });
  cont.querySelectorAll('.ed-lapiz[data-k]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); abrirEditor(el.dataset.k); });
  });
}

// Miniaturas: el bucket es privado → se bajan con la anon key y se cachean
const thumbCache = new Map();
async function bajarFoto(path){
  if(thumbCache.has(path)) return thumbCache.get(path);
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/facturas/' + path, {headers: H});
  if(!r.ok) throw new Error('foto');

  thumbCache.set(path, url);
  return url;

// Regla: TODA compra a crédito impacta los meses siguientes (aun en 1 cuota).
// Recurrentes: respetan el horizonte elegido — N meses en total (el gasto
// cargado cuenta como pago 1) o sin fin si no se puso límite.
// v10 — Crédito + recurrente: manda EL RECURRENTE (antes mandaba el crédito
// y por eso los fijos pagados con tarjeta desaparecían de la proyección).
function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const marca = f._src === 'obra' ? '🏗️ ' : '👤 ';
    const esCredito = f.metodo === 'credito';
    // v10 — FIX: un gasto que SE REPITE se proyecta todos los meses, se pague
    // como se pague. Antes la condicion era `f.es_recurrente && !esCredito`:
    // si el fijo estaba en tarjeta (que es lo normal — una suscripcion, la
    // publicidad), ganaba la rama de credito, se proyectaba UNA sola cuota y
    // al mes siguiente desaparecia del "Comprometido".
    if(f.es_recurrente){
      const N = num(f.recurrente_meses);          // 0 = sin fin
      for(let k = Math.max(0, base + 1); k < meses.length; k++){
        const nro = k - base + 1;                 // el gasto original fue el pago 1
        if(N && nro > N) break;
        meses[k].items.push({t: etiqueta,
                             sub: marca + (esCredito ? (f.tarjeta || 'Crédito') : (METODO_TXT[f.metodo] || f.metodo)),
                             rec:true, cuota: N ? nro + '/' + N : null, v: montoEnt(f)});
      }
    } else if(esCredito){
      const n = Math.max(1, num(f.cuotas) || 1);
      const cuota = montoEnt(f) / n;
      for(let i = 1; i <= n; i++){
        const k = base + i;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta, sub: marca + (f.tarjeta || 'Crédito'), cuota: i + '/' + n, v: cuota});
      }
    }
  }
  return meses;
}

function barPath(x, y, w, h, r){
  r = Math.min(r, h);
  return 'M' + x + ' ' + (y + h) + ' V' + (y + r) +
         ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
         ' H' + (x + w - r) +
         ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) +
         ' V' + (y + h) + ' Z';
}

// Barras apiladas: abajo la obra (cobre), arriba lo personal (acento).
// Solo el segmento de más arriba lleva las esquinas redondeadas.
function chartMeses(filasObra, filasPers){
  const hoy = new Date();
  const labs = [], vO = [], vP = [];
  for(let k = 5; k >= 0; k--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - k, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    labs.push(d.toLocaleDateString('es-AR', {month:'short'}).replace('.',''));
    vO.push(filasObra.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + montoEnt(f), 0));
    vP.push(filasPers.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + montoEnt(f), 0));
  }
  const tot = vO.map((v, i) => v + vP[i]);
  const max = Math.max(...tot, 1);
  const base = 124, top = 26, bw = 34;
  const gap = (320 - 6 * bw) / 7;
  const alto = v => v > 0 ? Math.max(v / max * (base - top), 2) : 0;

  let s = '<svg class="grafico" viewBox="0 0 320 150" role="img" aria-label="Gasto por mes: ' +
    labs.map((l, i) => l + ' ' + fmt$(tot[i])).join(', ') + '">';
  s += '<line x1="0" y1="' + (base + .5) + '" x2="320" y2="' + (base + .5) + '" stroke="rgba(232,226,213,.18)" stroke-width="1"/>';
  tot.forEach((v, i) => {
    const x = gap + (bw + gap) * i;
    const cur = i === 5;
    const op = cur ? '' : ' opacity=".55"';
    const hO = alto(vO[i]), hP = alto(vP[i]);
    const yTot = base - (hO + hP);
    if(hP > 0){
      s += '<path d="' + barPath(x, yTot, bw, hP, 4) + '" fill="' + ACCENT + '"' + op + '/>';
      if(hO > 0) s += '<rect x="' + x + '" y="' + (yTot + hP) + '" width="' + bw + '" height="' + hO + '" fill="#C98F5F"' + op + '/>';
    } else if(hO > 0){
      s += '<path d="' + barPath(x, yTot, bw, hO, 4) + '" fill="#C98F5F"' + op + '/>';
    } else {
      s += '<rect x="' + x + '" y="' + (base - 2) + '" width="' + bw + '" height="2" fill="rgba(232,226,213,.18)"/>';
    }
    s += '<text x="' + (x + bw/2) + '" y="' + (base - Math.max(hO + hP, 2) - 6) + '" class="g-val' + (cur ? ' g-val--cur' : '') + '" text-anchor="middle">' + (v ? fmtK(v) : '—') + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="142" class="g-lab" text-anchor="middle">' + esc(labs[i]) + '</text>';
  });
  s += '</svg>';
  s += '<div class="leyenda">' +
       '<span><i style="background:#C98F5F"></i>Obra</span>' +
       '<span><i style="background:' + ACCENT + '"></i>Personal</span></div>';
  return s;
}

function renderResumen(){

  const delMes = a => a.filter(f => f.fecha.startsWith(ym));

  const mesMio  = mesObra + mesPers;   // suma de enteros: cierra sola

  const meses = proyectar(todasMias).filter(m => m.items.length);

  // ===== HERO: lo mío de este mes, partido en dos =====
  let html = avisoParcial() +
    '<section class="hero">' +
      '<div class="etiqueta">Lo que gastaste este mes</div>' +
      '<div class="total money">' + fmt$(mesMio) + '</div>' +

        '<path d="M2 8 Q30 2 58 8 T114 8 T170 8 T226 8" fill="none" stroke="#C98F5F" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>' +
      '</svg>' +
      '<div class="leyenda">' +
        '<span><i style="background:#C98F5F"></i>Obra <b>' + fmt$(mesObra) + '</b></span>' +
        '<span><i style="background:' + ACCENT + '"></i>Personal <b>' + fmt$(mesPers) + '</b></span>' +
      '</div>' +
    '</section>';

  // ===== BLOQUE 1: OBRA FAGU =====
  const totalObraTodos = suma(obraTodos);

  const porProy = {};
  for(const f of obraTodos){
    porQuien[f.quien] = (porQuien[f.quien] || 0) + montoEnt(f);
    if(f.quien === YO) porProy[f.proyecto] = (porProy[f.proyecto] || 0) + montoEnt(f);
  }

  // porQuien sale de sumar enteros, asi que jose + facu + agus da exacto
  // totalObraTodos. Y lo que puso YO es la misma cifra en el stat card que
  // en su barra, porque es literalmente el mismo numero.
  const totalObraMia = porQuien[YO] || 0;

  html += '<div class="bloque"><h2>🏗️ Obra FAGU</h2>' +
          '<span class="bl-sub">entre los tres</span></div>';

  if(!obraTodos.length){
    html += '<div class="vacio"><b>Todavía no hay gastos de obra</b>Cargá el primero desde la pestaña Cargar.</div>';
  } else {
    html += '<div class="stat-grid">' +
      '<div class="stat-card stat-card--mio">' +
        '<div class="lbl">Lo que pusiste vos</div>' +
        '<div class="val money">' + fmt$(totalObraMia) + '</div>' +
        '<div class="sub">' + obraMia.length + ' gasto' + (obraMia.length === 1 ? '' : 's') + '</div>' +
      '</div>' +
      '<div class="stat-card stat-card--obra">' +
        '<div class="lbl">Total de la obra</div>' +
        '<div class="val money">' + fmt$(totalObraTodos) + '</div>' +
        '<div class="sub">' + obraTodos.length + ' gastos entre los tres</div>' +
      '</div></div>';

    // Quién puso cuánto — apilada + barras
    // ------------------------------------------------------------------
    // REGLA DE NEGOCIO (José, 15-ago-2026): la obra NO se divide en tres.
    // Cada hermano invierte lo que puede y recupera SU aporte cuando el
    // restaurante facture. Por eso acá no hay — ni puede haber — promedios,
    // "te deben", saldos entre hermanos ni partes iguales: solo el total y
    // el aporte acumulado de cada uno con su porcentaje real.

    const maxQ = Math.max(...Object.values(porQuien), 1);

          '<span class="quien">' + (q === YO ? 'Vos' : NOMBRES[q]) + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="--w:' + ((porQuien[q] || 0) / maxQ * 100).toFixed(1) + '%"></div></div>' +
          '<span class="cuanto money">' + fmt$(porQuien[q] || 0) +
            '<small style="display:block;font-weight:600;opacity:.6">' + pct(q).toFixed(1).replace('.', ',') + '%</small>' +

      'Lo que pusiste lo recuperás con la facturación del restaurante.</p>' +
      '</section>';

    // Si tocó las dos obras, cómo se repartió LO SUYO
    const proys = Object.keys(porProy).filter(p => porProy[p]);
    if(proys.length > 1){
      html += '<section class="card"><h3>Lo tuyo por obra</h3>' +
        proys.sort((a, b) => porProy[b] - porProy[a]).map(p =>

        '</section>';
    }
  }

  // ===== BLOQUE 2: MIS GASTOS PERSONALES =====
  const persMes = delMes(persMia);
  const totalPersHist = suma(persMia);
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const corte30 = isoLocal(d30);
  const pers30 = persMia.filter(f => f.fecha >= corte30);

  html += '<div class="bloque"><h2>👤 Mis gastos personales</h2>' +
          '<span class="bl-sub">solo tuyo</span></div>';

  if(!persMia.length){
    html += '<div class="vacio"><b>Todavía no cargaste nada personal</b>Cambiá el selector a 👤 Personal en Cargar.</div>';
  } else {
    html += '<div class="stat-grid">' +
      '<div class="stat-card stat-card--mio">' +
        '<div class="lbl">Este mes</div>' +
        '<div class="val money">' + fmt$(mesPers) + '</div>' +
        '<div class="sub">' + persMes.length + ' gasto' + (persMes.length === 1 ? '' : 's') + '</div>' +
      '</div>' +
      '<div class="stat-card stat-card--pearl">' +
        '<div class="lbl">Últimos 30 días</div>' +
        '<div class="val money">' + fmt$(suma(pers30)) + '</div>' +
        '<div class="sub">histórico ' + fmt$(totalPersHist) + '</div>' +
      '</div></div>';

    const porMetodo = {}, porTarjeta = {};
    for(const f of persMes){
      porMetodo[f.metodo] = (porMetodo[f.metodo] || 0) + montoEnt(f);
      if(f.tarjeta) porTarjeta[f.tarjeta] = (porTarjeta[f.tarjeta] || 0) + montoEnt(f);
    }
    const metodos = ['efectivo','transferencia','debito','credito'].filter(m => porMetodo[m]);
    if(metodos.length){
      const maxM = Math.max(...metodos.map(m => porMetodo[m]), 1);
      html += '<section class="card"><h3>Este mes por método</h3><div class="bars bars--metodo">' +
        metodos.map(m =>
          '<div class="bar-row bar-row--mio"><span class="quien">' + METODO_TXT[m] + '</span>' +
          '<div class="bar-track"><div class="bar-fill" style="--w:' + (porMetodo[m] / maxM * 100).toFixed(1) + '%"></div></div>' +
          '<span class="cuanto money">' + fmt$(porMetodo[m]) + '</span></div>').join('') +
        '</div></section>';
    }
    const tarjetas = Object.keys(porTarjeta);
    if(tarjetas.length){
      html += '<section class="card"><h3>Este mes por tarjeta</h3>' +
        tarjetas.sort((a, b) => porTarjeta[b] - porTarjeta[a]).map(t =>
          '<div class="tj-row"><span>' + esc(t) + '</span><b class="money">' + fmt$(porTarjeta[t]) + '</b></div>').join('') +
        '</section>';
    }
  }

  // ===== GASTO POR MES (lo mío, apilado) =====
  html += '<div class="bloque"><h2>Tu gasto mes a mes</h2></div>' +
          '<section class="card">' + chartMeses(obraMia, persMia) + '</section>';

  // ===== COMPROMISOS QUE VIENEN =====
  html += '<div class="bloque"><h2>Compromisos que vienen</h2></div>';
  if(meses.length){
    // Lo unico que todavia cae en decimales: dividir un gasto en cuotas
    // ($100.000 en 3). Cada mes reparte su propio redondeo para que las filas
    // den exacto el total del mes, y el comprometido suma esos totales.
    let comprometido = 0;
    html += meses.map(mes => {
      const t = mes.items.reduce((s, i) => s + i.v, 0);
      const itemsR = partesRedondeadas(t, mes.items.map(i => i.v));
      const tR = Math.round(t);
      comprometido += tR;
      let nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long'});
      nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      if(mes.y !== hoy.getFullYear()) nombre += ' ' + mes.y;
      return '<div class="mes-card">' +
        '<div class="mes-head"><span class="mes-nombre">' + esc(nombre) + '</span><span class="mes-total money">' + fmt$(tR) + '</span></div>' +
        mes.items.map((i, ix) =>
          '<div class="mes-item"><span class="dos-lineas">' +
            '<span class="mes-t">' + (i.rec ? '🔁 ' : '') + esc(i.t) + '</span>' +
            '<span class="mes-sub">' + esc(i.sub) + '</span></span>' +
          (i.cuota ? '<span class="cuota-n">' + i.cuota + '</span>' : '') +
          '<b class="money">' + fmt$(itemsR[ix]) + '</b></div>').join('') +
        '</div>';
    }).join('');
    html += '<p class="pie">Suma cuotas de crédito + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra. Total comprometido: ' + fmt$(comprometido) + '.</p>';
  } else {
    html += '<div class="vacio"><b>Nada proyectado</b>Sin cuotas pendientes ni gastos que se repitan.</div>';
  }

  $('res-contenido').innerHTML = html;
}

// ============================================================
// EDITAR / ELIMINAR (v8) — tocá una fila del Historial y se abre la hoja
// ============================================================
// Servidor: una RPC por app, cada una con SU clave (la maestra NUNCA viaja
// en el código de una app):
//   fila de obra → gasto_editar_obra / gasto_borrar_obra (clave familiar +
//                  `quien`: solo deja tocar filas cargadas por MÍ)
//   fila mía     → gasto_editar_facu / gasto_borrar_facu (mi clave;
//                  esas funciones solo saben escribir en gastos_facu)
// Cola local: si el gasto todavía no subió, se corrige/borra en el teléfono.
// Modo compatibilidad: si el SQL v8 todavía no corrió, la RPC no existe
// (404 / PGRST202) → se avisa amablemente y NO se toca nada.
const RPC_ED_OBRA = 'gasto_editar_obra';
const RPC_BO_OBRA = 'gasto_borrar_obra';
const RPC_ED_MIO  = 'gasto_editar_facu';
const RPC_BO_MIO  = 'gasto_borrar_facu';
const TARJETAS_ED = ['Visa','Mastercard'];

const filasIdx = new Map();
const claveFila = f => f._pendiente ? 'L' + f.local_id : (f._src || 'x') + ':' + f.id;

// v10 — DETECCION DE CAPACIDAD.
// El problema real de v8: la app mostraba el lapiz en TODAS las filas y
// prometia "editar / eliminar" aunque el SQL v8 no estuviera corrido en la
// base. Recien despues de llenar el formulario y tocar Guardar avisaba que
// no. Ahora se pregunta UNA vez (una por RPC: la de obra y la mia) y, si el
// servidor no sabe editar, la app simplemente no ofrece editar.
//   null = todavia no se pregunto · true = hay RPC · false = no hay
let mantenimientoOK = null;                 // resumen: true si al menos una anda
const mantOK = {obra: null, mio: null};     // detalle por RPC

async function sabeEditar(rpc, body){
  try{
    // fila_id 0 no existe nunca: si la funcion esta, contesta 0 filas tocadas.
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + rpc, {
      method:'POST', headers:{...H, 'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    let txt = ''; try{ txt = await r.text(); }catch(e){}
    return !esNubeNoLista(r.status, txt);
  }catch(e){
    return false;   // sin senal: no prometemos lo que no podemos cumplir
  }
}

async function mantenimientoDisponible(){
  if(mantenimientoOK !== null) return mantenimientoOK;
  const [obra, mio] = await Promise.all([
    sabeEditar(RPC_ED_OBRA, {clave: CLAVE_OBRAS, quien: YO, fila_id: 0}),
    sabeEditar(RPC_ED_MIO,  {clave: CLAVE_PERSONAL, fila_id: 0}),
  ]);
  mantOK.obra = obra; mantOK.mio = mio;
  mantenimientoOK = obra || mio;
  return mantenimientoOK;
}

// Los gastos de obra de otro hermano se ven pero no se tocan.
function editable(f){
  // En cola = todavia esta en el telefono: se corrige aca, sin servidor.
  if(f._pendiente) return !!f.local_id;
  if(f.id == null || !isFinite(num(f.id))) return false;
  if(f._src === 'obra') return f.quien === YO && mantOK.obra !== false;
  return mantOK.mio !== false;
}

let ed = null;   // {f, esObra, orig, sel}

function abrirEditor(k){
  const f = filasIdx.get(k);
  if(!f || !editable(f)) return;
  const esObra = f._src === 'obra';
  const orig = {
    monto:       Math.round(num(f.monto)),
    descripcion: f.descripcion || '',
    fecha:       f.fecha || hoyLocal(),
    metodo:      f.metodo || 'efectivo',
    tarjeta:     f.tarjeta || '',
    cuotas:      Math.max(1, num(f.cuotas) || 1),
    proyecto:    f.proyecto || 'fagu_obra',
  };
  ed = {f, esObra, orig, sel: {...orig}};

  $('ed-sub').textContent = (esObra ? '🏗️ Gasto de la obra · ' : '👤 Gasto tuyo · ') +
                            etiquetaDia(orig.fecha) + (f._pendiente ? ' · ⏳ todavía en el teléfono' : '');
  $('ed-monto').value = orig.monto ? orig.monto.toLocaleString('es-AR') : '';
  $('ed-desc').value  = orig.descripcion;
  $('ed-fecha').value = orig.fecha;
  $('ed-tarjeta-otra').value = '';
  $('ed-tarjeta-otra').hidden = true;

  $('ed-grupo-proyecto').hidden = !esObra;
  pintarChipsEd('ed-chips-proyecto', orig.proyecto);
  // En la obra se paga en efectivo o transferencia; en lo tuyo, los 4.
  document.querySelectorAll('#ed-chips-metodo .chip').forEach(c => {
    c.classList.toggle('off', esObra && !METODOS_OBRA.includes(c.dataset.v));
  });
  pintarChipsEd('ed-chips-metodo', orig.metodo);
  aplicarMetodoEd();

  $('ed-confirmar').hidden = true;
  $('ed-borrar').hidden = false;
  $('ed-nota').hidden = true;
  $('ed-guardar').disabled = false; $('ed-guardar').textContent = 'Guardar cambios';
  abrirHoja();
}

function abrirHoja(){
  $('ed-fondo').hidden = false; $('ed-hoja').hidden = false;
  requestAnimationFrame(() => {
    $('ed-fondo').classList.add('show');
    $('ed-hoja').classList.add('show');
    $('ed-hoja').scrollTop = 0;
    $('ed-hoja').focus();
  });
  document.body.style.overflow = 'hidden';
}
function cerrarEditor(){
  $('ed-hoja').classList.remove('show');
  $('ed-fondo').classList.remove('show');
  setTimeout(() => { $('ed-hoja').hidden = true; $('ed-fondo').hidden = true; }, 220);
  document.body.style.overflow = '';
  ed = null;
}
$('ed-cerrar').addEventListener('click', cerrarEditor);
$('ed-fondo').addEventListener('click', cerrarEditor);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ed) cerrarEditor(); });

function pintarChipsEd(id, valor){
  document.querySelectorAll('#' + id + ' .chip').forEach(c => c.classList.toggle('on', c.dataset.v === String(valor)));
}
function initChipsEd(id, campo, cb){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b || b.classList.contains('off') || !ed) return;
    $(id).querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    ed.sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}
initChipsEd('ed-chips-proyecto','proyecto');
initChipsEd('ed-chips-metodo','metodo', aplicarMetodoEd);
initChipsEd('ed-chips-tarjeta','tarjeta', v => { $('ed-tarjeta-otra').hidden = v !== '__otra'; });
initChipsEd('ed-chips-cuotas','cuotas');

function aplicarMetodoEd(){
  if(!ed) return;
  const m = ed.sel.metodo;
  const conTarjeta = m === 'debito' || m === 'credito';
  $('ed-grupo-tarjeta').hidden = !conTarjeta;
  $('ed-grupo-cuotas').hidden = m !== 'credito';
  if(conTarjeta) pintarTarjetasEd(); else $('ed-tarjeta-otra').hidden = true;
  if(m === 'credito') pintarCuotasEd();
}
// Las opciones incluyen SIEMPRE lo que ya tenía la fila (aunque sea una
// tarjeta o un plan de cuotas que la app no ofrece hoy).
function pintarTarjetasEd(){
  const t = ed.sel.tarjeta && ed.sel.tarjeta !== '__otra' ? ed.sel.tarjeta : '';
  const lista = TARJETAS_ED.slice();
  if(t && lista.indexOf(t) === -1) lista.push(t);
  $('ed-chips-tarjeta').innerHTML =
    lista.map(x => '<button class="chip' + (x === t ? ' on' : '') + '" data-v="' + esc(x) + '">' + esc(x) + '</button>').join('') +
    '<button class="chip' + (t ? '' : ' on') + '" data-v="__otra">Otra</button>';
  $('ed-tarjeta-otra').hidden = !!t;
}
function pintarCuotasEd(){
  const n = Math.max(1, num(ed.sel.cuotas) || 1);
  const lista = [1,3,6,12];
  if(lista.indexOf(n) === -1) lista.push(n);
  lista.sort((a,b) => a-b);
  $('ed-chips-cuotas').innerHTML = lista.map(x =>
    '<button class="chip' + (x === n ? ' on' : '') + '" data-v="' + x + '">' + x + '</button>').join('');
}

$('ed-monto').addEventListener('input', () => {
  const n = $('ed-monto').value.replace(/\D/g,'');
  $('ed-monto').value = n ? Number(n).toLocaleString('es-AR') : '';
});

// Una llamada de mantenimiento. Devuelve {n} | {compat:true} | {error}
async function rpcMant(nombre, body){
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nombre, {
      method:'POST', headers:{...H, 'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    let txt = ''; try{ txt = await r.text(); }catch(e){}
    if(r.ok) return {n: Number(txt) || 0};
    if(esNubeNoLista(r.status, txt)) return {compat:true};
    return {error: txt || ('HTTP ' + r.status)};
  }catch(e){ return {error: String((e && e.message) || e)}; }
}

// Cola local (el gasto todavía no llegó al servidor)
function aplicarACola(it, c){
  if('nuevo_monto' in c)       it.monto = c.nuevo_monto;
  if('nueva_descripcion' in c) it.descripcion = c.nueva_descripcion;
  if('nueva_fecha' in c)       it.fecha = c.nueva_fecha;
  if('nuevo_metodo' in c)      it.metodo = c.nuevo_metodo;
  if('nueva_tarjeta' in c)     it.tarjeta = c.nueva_tarjeta;
  if('nuevas_cuotas' in c)     it.cuotas = c.nuevas_cuotas;
  if('nuevo_proyecto' in c)    it.proyecto = c.nuevo_proyecto;
  // Mismas reglas que la base, para que suba coherente
  if(it.metodo !== 'credito' && it.metodo !== 'debito') it.tarjeta = null;
  if(it.metodo !== 'credito') it.cuotas = 1;
  if(num(it.monto) > 0) it.relevar = false;
}
function editarEnCola(f, c){
  const hist = leerLS();
  const it = hist.find(x => x.local_id && x.local_id === f.local_id);
  if(!it) return {n:0};
  aplicarACola(it, c);
  escribirLS(hist);
  return {n:1};
}
function borrarDeCola(f){
  const antes = leerLS();
  const hist = antes.filter(x => !(x.local_id && x.local_id === f.local_id));
  escribirLS(hist);
  refrescarPendientes();
  return {n: antes.length - hist.length};
}

function notaEd(msg, tipo){
  $('ed-nota').textContent = msg;
  $('ed-nota').hidden = false;
  toast(msg, tipo || 'warn');
}
const MSG_COMPAT = 'La edición se habilita en unos minutos — tu gasto quedó igual';

// soloLocal = el gasto estaba en la cola del teléfono: no hay nada que
// volver a pedirle al servidor, alcanza con redibujar.
async function terminarEd(res, msgOk, soloLocal){
  const btnG = $('ed-guardar');
  btnG.disabled = false; btnG.textContent = 'Guardar cambios';
  $('ed-si').disabled = false; $('ed-si').textContent = 'Sí, borrar';
  if(res.compat){ notaEd(MSG_COMPAT); return; }
  if(res.error){ notaEd(navigator.onLine ? 'No se pudo guardar — probá de nuevo' : 'Sin conexión — probá al volver la señal', 'error'); return; }
  if(!res.n){ notaEd('Ese gasto ya no está — actualizá el historial'); return; }
  if(navigator.vibrate) navigator.vibrate(30);
  cerrarEditor();
  toast(msgOk, 'ok');
  if(soloLocal){ await abrirHistorial(); return; }
  invalidarCache();
  await abrirHistorial(true);     // lista y totales al día
}

$('ed-guardar').addEventListener('click', async () => {
  if(!ed) return;
  const f = ed.f, o = ed.orig, s = ed.sel;
  const monto = Number(($('ed-monto').value || '').replace(/\D/g,''));
  if(!monto && !f.foto_path){ toast('Poné un monto'); $('ed-monto').focus(); return; }
  const desc  = $('ed-desc').value.trim();
  const fecha = $('ed-fecha').value || o.fecha;
  const esCredito = s.metodo === 'credito';
  const conTarjeta = esCredito || s.metodo === 'debito';
  let tarjeta = '';
  if(conTarjeta){
    tarjeta = s.tarjeta === '__otra' ? ($('ed-tarjeta-otra').value.trim() || 'Otra') : (s.tarjeta || '');
  }
  const cuotas = esCredito ? Math.max(1, num(s.cuotas) || 1) : 1;

  // Solo se manda lo que cambió: nada de reescribir campos por las dudas.
  const c = {};
  if(monto !== o.monto) c.nuevo_monto = monto;
  if(desc !== o.descripcion) c.nueva_descripcion = desc;
  if(fecha !== o.fecha) c.nueva_fecha = fecha;
  if(s.metodo !== o.metodo) c.nuevo_metodo = s.metodo;
  if(conTarjeta && tarjeta && tarjeta !== o.tarjeta) c.nueva_tarjeta = tarjeta;
  if(esCredito && cuotas !== o.cuotas) c.nuevas_cuotas = cuotas;
  if(ed.esObra && s.proyecto !== o.proyecto) c.nuevo_proyecto = s.proyecto;
  if(!Object.keys(c).length){ toast('No cambiaste nada'); cerrarEditor(); return; }

  $('ed-guardar').disabled = true; $('ed-guardar').textContent = 'Guardando…';
  $('ed-nota').hidden = true;
  const enCola = !!f._pendiente;
  const res = enCola
    ? editarEnCola(f, c)
    : await rpcMant(ed.esObra ? RPC_ED_OBRA : RPC_ED_MIO,
        ed.esObra ? {clave: CLAVE_OBRAS, quien: YO, fila_id: f.id, ...c}
                  : {clave: CLAVE_PERSONAL, fila_id: f.id, ...c});
  await terminarEd(res, '✓ Cambios guardados', enCola);
});

// Borrar: dos pasos, siempre.
$('ed-borrar').addEventListener('click', () => {
  $('ed-confirmar').hidden = false;
  $('ed-borrar').hidden = true;
  $('ed-confirmar').scrollIntoView({block:'nearest', behavior:'smooth'});
});
$('ed-no').addEventListener('click', () => {
  $('ed-confirmar').hidden = true;
  $('ed-borrar').hidden = false;
});
$('ed-si').addEventListener('click', async () => {
  if(!ed) return;
  const f = ed.f;
  const enCola = !!f._pendiente;
  $('ed-si').disabled = true; $('ed-si').textContent = 'Borrando…';
  const res = enCola
    ? borrarDeCola(f)
    : await rpcMant(ed.esObra ? RPC_BO_OBRA : RPC_BO_MIO,
        ed.esObra ? {clave: CLAVE_OBRAS, quien: YO, fila_id: f.id}
                  : {clave: CLAVE_PERSONAL, fila_id: f.id});
  if(!res.n || res.compat || res.error){       // no se borró: vuelve el botón
    $('ed-confirmar').hidden = true; $('ed-borrar').hidden = false;
  }
  await terminarEd(res, '✓ Gasto eliminado', enCola);
});

// ---------- arranque ----------
if(location.hash === '#historial') setVista('historial');
if(location.hash === '#resumen' || location.hash === '#proximos') setVista('resumen');
pintarRec();
reintentarPendientes(false);
refrescarPendientes();
// Si el navegador no deja registrar el worker (modo incognito, política del
// equipo), la app funciona igual online: no ensuciamos la consola por eso.
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
