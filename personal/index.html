<script>
const SUPABASE_URL = 'https://kfiywiqivibktzakclyv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaXl3aXFpdmlia3R6YWtjbHl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTA1MTgsImV4cCI6MjA5ODc4NjUxOH0.Z1DQW5ySGolzrjsqeesg824cpctqa04BOS2RSH4NTNo';
const TABLA = 'gastos_jose';
const RPC_LISTA = 'gastos_jose_lista';

const CLAVE_KEY = 'gastos_jose_clave';
const H = {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY};

const METODO_TXT = {efectivo:'Efectivo', transferencia:'Transferencia', debito:'Débito', credito:'Crédito'};
const CAT_TXT = {personal:'Personal', negocio:'Negocio'};

const sel = { fecha:'hoy', categoria:'personal', metodo:'efectivo', tarjeta:'Visa Francés BBVA', cuotas:1, recurrente:false };
const filtro = { q:'', categoria:'todos', metodo:'todos' };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const fmtK = n => n >= 1e6 ? (n/1e6).toLocaleString('es-AR', {maximumFractionDigits:1}) + ' M'
              : n >= 1e3 ? Math.round(n/1e3) + ' k' : String(Math.round(n));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));

let toastTimer = null;
function toast(msg, tipo){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' toast--' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const hoyLocal = () => isoLocal(new Date());
function fechaElegida(){
  if(sel.fecha === 'otra') return $('fecha').value || hoyLocal();
  if(sel.fecha === 'ayer'){ const d = new Date(); d.setDate(d.getDate()-1); return isoLocal(d); }
  return hoyLocal();
}
function etiquetaDia(fechaISO){
  const d = new Date(); d.setDate(d.getDate()-1);
  const ayer = isoLocal(d);
  const [y, m, dd] = fechaISO.split('-').map(Number);
  const txt = new Date(y, m-1, dd).toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
  if(fechaISO === hoyLocal()) return 'Hoy · ' + txt;
  if(fechaISO === ayer) return 'Ayer · ' + txt;
  return txt;
}

const mesNombre = new Date().toLocaleDateString('es-AR', {month:'long'});
$('periodo').textContent = mesNombre.charAt(0).toUpperCase() + mesNombre.slice(1);

// ---------- chips del form ----------
function initChips(id, campo, cb){
  const box = $(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b || b.classList.contains('off')) return;
    box.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}

initChips('chips-categoria','categoria');
initChips('chips-fecha','fecha', v => {
  const f = $('fecha');
  f.hidden = v !== 'otra';
  if(v === 'otra' && !f.value) f.value = hoyLocal();
});
initChips('chips-metodo','metodo', aplicarGruposTarjeta);
initChips('chips-tarjeta','tarjeta', v => { $('tarjeta-otra').hidden = v !== '__otra'; });
initChips('chips-cuotas','cuotas');

function aplicarGruposTarjeta(){
  const conTarjeta = sel.metodo === 'debito' || sel.metodo === 'credito';
  $('grupo-tarjeta').hidden = !conTarjeta;
  $('grupo-cuotas').hidden = sel.metodo !== 'credito';
  if(!conTarjeta) $('tarjeta-otra').hidden = true;
  else $('tarjeta-otra').hidden = sel.tarjeta !== '__otra';
}
aplicarGruposTarjeta();

const recEl = $('recurrente');
recEl.addEventListener('click', () => {
  sel.recurrente = !sel.recurrente;
  recEl.classList.toggle('on', sel.recurrente);
});

// ---------- monto ----------
const montoEl = $('monto');
montoEl.addEventListener('input', () => {
  const n = montoEl.value.replace(/\D/g,'');
  montoEl.value = n ? Number(n).toLocaleString('es-AR') : '';
});

// ---------- persistencia local + POST resiliente ----------
function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function escribirLS(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }

// Resiliencia de esquema: si la DB todavía no tiene la columna `categoria`
// (falta correr SETUP-GASTOS-V5.sql) o `local_id`, se reintenta sin esa
// columna y la app sigue andando igual.
// Anti-duplicados: el local_id es UNIQUE en la DB; un reintento de un gasto
// que ya llegó contesta 409 (duplicado) y se toma como "ya guardado".
// No se usa on_conflict/ignore-duplicates: el RLS insert-only no lo permite.
let localIdSoportado = true;
let categoriaSoportada = true;

async function postSupabase(gasto){
  const intento = (conLocalId, conCategoria) => {
    const body = {...gasto};
    if(!conLocalId) delete body.local_id;
    if(!conCategoria) delete body.categoria;
    return fetch(SUPABASE_URL + '/rest/v1/' + TABLA, {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify(body),
    });
  };
  for(let i = 0; i < 3; i++){
    const usaLocal = localIdSoportado && !!gasto.local_id;
    const usaCat = categoriaSoportada && gasto.categoria != null;
    const r = await intento(usaLocal, usaCat);
    if(r.ok) return true;
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(r.status === 409 && /23505|duplicate/i.test(msg)) return true;   // ya estaba
    if(usaCat && /categoria/i.test(msg)){ categoriaSoportada = false; continue; }
    if(usaLocal && /local_id/i.test(msg)){ localIdSoportado = false; continue; }
    if(usaCat || usaLocal){ categoriaSoportada = false; localIdSoportado = false; continue; }
    return false;
  }
  return false;
}

function refrescarPendientes(){
  const n = leerLS().filter(x => x.estado === 'pendiente').length;
  const el = $('pendientes');
  el.textContent = n ? ('⚠ ' + n + ' en cola sin sincronizar — tocá para reintentar') : '';
  el.classList.toggle('show', n > 0);
}

let reintentando = false;
async function reintentarPendientes(avisar){
  if(reintentando || !navigator.onLine) { refrescarPendientes(); return; }
  reintentando = true;
  const hist = leerLS();
  let enviados = 0;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    const {estado, ...gasto} = item;   // el local_id VIAJA con el gasto (dedup)
    if(gasto.local_id != null) gasto.local_id = String(gasto.local_id);
    try{ if(await postSupabase(gasto)){ item.estado = 'ok'; enviados++; } }catch(e){}
  }
  if(enviados){ escribirLS(hist); filasCache = null; }
  reintentando = false;
  refrescarPendientes();
  if(avisar && enviados) toast('✓ ' + enviados + ' gasto(s) sincronizado(s)', 'ok');
}

$('pendientes').addEventListener('click', () => reintentarPendientes(true));
window.addEventListener('online', () => reintentarPendientes(true));
setInterval(() => { if(leerLS().some(x => x.estado === 'pendiente')) reintentarPendientes(false); }, 60000);

// ---------- guardar ----------
const btn = $('guardar');
btn.addEventListener('click', async () => {
  const monto = Number(montoEl.value.replace(/\D/g,''));
  if(!monto){ montoEl.focus(); return; }
  const esCredito = sel.metodo === 'credito';
  const conTarjeta = esCredito || sel.metodo === 'debito';
  let tarjeta = null;
  if(conTarjeta){
    tarjeta = sel.tarjeta === '__otra'
      ? ($('tarjeta-otra').value.trim() || 'Otra')
      : sel.tarjeta;
  }
  btn.disabled = true; btn.textContent = 'Guardando…';

  const gasto = {
    fecha: fechaElegida(),
    monto: monto,
    descripcion: $('descripcion').value.trim(),
    categoria: sel.categoria,
    metodo: sel.metodo,
    tarjeta: tarjeta,
    cuotas: esCredito ? sel.cuotas : 1,
    es_recurrente: sel.recurrente,
    local_id: uuid(),
  };

  const hist = leerLS();
  const item = {...gasto, estado:'pendiente'};
  hist.push(item); escribirLS(hist);

  let ok = false;
  try{ ok = await postSupabase(gasto); }catch(e){}
  if(ok){ item.estado = 'ok'; escribirLS(hist); }
  filasCache = null;

  if(navigator.vibrate) navigator.vibrate(ok ? 30 : [60,60,60]);
  btn.classList.add('ok');
  btn.textContent = ok ? '✓ Guardado' : '✓ Guardado acá';
  if(!ok){
    toast(navigator.onLine
      ? 'No se pudo guardar en el servidor — quedó en cola y se reintenta solo'
      : 'Sin conexión — quedó en cola, se envía al volver la señal', 'error');
  } else {
    toast('✓ Guardado — ya figura arriba del Historial', 'ok');
  }
  setTimeout(() => {
    btn.classList.remove('ok'); btn.disabled = false; btn.textContent = 'Guardar gasto';
    montoEl.value = ''; $('descripcion').value = '';
    sel.fecha = 'hoy'; $('fecha').hidden = true; $('fecha').value = '';
    document.querySelectorAll('#chips-fecha .chip').forEach(c => c.classList.toggle('on', c.dataset.v === 'hoy'));
    sel.categoria = 'personal';
    document.querySelectorAll('#chips-categoria .chip').forEach(c => c.classList.toggle('on', c.dataset.v === 'personal'));
    sel.recurrente = false; recEl.classList.remove('on');
  }, 1500);
  refrescarPendientes();
});

$('exportar').addEventListener('click', () => {
  const data = JSON.stringify(leerLS(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gastos-jose-respaldo.json';
  a.click();
});

// ---------- datos ----------
let filasCache = null;
async function traerFilas(force){
  if(filasCache && !force) return filasCache;
  const clave = localStorage.getItem(CLAVE_KEY);
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + RPC_LISTA, {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({clave}),
  });
  if(!r.ok) throw new Error('server');
  const filas = await r.json();
  filasCache = Array.isArray(filas) ? filas : [];
  return filasCache;
}

// Mientras la DB no devuelva `categoria`, se completa con lo guardado en el
// teléfono (por local_id). Sin dato → 'personal'.
function mapaCategoriasLocal(){
  const m = {};
  for(const x of leerLS()) if(x.local_id && x.categoria) m[x.local_id] = x.categoria;
  return m;
}
const categoriaDe = (f, mapa) => f.categoria || (f.local_id && mapa[f.local_id]) || 'personal';

// ---------- vistas ----------
let destinoConClave = 'historial';
function setVista(v){
  ['cargar','gate','historial','resumen'].forEach(x => { $('vista-' + x).hidden = x !== v; });
  $('tab-cargar').classList.toggle('act', v === 'cargar');
  $('tab-historial').classList.toggle('act', v === 'historial' || (v === 'gate' && destinoConClave === 'historial'));
  $('tab-resumen').classList.toggle('act', v === 'resumen' || (v === 'gate' && destinoConClave === 'resumen'));
  if(v === 'historial') abrirHistorial();
  if(v === 'resumen') abrirResumen();
}
function pedirVista(v){
  if((v === 'historial' || v === 'resumen') && !localStorage.getItem(CLAVE_KEY)){
    destinoConClave = v; setVista('gate'); return;
  }
  setVista(v);
}
$('tab-cargar').addEventListener('click', () => setVista('cargar'));
$('tab-historial').addEventListener('click', () => pedirVista('historial'));
$('tab-resumen').addEventListener('click', () => pedirVista('resumen'));
$('refrescar-hist').addEventListener('click', () => abrirHistorial(true));
$('refrescar-res').addEventListener('click', () => abrirResumen(true));

$('clave-ok').addEventListener('click', () => {
  const v = $('clave-input').value.trim();
  if(!v) return;
  localStorage.setItem(CLAVE_KEY, v);
  setVista(destinoConClave);
});
function olvidarClave(destino){
  localStorage.removeItem(CLAVE_KEY);
  filasCache = null;
  pedirVista(destino);
}
$('cambiar-clave-h').addEventListener('click', () => olvidarClave('historial'));
$('cambiar-clave-r').addEventListener('click', () => olvidarClave('resumen'));

// ---------- HISTORIAL ----------
let buscaTimer = null;
$('buscador').addEventListener('input', () => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(() => { filtro.q = $('buscador').value.trim().toLowerCase(); renderHistorial(); }, 180);
});
function initFiltro(id, campo){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    $(id).querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    filtro[campo] = b.dataset.v;
    renderHistorial();
  });
}
initFiltro('filtro-categoria','categoria');
initFiltro('filtro-metodo','metodo');

async function abrirHistorial(force){
  const cont = $('hist-lista');
  $('cambiar-clave-h').hidden = true;
  if(!filasCache || force){
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    $('hist-stats').textContent = '';
    try{ await traerFilas(true); }
    catch(e){
      cont.innerHTML = '<div class="vacio"><b>' + (navigator.onLine ? 'Error del servidor' : 'Sin conexión') + '</b>Tocá ↻ Actualizar para probar de nuevo.</div>';
      return;
    }
  }
  renderHistorial();
  $('cambiar-clave-h').hidden = false;
}

function coincide(f, mapa){
  if(filtro.categoria !== 'todos' && categoriaDe(f, mapa) !== filtro.categoria) return false;
  if(filtro.metodo !== 'todos' && f.metodo !== filtro.metodo) return false;
  if(!filtro.q) return true;
  const blob = [f.descripcion, f.tarjeta, METODO_TXT[f.metodo],
                CAT_TXT[categoriaDe(f, mapa)], String(f.monto)].join(' ').toLowerCase();
  return blob.includes(filtro.q);
}

function filaHTML(f, mapa){
  const cat = categoriaDe(f, mapa);
  const badge = f.metodo === 'credito'
    ? '<span class="badge badge--credito">Crédito ' + (Number(f.cuotas) || 1) + '×</span>'
    : '<span class="badge">' + (METODO_TXT[f.metodo] || esc(f.metodo)) + '</span>';
  const extra = f.tarjeta ? '<span class="extra">' + esc(f.tarjeta) + '</span>' : '';
  const rec = f.es_recurrente ? '<span class="badge badge--recurrente">🔁 fijo</span>' : '';
  const neg = cat === 'negocio' ? '<span class="badge badge--negocio">Negocio</span>' : '';
  const cola = f._pendiente ? '<span class="badge badge--cola">⏳ en cola</span>' : '';
  return '<div class="gasto gasto--sinavatar gasto--' + cat + '">' +
    '<div class="info"><div class="desc">' + esc(f.descripcion || '(sin detalle)') + '</div>' +
    '<div class="meta">' + badge + extra + neg + rec + cola + '</div></div>' +
    '<div class="importe"><div class="m money">' + fmt$(Number(f.monto)) + '</div>' +
    '<div class="f">' + CAT_TXT[cat] + '</div></div>' +
  '</div>';
}

function renderHistorial(){
  const cont = $('hist-lista');
  if(!filasCache) return;
  const mapa = mapaCategoriasLocal();
  const enServer = new Set(filasCache.map(f => f.local_id).filter(Boolean));
  const pendientes = leerLS()
    .filter(x => x.estado === 'pendiente' && !enServer.has(x.local_id))
    .map(x => ({...x, _pendiente:true, id: Infinity}));
  const todas = [...pendientes, ...filasCache]
    .sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.id || 0) - (a.id || 0));
  const filtradas = todas.filter(f => coincide(f, mapa));

  const totalF = filtradas.reduce((s, f) => s + Number(f.monto), 0);
  $('hist-stats').textContent = filtradas.length
    ? filtradas.length + ' gasto' + (filtradas.length === 1 ? '' : 's') + ' · ' + fmt$(totalF)
    : '';

  if(!filtradas.length){
    cont.innerHTML = filasCache.length || pendientes.length
      ? '<div class="vacio"><b>Nada con ese filtro</b>Probá con otra búsqueda.</div>'
      : '<div class="vacio"><b>Sin datos</b>¿La clave está bien?</div>';
    return;
  }

  let html = '', diaActual = null;
  for(const f of filtradas){
    if(f.fecha !== diaActual){
      diaActual = f.fecha;
      const delDia = filtradas.filter(x => x.fecha === f.fecha);
      const totDia = delDia.reduce((s, x) => s + Number(x.monto), 0);
      html += '<div class="dia-head"><span class="dia">' + esc(etiquetaDia(f.fecha)) + '</span>' +
              '<b class="money">' + fmt$(totDia) + '</b></div>';
    }
    html += filaHTML(f, mapa);
  }
  cont.innerHTML = html;
}

// ---------- RESUMEN ----------
async function abrirResumen(force){
  const cont = $('res-contenido');
  $('cambiar-clave-r').hidden = true;
  $('actualizado').textContent = '';
  if(!filasCache || force){
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    try{ await traerFilas(true); }
    catch(e){
      cont.innerHTML = '<div class="vacio"><b>' + (navigator.onLine ? 'Error del servidor' : 'Sin conexión') + '</b>Tocá ↻ Actualizar para probar de nuevo.</div>';
      return;
    }
  }
  if(!filasCache.length){
    cont.innerHTML = '<div class="vacio"><b>Sin datos</b>¿La clave está bien?</div>';
    $('cambiar-clave-r').hidden = false;
    return;
  }
  renderResumen(filasCache);
  $('cambiar-clave-r').hidden = false;
  $('actualizado').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
}

// Regla: TODA compra a crédito impacta los meses siguientes (aun en 1 cuota).
// Recurrentes cada mes; crédito + recurrente: manda el crédito (sin doble conteo).
function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const esCredito = f.metodo === 'credito';
    if(f.es_recurrente && !esCredito){
      for(let k = Math.max(0, base + 1); k < meses.length; k++)
        meses[k].items.push({t: etiqueta, sub: METODO_TXT[f.metodo] || f.metodo, rec:true, v: Number(f.monto)});
    }
    if(esCredito){
      const n = Math.max(1, Number(f.cuotas) || 1);
      const cuota = Number(f.monto) / n;
      for(let i = 1; i <= n; i++){
        const k = base + i;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta, sub: f.tarjeta || 'Crédito', cuota: i + '/' + n, v: cuota});
      }
    }
  }
  return meses;
}

function barPath(x, y, w, h, r){
  r = Math.min(r, h);
  return 'M' + x + ' ' + (y + h) + ' V' + (y + r) +
         ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
         ' H' + (x + w - r) +
         ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) +
         ' V' + (y + h) + ' Z';
}

function chartMeses(filas, color){
  const hoy = new Date();
  const labs = [], vals = [];
  for(let k = 5; k >= 0; k--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - k, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    labs.push(d.toLocaleDateString('es-AR', {month:'short'}).replace('.',''));
    vals.push(filas.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + Number(f.monto), 0));
  }
  const max = Math.max(...vals, 1);
  const W = 320, base = 124, top = 26, bw = 34;
  const gap = (W - 6 * bw) / 7;
  let s = '<svg class="grafico" viewBox="0 0 320 150" role="img" aria-label="Gasto por mes: ' +
    labs.map((l, i) => l + ' ' + fmt$(vals[i])).join(', ') + '">';
  s += '<line x1="0" y1="' + (base + .5) + '" x2="320" y2="' + (base + .5) + '" stroke="rgba(232,226,213,.18)" stroke-width="1"/>';
  vals.forEach((v, i) => {
    const x = gap + (bw + gap) * i;
    const h = Math.max(v / max * (base - top), 2);
    const y = base - h;
    const cur = i === 5;
    s += '<path d="' + barPath(x, y, bw, h, 4) + '" fill="' + color + '"' + (cur ? '' : ' opacity=".55"') + '/>';
    s += '<text x="' + (x + bw/2) + '" y="' + (y - 6) + '" class="g-val' + (cur ? ' g-val--cur' : '') + '" text-anchor="middle">' + (v ? fmtK(v) : '—') + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="142" class="g-lab" text-anchor="middle">' + esc(labs[i]) + '</text>';
  });
  s += '</svg>';
  return s;
}

function renderResumen(filas){
  const mapa = mapaCategoriasLocal();
  const hoy = new Date();
  const ym = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0');
  const delMes = filas.filter(f => f.fecha.startsWith(ym));
  const totalMes = delMes.reduce((s, f) => s + Number(f.monto), 0);
  const totalHist = filas.reduce((s, f) => s + Number(f.monto), 0);

  const porCat = {personal:0, negocio:0};
  const porMetodo = {};
  const porTarjeta = {};
  for(const f of delMes){
    porCat[categoriaDe(f, mapa)] += Number(f.monto);
    porMetodo[f.metodo] = (porMetodo[f.metodo] || 0) + Number(f.monto);
    if(f.tarjeta) porTarjeta[f.tarjeta] = (porTarjeta[f.tarjeta] || 0) + Number(f.monto);
  }
  const pctCat = c => totalMes ? (porCat[c] / totalMes * 100) : 0;

  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const corte30 = isoLocal(d30);
  const ult30 = filas.filter(f => f.fecha >= corte30);
  const total30 = ult30.reduce((s, f) => s + Number(f.monto), 0);

  const meses = proyectar(filas).filter(m => m.items.length);
  const comprometido = meses.reduce((s, m) => s + m.items.reduce((x, i) => x + i.v, 0), 0);

  // HERO: gastado este mes + onda firma + split Negocio / Personal
  let html =
    '<section class="hero">' +
      '<div class="etiqueta">Gastado este mes</div>' +
      '<div class="total money">' + fmt$(totalMes) + '</div>' +
      '<svg class="onda" viewBox="0 0 220 14" aria-hidden="true">' +
        '<path d="M2 8 Q30 2 58 8 T114 8 T170 8 T226 8" fill="none" stroke="#C98F5F" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>' +
      '</svg>' +
      '<div class="sub">' + delMes.length + ' gasto' + (delMes.length === 1 ? '' : 's') +
      ' · histórico ' + fmt$(totalHist) + '</div>';
  if(totalMes){
    html +=
      '<div class="stacked" role="img" aria-label="Personal ' + Math.round(pctCat('personal')) + '%, Negocio ' + Math.round(pctCat('negocio')) + '%">' +
        ['personal','negocio'].filter(c => porCat[c] > 0).map(c =>
          '<i style="width:' + pctCat(c).toFixed(1) + '%; background:var(--c-' + c + ')"></i>').join('') +
      '</div>' +
      '<div class="leyenda">' +
        ['personal','negocio'].map(c =>
          '<span><i style="background:var(--c-' + c + ')"></i>' + CAT_TXT[c] + ' <b>' + fmt$(porCat[c]) + '</b></span>').join('') +
      '</div>';
  }
  html += '</section>';

  // STATS
  html += '<div class="stat-grid">' +
    '<div class="stat-card stat-card--pearl">' +
      '<div class="lbl">Últimos 30 días</div>' +
      '<div class="val money">' + fmt$(total30) + '</div>' +
      '<div class="sub">' + ult30.length + ' gasto' + (ult30.length === 1 ? '' : 's') + '</div>' +
    '</div>' +
    '<div class="stat-card stat-card--copper">' +
      '<div class="lbl">Comprometido</div>' +
      '<div class="val money">' + fmt$(comprometido) + '</div>' +
      '<div class="sub">cuotas + fijos que vienen</div>' +
    '</div></div>';

  // POR MÉTODO (mes actual)
  const metodos = ['efectivo','transferencia','debito','credito'].filter(m => porMetodo[m]);
  if(metodos.length){
    const max = Math.max(...metodos.map(m => porMetodo[m]), 1);
    html += '<section class="card"><h3>Este mes por método</h3><div class="bars bars--metodo">' +
      metodos.map(m =>
        '<div class="bar-row"><span class="quien">' + METODO_TXT[m] + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="--w:' + (porMetodo[m] / max * 100).toFixed(1) + '%"></div></div>' +
        '<span class="cuanto money">' + fmt$(porMetodo[m]) + '</span></div>').join('') +
      '</div></section>';
  }

  // POR TARJETA (mes actual)
  const tarjetas = Object.keys(porTarjeta);
  if(tarjetas.length){
    html += '<section class="card"><h3>Este mes por tarjeta</h3>' +
      tarjetas.sort((a, b) => porTarjeta[b] - porTarjeta[a]).map(t =>
        '<div class="tj-row"><span>' + esc(t) + '</span><b class="money">' + fmt$(porTarjeta[t]) + '</b></div>').join('') +
      '</section>';
  }

  // GASTO POR MES
  html += '<section class="card"><h3>Gasto por mes</h3>' + chartMeses(filas, '#E8E2D5') + '</section>';

  // COMPROMISOS QUE VIENEN
  html += '<div class="seccion"><h2>Compromisos que vienen</h2></div>';
  if(meses.length){
    html += meses.map(mes => {
      const t = mes.items.reduce((s, i) => s + i.v, 0);
      let nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long'});
      nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      if(mes.y !== new Date().getFullYear()) nombre += ' ' + mes.y;
      return '<div class="mes-card">' +
        '<div class="mes-head"><span class="mes-nombre">' + esc(nombre) + '</span><span class="mes-total money">' + fmt$(t) + '</span></div>' +
        mes.items.map(i =>
          '<div class="mes-item"><span class="dos-lineas">' +
            '<span class="mes-t">' + (i.rec ? '🔁 ' : '') + esc(i.t) + '</span>' +
            '<span class="mes-sub">' + esc(i.sub) + '</span></span>' +
          (i.cuota ? '<span class="cuota-n">' + i.cuota + '</span>' : '') +
          '<b class="money">' + fmt$(i.v) + '</b></div>').join('') +
        '</div>';
    }).join('');
    html += '<p class="pie">Suma cuotas de crédito + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra.</p>';
  } else {
    html += '<div class="vacio"><b>Nada proyectado</b>Sin cuotas pendientes ni gastos recurrentes.</div>';
  }

  $('res-contenido').innerHTML = html;
}
