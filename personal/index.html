<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gastos José · Apex Sync</title>
<meta name="theme-color" content="#0c100d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos José">
<style>
  :root{
    --bg:#0c100d; --panel:#151c17; --panel2:#1b241d; --line:#232e26; --line2:#33413a;
    --txt:#f2f5f3; --dim:#8b9c90; --faint:#5d6f63;
    --accent:#2fbf71; --accent2:#249a59; --accent-soft:rgba(47,191,113,.14);
    --ok:#2ecc71; --warn:#f0a92e; --error:#ff5c5c;
    --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px}
  body{min-height:100dvh;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 84px)}
  .money{font-family:var(--font-num); font-variant-numeric:tabular-nums; letter-spacing:-0.02em}
  /* Desktop/tablet: la app no se estira de borde a borde */
  header, main{width:100%; max-width:560px; margin-left:auto; margin-right:auto}
  main[hidden]{display:none}

  header{display:flex; align-items:center; gap:10px; padding:14px 2px 6px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.5px;color:#fff;flex:none}
  header h1{flex:1;min-width:0;font-size:15px;font-weight:600;margin:0;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1 b{color:var(--txt);font-weight:700}
  .periodo{flex:none;font-size:12px;font-weight:700;color:var(--dim);
    background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px}

  /* ---- form ---- */
  .monto-wrap{padding:14px 0 4px;text-align:center}
  .monto-box{display:flex;align-items:baseline;justify-content:center;gap:6px}
  .monto-box .signo{font-size:30px;color:var(--faint);font-weight:600}
  #monto{font-size:clamp(52px,16vw,72px);font-weight:800;background:none;border:none;color:var(--txt);
    width:100%;max-width:280px;text-align:center;outline:none;padding:0;caret-color:var(--accent);
    font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
  #monto::placeholder{color:#39443c}

  .field{width:100%;min-height:56px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;
    color:var(--txt);font-size:16px;padding:13px 14px;outline:none;color-scheme:dark}
  .field:focus{border-color:var(--accent)}
  .field::placeholder{color:var(--dim)}

  .grupo{margin:14px 0 0}
  .grupo label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--dim);margin:0 0 8px 2px;text-transform:uppercase}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1 1 auto;min-width:80px;min-height:56px;display:inline-flex;align-items:center;justify-content:center;
    padding:10px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:15px;font-weight:700;text-align:center;cursor:pointer;
    transition:background .12s,border-color .12s,transform .12s}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#04170c}
  .chips--compact .chip{min-width:52px;flex:1 1 0}
  .chip--toggle{width:100%}
  .chip--toggle.on{background:var(--warn);border-color:var(--warn);color:#1a1305}

  #guardar{margin-top:20px;width:100%;min-height:64px;padding:17px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04170c;
    font-size:17px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:transform .08s,opacity .2s}
  #guardar:active{transform:scale(.985)}
  #guardar:disabled{opacity:.6}
  #guardar.ok{background:var(--ok)}

  footer{padding-top:18px;text-align:center;font-size:12.5px;color:var(--faint)}
  .pendientes{display:none;margin:12px auto 0;align-items:center;justify-content:center;gap:6px;
    min-height:44px;padding:8px 16px;border-radius:999px;width:fit-content;max-width:100%;
    background:rgba(240,169,46,.12);border:1.5px solid var(--warn);
    color:var(--warn);font-size:13px;font-weight:700;cursor:pointer}
  .pendientes.show{display:flex}
  #exportar{margin-top:8px;font-size:12px;color:var(--faint);text-decoration:underline;background:none;border:none;cursor:pointer;min-height:40px}

  /* ---- gate de clave ---- */
  .gate{margin:32px auto 24px;text-align:center;max-width:320px}
  .gate p{color:var(--dim);font-size:13px;margin:0 0 12px}
  .gate .field{text-align:center}
  .gate .btn-clave{margin-top:12px;width:100%;min-height:56px;padding:12px 26px;border:none;border-radius:12px;
    background:var(--accent);color:#04170c;font-size:15px;font-weight:800;cursor:pointer}
  .cambiar-clave{background:none;border:none;color:var(--faint);font-size:12px;
    text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0;min-height:44px}
  .cambiar-clave[hidden]{display:none}

  /* ---- secciones / cards ---- */
  .seccion{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 8px}
  .seccion h2{margin:0;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
  .seccion .accion{background:none;border:none;padding:0;cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .card > h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
  .vacio{text-align:center;padding:32px 16px;color:var(--faint);font-size:13px}
  .vacio b{display:block;color:var(--dim);font-size:16px;margin-bottom:4px}

  /* ---- hero resumen ---- */
  .hero{text-align:center;padding:20px 0 8px}
  .hero .etiqueta{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
  .hero .total{font-size:clamp(38px,11vw,52px);font-weight:800;letter-spacing:-0.03em;margin:4px 0 6px;line-height:1}
  .hero .sub{font-size:13px;color:var(--faint);font-weight:600}
  .bars{display:flex;flex-direction:column;gap:12px}
  .bar-row{display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:12px;font-size:13px;font-weight:700}
  .bar-row .lbl{color:var(--dim)}
  .bar-track{height:18px;background:var(--panel2);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;width:var(--w,0%);border-radius:999px;background:var(--accent);min-width:4px}
  .bar-row .cuanto{color:var(--txt);white-space:nowrap}
  .tj-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;
    border-top:1px solid var(--line);font-size:13.5px;color:var(--dim);font-weight:600}
  .tj-row:first-of-type{border-top:none;padding-top:2px}
  .tj-row b{color:var(--txt);font-weight:700;white-space:nowrap}

  /* ---- lista de últimas compras ---- */
  .gasto{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;
    padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:8px 0}
  .gasto .desc{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gasto .meta{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:2px 8px;
    border-radius:999px;background:var(--panel2);color:var(--dim);white-space:nowrap}
  .badge--credito{background:rgba(240,169,46,.14);color:var(--warn)}
  .badge--recurrente{background:var(--accent-soft);color:var(--accent)}
  .gasto .importe{text-align:right}
  .gasto .importe .m{font-size:16px;font-weight:800;white-space:nowrap}
  .gasto .importe .f{font-size:12px;color:var(--faint);margin-top:2px}

  /* ---- mes-cards (próximos) ---- */
  .mes-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
  .mes-head{display:flex;justify-content:space-between;align-items:baseline}
  .mes-nombre{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
  .mes-total{font-size:22px;font-weight:800}
  .mes-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 0;border-top:1px solid var(--line);margin-top:7px;font-size:13px;color:var(--dim)}
  .mes-item:first-of-type{margin-top:8px}
  .mes-item .dos-lineas{flex:1;min-width:0}
  .mes-t{display:block;color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mes-sub{display:block;margin-top:1px;font-size:11px;font-weight:600;color:var(--faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cuota-n{font-size:11px;font-weight:800;color:var(--warn);background:rgba(240,169,46,.12);
    padding:1px 7px;border-radius:999px;flex:none}
  .mes-item b{color:var(--txt);font-weight:700;white-space:nowrap}
  .prox-nota{font-size:12px;color:var(--faint);text-align:center;margin:10px 0}

  /* ---- tabbar ---- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    background:rgba(21,28,23,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--faint);font-family:inherit}
  .tab .ico{font-size:22px;line-height:1}
  .tab.act{color:var(--accent)}
  .tab.act::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px}

  /* ---- toast ---- */
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);
    transform:translateX(-50%) translateY(16px);max-width:calc(100vw - 32px);z-index:60;
    background:var(--panel2);border:1.5px solid var(--line2);color:var(--txt);
    padding:13px 18px;border-radius:14px;font-size:13px;font-weight:700;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast--ok{border-color:var(--ok);color:var(--ok)}
  .toast--error{border-color:var(--error);color:var(--error)}
  .toast--warn{border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>
<header>
  <div class="logo">AS</div>
  <h1><b>Mis gastos</b> · Apex Sync</h1>
  <span class="periodo" id="periodo"></span>
</header>

<!-- ============ CARGAR ============ -->
<main id="vista-cargar">
  <div class="monto-wrap">
    <div class="monto-box">
      <span class="signo">$</span>
      <input id="monto" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Monto">
    </div>
  </div>

  <div class="grupo">
    <input id="descripcion" class="field" type="text" autocomplete="off" placeholder="¿En qué? (ej: nafta, super, gym)">
  </div>

  <div class="grupo">
    <label>Fecha</label>
    <div class="chips" id="chips-fecha">
      <button class="chip on" data-v="hoy">Hoy</button>
      <button class="chip" data-v="ayer">Ayer</button>
      <button class="chip" data-v="otra">Otra</button>
    </div>
    <input id="fecha" class="field" type="date" style="margin-top:10px" hidden>
  </div>

  <div class="grupo">
    <label>Método</label>
    <div class="chips" id="chips-metodo">
      <button class="chip on" data-v="efectivo">Efectivo</button>
      <button class="chip" data-v="transferencia">Transf.</button>
      <button class="chip" data-v="debito">Débito</button>
      <button class="chip" data-v="credito">Crédito</button>
    </div>
  </div>

  <div class="grupo" id="grupo-tarjeta" hidden>
    <label>Tarjeta</label>
    <div class="chips" id="chips-tarjeta">
      <button class="chip on" data-v="Visa Francés BBVA">V. Francés BBVA</button>
      <button class="chip" data-v="Visa BBVA">V. BBVA</button>
      <button class="chip" data-v="Nación">Nación</button>
      <button class="chip" data-v="__otra">Otra</button>
    </div>
    <input id="tarjeta-otra" class="field" type="text" placeholder="¿Qué tarjeta?" style="margin-top:10px" hidden>
  </div>

  <div class="grupo" id="grupo-cuotas" hidden>
    <label>Cuotas</label>
    <div class="chips chips--compact" id="chips-cuotas">
      <button class="chip on" data-v="1">1</button>
      <button class="chip" data-v="3">3</button>
      <button class="chip" data-v="6">6</button>
      <button class="chip" data-v="12">12</button>
    </div>
  </div>

  <div class="grupo">
    <button id="recurrente" class="chip chip--toggle">🔁 Se repite todos los meses</button>
  </div>

  <button id="guardar">Guardar gasto</button>

  <div style="text-align:center"><button class="pendientes" id="pendientes"></button></div>

  <footer>
    Se guarda al instante · Jarvis lo lee y actualiza tus finanzas
    <br><button id="exportar">Exportar respaldo</button>
  </footer>
</main>

<!-- ============ GATE DE CLAVE (compartido) ============ -->
<main id="vista-gate" hidden>
  <div class="gate">
    <p>Tu clave para ver tus números:</p>
    <input id="clave-input" class="field" type="text" autocomplete="off" placeholder="clave">
    <button id="clave-ok" class="btn-clave">Entrar</button>
  </div>
</main>

<!-- ============ RESUMEN ============ -->
<main id="vista-resumen" hidden>
  <div class="seccion"><h2>Resumen</h2><button class="accion" id="refrescar-resumen">↻ Actualizar</button></div>
  <div id="resumen-contenido"></div>
  <button class="cambiar-clave" id="cambiar-clave-r" hidden>cambiar clave</button>
</main>

<!-- ============ PRÓXIMOS ============ -->
<main id="vista-proximos" hidden>
  <div class="seccion"><h2>Compromisos que vienen</h2><button class="accion" id="refrescar-prox">↻ Actualizar</button></div>
  <div id="meses"></div>
  <p class="prox-nota" id="prox-nota" hidden>Suma cuotas de crédito + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra.</p>
  <button class="cambiar-clave" id="cambiar-clave-p" hidden>cambiar clave</button>
</main>

<!-- ============ TABBAR ============ -->
<nav class="tabbar">
  <button class="tab act" id="tab-cargar"><span class="ico">＋</span>Cargar</button>
  <button class="tab" id="tab-resumen"><span class="ico">▤</span>Resumen</button>
  <button class="tab" id="tab-proximos"><span class="ico">▦</span>Próximos</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script>
const SUPABASE_URL = 'https://kfiywiqivibktzakclyv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaXl3aXFpdmlia3R6YWtjbHl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTA1MTgsImV4cCI6MjA5ODc4NjUxOH0.Z1DQW5ySGolzrjsqeesg824cpctqa04BOS2RSH4NTNo';
const TABLA = 'gastos_jose';
const RPC_LISTA = 'gastos_jose_lista';
const LS_KEY = 'gastos_jose_v1';
const CLAVE_KEY = 'gastos_jose_clave';
const H = {'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY};

const METODO_TXT = {efectivo:'Efectivo', transferencia:'Transferencia', debito:'Débito', credito:'Crédito'};
const sel = { fecha:'hoy', metodo:'efectivo', tarjeta:'Visa Francés BBVA', cuotas:1, recurrente:false };

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$ = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));

let toastTimer = null;
function toast(msg, tipo){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (tipo ? ' toast--' + tipo : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const hoyLocal = () => isoLocal(new Date());
function fechaElegida(){
  if(sel.fecha === 'otra') return $('fecha').value || hoyLocal();
  if(sel.fecha === 'ayer'){ const d = new Date(); d.setDate(d.getDate()-1); return isoLocal(d); }
  return hoyLocal();
}

const mesNombre = new Date().toLocaleDateString('es-AR', {month:'long'});
$('periodo').textContent = mesNombre.charAt(0).toUpperCase() + mesNombre.slice(1);

// ---------- chips ----------
function initChips(id, campo, cb){
  const box = $(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    box.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}

initChips('chips-fecha','fecha', v => {
  const f = $('fecha');
  f.hidden = v !== 'otra';
  if(v === 'otra' && !f.value) f.value = hoyLocal();
});
initChips('chips-metodo','metodo', aplicarGruposTarjeta);
initChips('chips-tarjeta','tarjeta', v => { $('tarjeta-otra').hidden = v !== '__otra'; });
initChips('chips-cuotas','cuotas');

// Débito y crédito llevan TARJETA; CUOTAS solo con crédito.
function aplicarGruposTarjeta(){
  const conTarjeta = sel.metodo === 'debito' || sel.metodo === 'credito';
  $('grupo-tarjeta').hidden = !conTarjeta;
  $('grupo-cuotas').hidden = sel.metodo !== 'credito';
  if(!conTarjeta) $('tarjeta-otra').hidden = true;
  else $('tarjeta-otra').hidden = sel.tarjeta !== '__otra';
}
aplicarGruposTarjeta();

const recEl = $('recurrente');
recEl.addEventListener('click', () => {
  sel.recurrente = !sel.recurrente;
  recEl.classList.toggle('on', sel.recurrente);
});

// ---------- monto ----------
const montoEl = $('monto');
montoEl.addEventListener('input', () => {
  const n = montoEl.value.replace(/\D/g,'');
  montoEl.value = n ? Number(n).toLocaleString('es-AR') : '';
});

// ---------- persistencia local + POST con anti-duplicados ----------
function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function escribirLS(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }

// Si la columna local_id todavía no existe en la DB (falta correr
// SETUP-GASTOS-SUPABASE-v5.sql), se reintenta sin dedup para no romper la carga.
let localIdSoportado = true;

async function postSupabase(gasto){
  const intento = conLocalId => {
    const body = {...gasto};
    if(!conLocalId) delete body.local_id;
    return fetch(SUPABASE_URL + '/rest/v1/' + TABLA + (conLocalId ? '?on_conflict=local_id' : ''), {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json',
        'Prefer': conLocalId ? 'return=minimal,resolution=ignore-duplicates' : 'return=minimal'},
      body: JSON.stringify(body),
    });
  };
  const usarLocalId = localIdSoportado && !!gasto.local_id;
  let r = await intento(usarLocalId);
  if(!r.ok && usarLocalId){
    localIdSoportado = false;      // columna ausente → modo compatibilidad
    r = await intento(false);
  }
  return r.ok;
}

function refrescarPendientes(){
  const n = leerLS().filter(x => x.estado === 'pendiente').length;
  const el = $('pendientes');
  el.textContent = n ? ('⚠ ' + n + ' en cola sin sincronizar — tocá para reintentar') : '';
  el.classList.toggle('show', n > 0);
}

let reintentando = false;
async function reintentarPendientes(avisar){
  if(reintentando || !navigator.onLine) { refrescarPendientes(); return; }
  reintentando = true;
  const hist = leerLS();
  let enviados = 0;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    const {estado, ...gasto} = item;   // el local_id VIAJA con el gasto (dedup)
    if(gasto.local_id != null) gasto.local_id = String(gasto.local_id); // ítems viejos: era número
    try{ if(await postSupabase(gasto)){ item.estado = 'ok'; enviados++; } }catch(e){}
  }
  if(enviados) escribirLS(hist);
  reintentando = false;
  refrescarPendientes();
  if(avisar && enviados) toast('✓ ' + enviados + ' gasto(s) sincronizado(s)', 'ok');
}

$('pendientes').addEventListener('click', () => reintentarPendientes(true));
window.addEventListener('online', () => reintentarPendientes(true));
setInterval(() => { if(leerLS().some(x => x.estado === 'pendiente')) reintentarPendientes(false); }, 60000);

// ---------- guardar ----------
const btn = $('guardar');
btn.addEventListener('click', async () => {
  const monto = Number(montoEl.value.replace(/\D/g,''));
  if(!monto){ montoEl.focus(); return; }
  const esCredito = sel.metodo === 'credito';
  const conTarjeta = esCredito || sel.metodo === 'debito';
  let tarjeta = null;
  if(conTarjeta){
    tarjeta = sel.tarjeta === '__otra'
      ? ($('tarjeta-otra').value.trim() || 'Otra')
      : sel.tarjeta;
  }
  btn.disabled = true; btn.textContent = 'Guardando…';

  const gasto = {
    fecha: fechaElegida(),
    monto: monto,
    descripcion: $('descripcion').value.trim(),
    metodo: sel.metodo,
    tarjeta: tarjeta,
    cuotas: esCredito ? sel.cuotas : 1,
    es_recurrente: sel.recurrente,
    local_id: uuid(),
  };

  const hist = leerLS();
  const item = {...gasto, estado:'pendiente'};
  hist.push(item); escribirLS(hist);

  let ok = false;
  try{ ok = await postSupabase(gasto); }catch(e){}
  if(ok){ item.estado = 'ok'; escribirLS(hist); }

  if(navigator.vibrate) navigator.vibrate(ok ? 30 : [60,60,60]);
  btn.classList.add('ok');
  btn.textContent = ok ? '✓ Guardado' : '✓ Guardado acá';
  if(!ok){
    toast(navigator.onLine
      ? 'No se pudo guardar en el servidor — quedó en cola y se reintenta solo'
      : 'Sin conexión — quedó en cola, se envía al volver la señal', 'error');
  }
  setTimeout(() => {
    btn.classList.remove('ok'); btn.disabled = false; btn.textContent = 'Guardar gasto';
    montoEl.value = ''; $('descripcion').value = '';
    sel.fecha = 'hoy'; $('fecha').hidden = true; $('fecha').value = '';
    document.querySelectorAll('#chips-fecha .chip').forEach(c => c.classList.toggle('on', c.dataset.v === 'hoy'));
    sel.recurrente = false; recEl.classList.remove('on');
  }, 1500);
  refrescarPendientes();
});

$('exportar').addEventListener('click', () => {
  const data = JSON.stringify(leerLS(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gastos-jose-respaldo.json';
  a.click();
});

// ---------- vistas ----------
let destinoConClave = 'resumen';   // a dónde volver después del gate
function setVista(v){
  ['cargar','gate','resumen','proximos'].forEach(x => { $('vista-' + x).hidden = x !== v; });
  $('tab-cargar').classList.toggle('act', v === 'cargar');
  $('tab-resumen').classList.toggle('act', v === 'resumen' || (v === 'gate' && destinoConClave === 'resumen'));
  $('tab-proximos').classList.toggle('act', v === 'proximos' || (v === 'gate' && destinoConClave === 'proximos'));
  if(v === 'resumen') abrirResumen();
  if(v === 'proximos') abrirProximos();
}
function pedirVista(v){
  if((v === 'resumen' || v === 'proximos') && !localStorage.getItem(CLAVE_KEY)){
    destinoConClave = v; setVista('gate'); return;
  }
  setVista(v);
}
$('tab-cargar').addEventListener('click', () => setVista('cargar'));
$('tab-resumen').addEventListener('click', () => pedirVista('resumen'));
$('tab-proximos').addEventListener('click', () => pedirVista('proximos'));
$('refrescar-resumen').addEventListener('click', () => abrirResumen());
$('refrescar-prox').addEventListener('click', () => abrirProximos());

$('clave-ok').addEventListener('click', () => {
  const v = $('clave-input').value.trim();
  if(!v) return;
  localStorage.setItem(CLAVE_KEY, v);
  setVista(destinoConClave);
});
$('cambiar-clave-r').addEventListener('click', () => { localStorage.removeItem(CLAVE_KEY); pedirVista('resumen'); });
$('cambiar-clave-p').addEventListener('click', () => { localStorage.removeItem(CLAVE_KEY); pedirVista('proximos'); });

async function traerFilas(){
  const clave = localStorage.getItem(CLAVE_KEY);
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + RPC_LISTA, {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({clave}),
  });
  if(!r.ok) throw new Error('server');
  const filas = await r.json();
  return Array.isArray(filas) ? filas : [];
}

// ---------- RESUMEN ----------
async function abrirResumen(){
  const cont = $('resumen-contenido');
  $('cambiar-clave-r').hidden = true;
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  let filas;
  try{ filas = await traerFilas(); }
  catch(e){
    cont.innerHTML = '<div class="vacio"><b>' + (navigator.onLine ? 'Error del servidor' : 'Sin conexión') + '</b>Tocá ↻ Actualizar para probar de nuevo.</div>';
    return;
  }
  if(!filas.length){
    cont.innerHTML = '<div class="vacio"><b>Sin datos</b>¿La clave está bien?</div>';
    $('cambiar-clave-r').hidden = false;
    return;
  }
  renderResumen(filas);
  $('cambiar-clave-r').hidden = false;
}

function renderResumen(filas){
  const hoy = new Date();
  const ym = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0');
  const delMes = filas.filter(f => f.fecha.startsWith(ym));
  const totalMes = delMes.reduce((s, f) => s + Number(f.monto), 0);
  const totalHist = filas.reduce((s, f) => s + Number(f.monto), 0);

  const porMetodo = {};
  const porTarjeta = {};
  for(const f of delMes){
    porMetodo[f.metodo] = (porMetodo[f.metodo] || 0) + Number(f.monto);
    if(f.tarjeta) porTarjeta[f.tarjeta] = (porTarjeta[f.tarjeta] || 0) + Number(f.monto);
  }

  let html =
    '<section class="hero">' +
      '<div class="etiqueta">Gastado este mes</div>' +
      '<div class="total money">' + fmt$(totalMes) + '</div>' +
      '<div class="sub">' + delMes.length + ' gasto' + (delMes.length === 1 ? '' : 's') +
      ' · histórico ' + fmt$(totalHist) + '</div>' +
    '</section>';

  // Por método (mes actual)
  const metodos = ['efectivo','transferencia','debito','credito'].filter(m => porMetodo[m]);
  if(metodos.length){
    const max = Math.max(...metodos.map(m => porMetodo[m]), 1);
    html += '<section class="card"><h3>Este mes por método</h3><div class="bars">' +
      metodos.map(m =>
        '<div class="bar-row"><span class="lbl">' + METODO_TXT[m] + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="--w:' + (porMetodo[m] / max * 100).toFixed(1) + '%"></div></div>' +
        '<span class="cuanto money">' + fmt$(porMetodo[m]) + '</span></div>').join('') +
      '</div></section>';
  }

  // Por tarjeta (mes actual, débito + crédito)
  const tarjetas = Object.keys(porTarjeta);
  if(tarjetas.length){
    html += '<section class="card"><h3>Este mes por tarjeta</h3>' +
      tarjetas.sort((a, b) => porTarjeta[b] - porTarjeta[a]).map(t =>
        '<div class="tj-row"><span>' + esc(t) + '</span><b class="money">' + fmt$(porTarjeta[t]) + '</b></div>').join('') +
      '</section>';
  }

  // Últimas compras
  html += '<div class="seccion"><h2>Últimas compras</h2></div>';
  const orden = [...filas].sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id).slice(0, 30);
  html += orden.map(f => {
    const [y, m, d] = f.fecha.split('-').map(Number);
    const fbon = d + ' ' + new Date(y, m - 1, d).toLocaleDateString('es-AR', {month:'short'}).replace('.','');
    const badge = f.metodo === 'credito'
      ? '<span class="badge badge--credito">Crédito ' + (Number(f.cuotas) || 1) + '×</span>'
      : '<span class="badge">' + (METODO_TXT[f.metodo] || esc(f.metodo)) + '</span>';
    const extra = f.tarjeta ? '<span class="badge">' + esc(f.tarjeta) + '</span>' : '';
    const rec = f.es_recurrente ? '<span class="badge badge--recurrente">🔁 fijo</span>' : '';
    return '<div class="gasto">' +
      '<div class="info" style="min-width:0"><div class="desc">' + esc(f.descripcion || '(sin detalle)') + '</div>' +
      '<div class="meta">' + badge + extra + rec + '</div></div>' +
      '<div class="importe"><div class="m money">' + fmt$(Number(f.monto)) + '</div><div class="f">' + fbon + '</div></div>' +
    '</div>';
  }).join('');

  $('resumen-contenido').innerHTML = html;
}

// ---------- PRÓXIMOS ----------
async function abrirProximos(){
  const cont = $('meses');
  $('prox-nota').hidden = true;
  $('cambiar-clave-p').hidden = true;
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  let filas;
  try{ filas = await traerFilas(); }
  catch(e){
    cont.innerHTML = '<div class="vacio"><b>' + (navigator.onLine ? 'Error del servidor' : 'Sin conexión') + '</b>Probá de nuevo en un rato.</div>';
    return;
  }
  if(!filas.length){
    cont.innerHTML = '<div class="vacio"><b>Sin datos</b>¿La clave está bien?</div>';
    $('cambiar-clave-p').hidden = false;
    return;
  }
  renderMeses(proyectar(filas));
  $('prox-nota').hidden = false;
  $('cambiar-clave-p').hidden = false;
}

// Regla: TODA compra a crédito impacta los meses siguientes (aun en 1 cuota).
// Recurrentes se repiten cada mes; si algo es crédito Y recurrente, manda el crédito (sin doble conteo).
function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const esCredito = f.metodo === 'credito';
    if(f.es_recurrente && !esCredito){
      for(let k = Math.max(0, base + 1); k < meses.length; k++)
        meses[k].items.push({t: etiqueta, sub: METODO_TXT[f.metodo] || f.metodo, rec:true, v: Number(f.monto)});
    }
    if(esCredito){
      const n = Math.max(1, Number(f.cuotas) || 1);
      const cuota = Number(f.monto) / n;
      for(let i = 1; i <= n; i++){
        const k = base + i;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta, sub: f.tarjeta || 'Crédito', cuota: i + '/' + n, v: cuota});
      }
    }
  }
  return meses;
}

function renderMeses(meses){
  const cont = $('meses');
  cont.innerHTML = '';
  let algo = false;
  for(const mes of meses){
    if(!mes.items.length) continue;
    algo = true;
    const total = mes.items.reduce((s, i) => s + i.v, 0);
    const nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long', year:'numeric'});
    const card = document.createElement('div');
    card.className = 'mes-card';
    card.innerHTML =
      '<div class="mes-head"><span class="mes-nombre">' + esc(nombre) + '</span><span class="mes-total money">' + fmt$(total) + '</span></div>' +
      mes.items.map(i =>
        '<div class="mes-item"><span class="dos-lineas">' +
          '<span class="mes-t">' + (i.rec ? '🔁 ' : '') + esc(i.t) + '</span>' +
          '<span class="mes-sub">' + esc(i.sub) + '</span></span>' +
        (i.cuota ? '<span class="cuota-n">' + i.cuota + '</span>' : '') +
        '<b class="money">' + fmt$(i.v) + '</b></div>').join('');
    cont.appendChild(card);
  }
  if(!algo) cont.innerHTML = '<div class="vacio"><b>Nada proyectado</b>Sin cuotas pendientes ni gastos recurrentes.</div>';
}
