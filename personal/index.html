// EL redondeo: cada gasto se redondea UNA sola vez, acá, al peso que se ve
// en su fila. De ahí para arriba solo se suman enteros, así cualquier total
// es exactamente la suma de lo que se muestra (igual que en las otras apps).
const montoEnt = f => Math.round(Number(f.monto) || 0);

// Para lo único que sigue dando decimales: las cuotas (un gasto dividido en
// N). Devuelve las partes en pesos enteros ajustadas para que sumen EXACTO
// el total redondeado. Método del resto mayor: el peso que sobra o falta va
// a la parte con la fracción más grande.
function partesRedondeadas(total, partes){
  const objetivo = Math.round(Number(total) || 0);
  const base = partes.map(v => Math.floor(Number(v) || 0));
  const orden = partes
    .map((v, i) => ({i, frac: (Number(v) || 0) - Math.floor(Number(v) || 0)}))
    .sort((a, b) => b.frac - a.frac);
  let resto = objetivo - base.reduce((s, v) => s + v, 0);
  if(!orden.length) return base;
  for(let k = 0; resto > 0; k++, resto--) base[orden[k % orden.length].i]++;
  for(let k = 0; resto < 0; k++, resto++) base[orden[orden.length - 1 - (k % orden.length)].i]--;
  return base;
}

  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

}
function etiquetaDia(fechaISO){
  const d = new Date(); d.setDate(d.getDate()-1);
  const ayer = isoLocal(d);
  const [y, m, dd] = fechaISO.split('-').map(Number);
  const txt = new Date(y, m-1, dd).toLocaleDateString('es-AR', {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
  if(fechaISO === hoyLocal()) return 'Hoy · ' + txt;
  if(fechaISO === ayer) return 'Ayer · ' + txt;
  return txt;
}

async function comprimirFoto(file){
  const img = await createImageBitmap(file);
  const max = 1600;
  const escala = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * escala);
  c.height = Math.round(img.height * escala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

async function subirFoto(file, fecha){
  const blob = await comprimirFoto(file);
  const path = 'jose/' + fecha + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/facturas/' + path, {
    method:'POST', headers:{...H, 'Content-Type':'image/jpeg'}, body: blob,
  });
  return r.ok ? path : null;
}

function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }

// v9: escribir NUNCA puede tirar. Si el teléfono se queda sin espacio
// (QuotaExceededError, iOS con poco disco) el botón "Guardar" se colgaba en
// "Guardando…" para siempre y José no podía cargar nada. Ahora, si no entra,
// se tiran los gastos VIEJOS YA SINCRONIZADOS (los que están en el servidor,
// no se pierde nada) y se reintenta. Los pendientes no se tocan jamás.
function escribirLS(a){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(a)); return true; }
  catch(e){
    try{
      const pendientes = a.filter(x => x.estado === 'pendiente');
      const sincronizados = a.filter(x => x.estado !== 'pendiente');
      // se conservan los 30 sincronizados más nuevos, el resto ya vive en la DB
      const podado = sincronizados.slice(-30).concat(pendientes);
      localStorage.setItem(LS_KEY, JSON.stringify(podado));
      toast('Se liberó espacio en el teléfono — tus gastos están a salvo', 'warn');
      return true;
    }catch(e2){
      toast('El teléfono no tiene espacio para guardar acá — revisá que el gasto haya subido', 'error');
      return false;
    }
  }
}

// Resiliencia de esquema: si a la DB le falta alguna columna nueva
// (p.ej. `recurrente_meses` o `relevar` antes de correr SETUP-GASTOS-V6.sql),
// se reintenta sin esa columna y la app sigue andando igual.
// Anti-duplicados: el local_id es UNIQUE en la DB; un reintento de un gasto
// que ya llegó contesta 409 (duplicado) y se toma como "ya guardado".
// No se usa on_conflict/ignore-duplicates: el RLS insert-only no lo permite.
const OPCIONALES = {local_id:true, categoria:true, recurrente_meses:true, relevar:true};

async function postSupabase(gasto){
  for(let i = 0; i <= Object.keys(OPCIONALES).length; i++){
    const body = {...gasto};
    for(const c in OPCIONALES) if(!OPCIONALES[c]) delete body[c];
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + TABLA, {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify(body),
    });
    if(r.ok) return true;
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(r.status === 409 && /23505|duplicate/i.test(msg)) return true;   // ya estaba
    let cambio = false;
    for(const c in OPCIONALES){
      if(OPCIONALES[c] && (c in body) && msg.includes(c)){ OPCIONALES[c] = false; cambio = true; }
    }
    if(!cambio) return false;   // error real, no de columnas
  }
  return false;
}

function refrescarPendientes(){
  const n = leerLS().filter(x => x.estado === 'pendiente').length;
  const el = $('pendientes');
  el.textContent = n ? ('⚠ ' + n + ' en cola sin sincronizar — tocá para reintentar') : '';
  el.classList.toggle('show', n > 0);
}

let reintentando = false;
async function reintentarPendientes(avisar){
  if(reintentando || !navigator.onLine) { refrescarPendientes(); return; }
  reintentando = true;
  const hist = leerLS();
  let enviados = 0;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    const {estado, ...gasto} = item;   // el local_id VIAJA con el gasto (dedup)
    if(gasto.local_id != null) gasto.local_id = String(gasto.local_id);
    try{ if(await postSupabase(gasto)){ item.estado = 'ok'; enviados++; } }catch(e){}
  }
  if(enviados){ escribirLS(hist); filasCache = null; }
  reintentando = false;
  refrescarPendientes();
  if(avisar && enviados) toast('✓ ' + enviados + ' gasto(s) sincronizado(s)', 'ok');
}

let filasCache = null;
async function traerFilas(force){
  if(filasCache && !force) return filasCache;
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + RPC_LISTA, {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({clave: CLAVE_PERSONAL}),
  });
  if(!r.ok) throw new Error('server');
  const filas = await r.json();
  // `fecha` se usa para ordenar, agrupar y proyectar. Una sola fila con
  // fecha nula tiraba TODO el render (pantalla trabada en "Cargando…").
  filasCache = (Array.isArray(filas) ? filas : [])
    .map(f => (typeof f.fecha === 'string' ? f : {...f, fecha: f.fecha ? String(f.fecha) : ''}));
  return filasCache;
}

function coincide(f, mapa){
  if(filtro.categoria !== 'todos' && categoriaDe(f, mapa) !== filtro.categoria) return false;
  if(filtro.metodo !== 'todos' && f.metodo !== filtro.metodo) return false;
  if(!filtro.q) return true;
  const blob = [f.descripcion, f.tarjeta, METODO_TXT[f.metodo],
                CAT_TXT[categoriaDe(f, mapa)], String(f.monto)].join(' ').toLowerCase();
  return blob.includes(filtro.q);
}

function filaHTML(f, mapa){
  const cat = categoriaDe(f, mapa);
  const badge = f.metodo === 'credito'
    ? '<span class="badge badge--credito">Crédito ' + (Number(f.cuotas) || 1) + '×</span>'
    : '<span class="badge">' + (METODO_TXT[f.metodo] || esc(f.metodo)) + '</span>';
  const extra = f.tarjeta ? '<span class="extra">' + esc(f.tarjeta) + '</span>' : '';
  const rec = f.es_recurrente
    ? '<span class="badge badge--recurrente">🔁 ' + (Number(f.recurrente_meses) ? Number(f.recurrente_meses) + ' meses' : 'fijo') + '</span>' : '';
  const neg = cat === 'negocio' ? '<span class="badge badge--negocio">Negocio</span>' : '';
  const rev = f.relevar ? '<span class="badge badge--relevar">🔎 Jarvis la está leyendo</span>' : '';
  const cola = f._pendiente ? '<span class="badge badge--cola">⏳ en cola</span>' : '';
  const thumb = f.foto_path
    ? '<button class="thumb" data-foto="' + esc(f.foto_path) + '" aria-label="Ver factura"><span>📷</span></button>' : '';
  const importe = (f.relevar && !Number(f.monto)) ? '$ —' : fmt$(montoEnt(f));
  // v9: el lápiz aparece SOLO si el servidor sabe editar (ver mantenimientoDisponible).
  // Y se abre SOLO tocando el lápiz: tocar la fila entera hacía que, al
  // recorrer el historial con el pulgar, saltara la hoja de edición encima
  // de todo y pareciera que la app se trababa.
  const edita = editable(f);
  const k = claveFila(f);
  const lapiz = edita
    ? '<button class="ed-lapiz" data-k="' + esc(k) + '" aria-label="Editar ' + esc(f.descripcion || 'gasto') + '">✏️</button>' : '';
  const cls = 'gasto gasto--sinavatar gasto--' + cat +
              (thumb ? ' gasto--conthumb' : '') + (edita ? ' gasto--editable' : '');
  return '<div class="' + cls + '">' +
    '<div class="info"><div class="desc">' + esc(f.descripcion || '(sin detalle)') + '</div>' +
    '<div class="meta">' + badge + extra + neg + rec + rev + cola + '</div></div>' +
    thumb +
    '<div class="importe"><div class="m money">' + importe + '</div>' +
    '<div class="f">' + CAT_TXT[cat] + '</div></div>' +
    lapiz +
  '</div>';
}

function renderHistorial(){
  const cont = $('hist-lista');
  if(!filasCache) return;
  const mapa = mapaCategoriasLocal();
  const enServer = new Set(filasCache.map(f => f.local_id).filter(Boolean));
  const pendientes = leerLS()
    .filter(x => x.estado === 'pendiente' && !enServer.has(x.local_id))
    .map(x => ({...x, fecha: String(x.fecha || hoyLocal()), _pendiente:true, id: Infinity}));
  const todas = [...pendientes, ...filasCache]
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || (b.id || 0) - (a.id || 0));
  const filtradas = todas.filter(f => coincide(f, mapa));

  // Índice para la hoja de edición: de la fila del HTML al objeto real.
  filasIdx.clear();
  for(const f of filtradas) filasIdx.set(claveFila(f), f);

  const totalF = filtradas.reduce((s, f) => s + montoEnt(f), 0);
  $('hist-stats').textContent = filtradas.length
    ? filtradas.length + ' gasto' + (filtradas.length === 1 ? '' : 's') + ' · ' + fmt$(totalF)
    : '';

  if(!filtradas.length){
    cont.innerHTML = filasCache.length || pendientes.length
      ? '<div class="vacio"><b>Nada con ese filtro</b>Probá con otra búsqueda.</div>'
      : '<div class="vacio"><b>Todavía no cargaste nada</b>Cargá tu primer gasto desde la pestaña Cargar.</div>';
    return;
  }

  let html = '', diaActual = null;
  for(const f of filtradas){
    if(f.fecha !== diaActual){
      diaActual = f.fecha;
      const delDia = filtradas.filter(x => x.fecha === f.fecha);
      const totDia = delDia.reduce((s, x) => s + montoEnt(x), 0);
      html += '<div class="dia-head"><span class="dia">' + esc(etiquetaDia(f.fecha)) + '</span>' +
              '<b class="money">' + fmt$(totDia) + '</b></div>';
    }
    html += filaHTML(f, mapa);
  }
  cont.innerHTML = html;
  cont.querySelectorAll('[data-foto]').forEach(el => {
    cargarThumb(el);
    el.addEventListener('click', e => { e.stopPropagation(); verFoto(el.dataset.foto); });
  });
  cont.querySelectorAll('.ed-lapiz[data-k]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); abrirEditor(el.dataset.k); });
  });
}

// Regla: TODA compra a crédito impacta los meses siguientes (aun en 1 cuota).
// Recurrentes: respetan el horizonte que eligió José — N meses en total
// (el gasto cargado cuenta como pago 1) o sin fin si no puso límite.
// Crédito + recurrente: manda el crédito (sin doble conteo).
function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const esCredito = f.metodo === 'credito';
    // v9 — FIX: un gasto que SE REPITE se proyecta todos los meses, se pague
    // como se pague. Antes la condición era `f.es_recurrente && !esCredito`:
    // si la suscripción estaba en tarjeta (que es lo normal — Claude Pro,
    // publicidad de Marketplace, Netflix), ganaba la rama de crédito, se
    // proyectaba UNA sola cuota y al mes siguiente desaparecía del
    // "Comprometido". Por eso José no veía sus fijos en la proyección.
    if(f.es_recurrente){
      const N = Number(f.recurrente_meses) || 0;   // 0 = sin fin
      for(let k = Math.max(0, base + 1); k < meses.length; k++){
        const nro = k - base + 1;                  // el gasto original fue el pago 1
        if(N && nro > N) break;
        meses[k].items.push({t: etiqueta,
                             sub: esCredito ? (f.tarjeta || 'Crédito') : (METODO_TXT[f.metodo] || f.metodo),
                             rec:true, cuota: N ? nro + '/' + N : null, v: montoEnt(f)});
      }
    } else if(esCredito){
      const n = Math.max(1, Number(f.cuotas) || 1);
      const cuota = montoEnt(f) / n;
      for(let i = 1; i <= n; i++){
        const k = base + i;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta, sub: f.tarjeta || 'Crédito', cuota: i + '/' + n, v: cuota});
      }
    }
  }
  return meses;
}

function barPath(x, y, w, h, r){
  r = Math.min(r, h);
  return 'M' + x + ' ' + (y + h) + ' V' + (y + r) +
         ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
         ' H' + (x + w - r) +
         ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) +
         ' V' + (y + h) + ' Z';
}

function chartMeses(filas, color){
  const hoy = new Date();
  const labs = [], vals = [];
  for(let k = 5; k >= 0; k--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - k, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    labs.push(d.toLocaleDateString('es-AR', {month:'short'}).replace('.',''));
    vals.push(filas.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + montoEnt(f), 0));
  }
  const max = Math.max(...vals, 1);
  const W = 320, base = 124, top = 26, bw = 34;
  const gap = (W - 6 * bw) / 7;
  let s = '<svg class="grafico" viewBox="0 0 320 150" role="img" aria-label="Gasto por mes: ' +
    labs.map((l, i) => l + ' ' + fmt$(vals[i])).join(', ') + '">';
  s += '<line x1="0" y1="' + (base + .5) + '" x2="320" y2="' + (base + .5) + '" stroke="rgba(232,226,213,.18)" stroke-width="1"/>';
  vals.forEach((v, i) => {
    const x = gap + (bw + gap) * i;
    const h = Math.max(v / max * (base - top), 2);
    const y = base - h;
    const cur = i === 5;
    s += '<path d="' + barPath(x, y, bw, h, 4) + '" fill="' + color + '"' + (cur ? '' : ' opacity=".55"') + '/>';
    s += '<text x="' + (x + bw/2) + '" y="' + (y - 6) + '" class="g-val' + (cur ? ' g-val--cur' : '') + '" text-anchor="middle">' + (v ? fmtK(v) : '—') + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="142" class="g-lab" text-anchor="middle">' + esc(labs[i]) + '</text>';
  });
  s += '</svg>';
  return s;
}

function renderResumen(filas){
  const mapa = mapaCategoriasLocal();
  const hoy = new Date();
  const ym = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0');
  const delMes = filas.filter(f => f.fecha.startsWith(ym));
  const totalMes = delMes.reduce((s, f) => s + montoEnt(f), 0);
  const totalHist = filas.reduce((s, f) => s + montoEnt(f), 0);

  const porCat = {personal:0, negocio:0};
  const porMetodo = {};
  const porTarjeta = {};
  for(const f of delMes){
    porCat[categoriaDe(f, mapa)] += montoEnt(f);
    porMetodo[f.metodo] = (porMetodo[f.metodo] || 0) + montoEnt(f);
    if(f.tarjeta) porTarjeta[f.tarjeta] = (porTarjeta[f.tarjeta] || 0) + montoEnt(f);
  }
  const pctCat = c => totalMes ? (porCat[c] / totalMes * 100) : 0;

  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const corte30 = isoLocal(d30);
  const ult30 = filas.filter(f => f.fecha >= corte30);
  const total30 = ult30.reduce((s, f) => s + montoEnt(f), 0);

  // Cada mes se redondea entero y el comprometido suma esos totales,
  // para que el stat card diga exactamente lo que suman las tarjetas.
  const meses = proyectar(filas).filter(m => m.items.length);
  const comprometido = meses.reduce((s, m) => s + Math.round(m.items.reduce((x, i) => x + i.v, 0)), 0);

  // HERO: gastado este mes + onda firma + split Negocio / Personal
  let html =
    '<section class="hero">' +
      '<div class="etiqueta">Gastado este mes</div>' +
      '<div class="total money">' + fmt$(totalMes) + '</div>' +
      '<svg class="onda" viewBox="0 0 220 14" aria-hidden="true">' +
        '<path d="M2 8 Q30 2 58 8 T114 8 T170 8 T226 8" fill="none" stroke="#C98F5F" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>' +
      '</svg>' +
      '<div class="sub">' + delMes.length + ' gasto' + (delMes.length === 1 ? '' : 's') +
      ' · histórico ' + fmt$(totalHist) + '</div>';
  if(totalMes){
    html +=
      '<div class="stacked" role="img" aria-label="Personal ' + Math.round(pctCat('personal')) + '%, Negocio ' + Math.round(pctCat('negocio')) + '%">' +
        ['personal','negocio'].filter(c => porCat[c] > 0).map(c =>
          '<i style="width:' + pctCat(c).toFixed(1) + '%; background:var(--c-' + c + ')"></i>').join('') +
      '</div>' +
      '<div class="leyenda">' +
        ['personal','negocio'].map(c =>
          '<span><i style="background:var(--c-' + c + ')"></i>' + CAT_TXT[c] + ' <b>' + fmt$(porCat[c]) + '</b></span>').join('') +
      '</div>';
  }
  html += '</section>';

  // STATS
  html += '<div class="stat-grid">' +
    '<div class="stat-card stat-card--pearl">' +
      '<div class="lbl">Últimos 30 días</div>' +
      '<div class="val money">' + fmt$(total30) + '</div>' +
      '<div class="sub">' + ult30.length + ' gasto' + (ult30.length === 1 ? '' : 's') + '</div>' +
    '</div>' +
    '<div class="stat-card stat-card--copper">' +
      '<div class="lbl">Comprometido</div>' +
      '<div class="val money">' + fmt$(comprometido) + '</div>' +
      '<div class="sub">cuotas + fijos que vienen</div>' +
    '</div></div>';

  // POR MÉTODO (mes actual)
  const metodos = ['efectivo','transferencia','debito','credito'].filter(m => porMetodo[m]);
  if(metodos.length){
    const max = Math.max(...metodos.map(m => porMetodo[m]), 1);
    html += '<section class="card"><h3>Este mes por método</h3><div class="bars bars--metodo">' +
      metodos.map(m =>
        '<div class="bar-row"><span class="quien">' + METODO_TXT[m] + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="--w:' + (porMetodo[m] / max * 100).toFixed(1) + '%"></div></div>' +
        '<span class="cuanto money">' + fmt$(porMetodo[m]) + '</span></div>').join('') +
      '</div></section>';
  }

  // POR TARJETA (mes actual)
  const tarjetas = Object.keys(porTarjeta);
  if(tarjetas.length){
    html += '<section class="card"><h3>Este mes por tarjeta</h3>' +
      tarjetas.sort((a, b) => porTarjeta[b] - porTarjeta[a]).map(t =>
        '<div class="tj-row"><span>' + esc(t) + '</span><b class="money">' + fmt$(porTarjeta[t]) + '</b></div>').join('') +
      '</section>';
  }

  // GASTO POR MES
  html += '<section class="card"><h3>Gasto por mes</h3>' + chartMeses(filas, '#E8E2D5') + '</section>';

  // COMPROMISOS QUE VIENEN
  html += '<div class="seccion"><h2>Compromisos que vienen</h2></div>';
  if(meses.length){
    // Las cuotas caen en decimales: cada mes reparte su propio redondeo
    // para que las filas den exacto el total del mes.
    html += meses.map(mes => {
      const t = mes.items.reduce((s, i) => s + i.v, 0);
      const itemsR = partesRedondeadas(t, mes.items.map(i => i.v));
      let nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long'});
      nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      if(mes.y !== new Date().getFullYear()) nombre += ' ' + mes.y;
      return '<div class="mes-card">' +
        '<div class="mes-head"><span class="mes-nombre">' + esc(nombre) + '</span><span class="mes-total money">' + fmt$(Math.round(t)) + '</span></div>' +
        mes.items.map((i, ix) =>
          '<div class="mes-item"><span class="dos-lineas">' +
            '<span class="mes-t">' + (i.rec ? '🔁 ' : '') + esc(i.t) + '</span>' +
            '<span class="mes-sub">' + esc(i.sub) + '</span></span>' +
          (i.cuota ? '<span class="cuota-n">' + i.cuota + '</span>' : '') +
          '<b class="money">' + fmt$(itemsR[ix]) + '</b></div>').join('') +
        '</div>';
    }).join('');
    html += '<p class="pie">Suma cuotas de crédito + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra.</p>';
  } else {
    html += '<div class="vacio"><b>Nada proyectado</b>Sin cuotas pendientes ni gastos recurrentes.</div>';
  }

  $('res-contenido').innerHTML = html;
}

// ============================================================
// EDITAR / ELIMINAR (v8) — tocá una fila del Historial y se abre la hoja
// ============================================================
// Servidor: gasto_editar_jose / gasto_borrar_jose. Piden TU clave personal
// (la misma que esta app ya usa para leer) y solo saben escribir en
// gastos_jose: con esta clave es imposible tocar la obra ni lo de tus
// hermanos. La clave MAESTRA no está en este código a propósito.
// Cola local: si el gasto todavía no subió, se corrige/borra en el teléfono.
// Modo compatibilidad: si el SQL v8 todavía no corrió, la RPC no existe
// (404 / PGRST202) → se avisa amablemente y NO se toca nada.
const RPC_ED = 'gasto_editar_jose';
const RPC_BO = 'gasto_borrar_jose';
const TARJETAS_ED = ['Visa Francés BBVA','Visa BBVA','Nación'];

const filasIdx = new Map();
const claveFila = f => f._pendiente ? 'L' + f.local_id : 'S:' + f.id;
const numE = v => Number(v) || 0;
const esRpcQueNoExiste = (status, msg) => status === 404 || /PGRST20[25]|Could not find/i.test(msg || '');

// v9 — DETECCIÓN DE CAPACIDAD.
// El problema real de v8: la app mostraba el lápiz en TODAS las filas y
// prometía "editar / eliminar" aunque el SQL v8 no estuviera corrido en la
// base. Recién después de llenar el formulario y tocar Guardar avisaba que
// no. Ahora se pregunta UNA vez y, si el servidor no sabe editar, la app
// simplemente no ofrece editar: se comporta igual que antes de v8.
//   null = todavía no se preguntó · true = hay RPC · false = no hay
let mantenimientoOK = null;
async function mantenimientoDisponible(){
  if(mantenimientoOK !== null) return mantenimientoOK;
  try{
    // fila_id 0 no existe nunca: si la función está, contesta 0 filas tocadas.
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + RPC_ED, {
      method:'POST', headers:{...H, 'Content-Type':'application/json'},
      body: JSON.stringify({clave: CLAVE_PERSONAL, fila_id: 0}),
    });
    let txt = ''; try{ txt = await r.text(); }catch(e){}
    mantenimientoOK = !esRpcQueNoExiste(r.status, txt);
  }catch(e){
    mantenimientoOK = false;   // sin señal: no prometemos lo que no podemos cumplir
  }
  return mantenimientoOK;
}

function editable(f){
  // En cola = todavía está en el teléfono: se corrige acá, sin servidor.
  if(f._pendiente) return !!f.local_id;
  if(mantenimientoOK === false) return false;   // el server todavía no sabe editar
  return f.id != null && isFinite(numE(f.id));
}

let ed = null;   // {f, orig, sel}

function abrirEditor(k){
  const f = filasIdx.get(k);
  if(!f || !editable(f)) return;
  const orig = {
    monto:       Math.round(numE(f.monto)),
    descripcion: f.descripcion || '',
    fecha:       f.fecha || hoyLocal(),
    metodo:      f.metodo || 'efectivo',
    tarjeta:     f.tarjeta || '',
    cuotas:      Math.max(1, numE(f.cuotas) || 1),
    categoria:   categoriaDe(f, mapaCategoriasLocal()),
  };
  ed = {f, orig, sel: {...orig}};

  $('ed-sub').textContent = (CAT_TXT[orig.categoria] || 'Personal') + ' · ' + etiquetaDia(orig.fecha) +
                            (f._pendiente ? ' · ⏳ todavía en el teléfono' : '');
  $('ed-monto').value = orig.monto ? orig.monto.toLocaleString('es-AR') : '';
  $('ed-desc').value  = orig.descripcion;
  $('ed-fecha').value = orig.fecha;
  $('ed-tarjeta-otra').value = '';
  $('ed-tarjeta-otra').hidden = true;

  pintarChipsEd('ed-chips-categoria', orig.categoria);
  pintarChipsEd('ed-chips-metodo', orig.metodo);
  aplicarMetodoEd();

  $('ed-confirmar').hidden = true;
  $('ed-borrar').hidden = false;
  $('ed-nota').hidden = true;
  $('ed-guardar').disabled = false; $('ed-guardar').textContent = 'Guardar cambios';
  abrirHoja();
}

function abrirHoja(){
  $('ed-fondo').hidden = false; $('ed-hoja').hidden = false;
  requestAnimationFrame(() => {
    $('ed-fondo').classList.add('show');
    $('ed-hoja').classList.add('show');
    $('ed-hoja').scrollTop = 0;
    $('ed-hoja').focus();
  });
  document.body.style.overflow = 'hidden';
}
function cerrarEditor(){
  $('ed-hoja').classList.remove('show');
  $('ed-fondo').classList.remove('show');
  setTimeout(() => { $('ed-hoja').hidden = true; $('ed-fondo').hidden = true; }, 220);
  document.body.style.overflow = '';
  ed = null;
}
$('ed-cerrar').addEventListener('click', cerrarEditor);
$('ed-fondo').addEventListener('click', cerrarEditor);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ed) cerrarEditor(); });

function pintarChipsEd(id, valor){
  document.querySelectorAll('#' + id + ' .chip').forEach(c => c.classList.toggle('on', c.dataset.v === String(valor)));
}
function initChipsEd(id, campo, cb){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b || b.classList.contains('off') || !ed) return;
    $(id).querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    ed.sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}
initChipsEd('ed-chips-categoria','categoria');
initChipsEd('ed-chips-metodo','metodo', aplicarMetodoEd);
initChipsEd('ed-chips-tarjeta','tarjeta', v => { $('ed-tarjeta-otra').hidden = v !== '__otra'; });
initChipsEd('ed-chips-cuotas','cuotas');

function aplicarMetodoEd(){
  if(!ed) return;
  const m = ed.sel.metodo;
  const conTarjeta = m === 'debito' || m === 'credito';
  $('ed-grupo-tarjeta').hidden = !conTarjeta;
  $('ed-grupo-cuotas').hidden = m !== 'credito';
  if(conTarjeta) pintarTarjetasEd(); else $('ed-tarjeta-otra').hidden = true;
  if(m === 'credito') pintarCuotasEd();
}
// Las opciones incluyen SIEMPRE lo que ya tenía la fila (aunque sea una
// tarjeta o un plan de cuotas que la app no ofrece hoy).
function pintarTarjetasEd(){
  const t = ed.sel.tarjeta && ed.sel.tarjeta !== '__otra' ? ed.sel.tarjeta : '';
  const lista = TARJETAS_ED.slice();
  if(t && lista.indexOf(t) === -1) lista.push(t);
  $('ed-chips-tarjeta').innerHTML =
    lista.map(x => '<button class="chip' + (x === t ? ' on' : '') + '" data-v="' + esc(x) + '">' + esc(x) + '</button>').join('') +
    '<button class="chip' + (t ? '' : ' on') + '" data-v="__otra">Otra</button>';
  $('ed-tarjeta-otra').hidden = !!t;
}
function pintarCuotasEd(){
  const n = Math.max(1, numE(ed.sel.cuotas) || 1);
  const lista = [1,3,6,12];
  if(lista.indexOf(n) === -1) lista.push(n);
  lista.sort((a,b) => a-b);
  $('ed-chips-cuotas').innerHTML = lista.map(x =>
    '<button class="chip' + (x === n ? ' on' : '') + '" data-v="' + x + '">' + x + '</button>').join('');
}

$('ed-monto').addEventListener('input', () => {
  const n = $('ed-monto').value.replace(/\D/g,'');
  $('ed-monto').value = n ? Number(n).toLocaleString('es-AR') : '';
});

// Una llamada de mantenimiento. Devuelve {n} | {compat:true} | {error}
async function rpcMant(nombre, body){
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nombre, {
      method:'POST', headers:{...H, 'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    let txt = ''; try{ txt = await r.text(); }catch(e){}
    if(r.ok) return {n: Number(txt) || 0};
    if(esRpcQueNoExiste(r.status, txt)) return {compat:true};
    return {error: txt || ('HTTP ' + r.status)};
  }catch(e){ return {error: String((e && e.message) || e)}; }
}

// Cola local (el gasto todavía no llegó al servidor)
function aplicarACola(it, c){
  if('nuevo_monto' in c)       it.monto = c.nuevo_monto;
  if('nueva_descripcion' in c) it.descripcion = c.nueva_descripcion;
  if('nueva_fecha' in c)       it.fecha = c.nueva_fecha;
  if('nuevo_metodo' in c)      it.metodo = c.nuevo_metodo;
  if('nueva_tarjeta' in c)     it.tarjeta = c.nueva_tarjeta;
  if('nuevas_cuotas' in c)     it.cuotas = c.nuevas_cuotas;
  if('nueva_categoria' in c)   it.categoria = c.nueva_categoria;
  // Mismas reglas que la base, para que suba coherente
  if(it.metodo !== 'credito' && it.metodo !== 'debito') it.tarjeta = null;
  if(it.metodo !== 'credito') it.cuotas = 1;
  if(numE(it.monto) > 0) it.relevar = false;
}
function editarEnCola(f, c){
  const hist = leerLS();
  const it = hist.find(x => x.local_id && x.local_id === f.local_id);
  if(!it) return {n:0};
  aplicarACola(it, c);
  escribirLS(hist);
  return {n:1};
}
function borrarDeCola(f){
  const antes = leerLS();
  const hist = antes.filter(x => !(x.local_id && x.local_id === f.local_id));
  escribirLS(hist);
  refrescarPendientes();
  return {n: antes.length - hist.length};
}

function notaEd(msg, tipo){
  $('ed-nota').textContent = msg;
  $('ed-nota').hidden = false;
  toast(msg, tipo || 'warn');
}
const MSG_COMPAT = 'La edición se habilita en unos minutos — tu gasto quedó igual';

// soloLocal = el gasto estaba en la cola del teléfono: no hay nada que
// volver a pedirle al servidor, alcanza con redibujar.
async function terminarEd(res, msgOk, soloLocal){
  $('ed-guardar').disabled = false; $('ed-guardar').textContent = 'Guardar cambios';
  $('ed-si').disabled = false; $('ed-si').textContent = 'Sí, borrar';
  if(res.compat){ notaEd(MSG_COMPAT); return; }
  if(res.error){ notaEd(navigator.onLine ? 'No se pudo guardar — probá de nuevo' : 'Sin conexión — probá al volver la señal', 'error'); return; }
  if(!res.n){ notaEd('Ese gasto ya no está — actualizá el historial'); return; }
  if(navigator.vibrate) navigator.vibrate(30);
  cerrarEditor();
  toast(msgOk, 'ok');
  if(soloLocal){ await abrirHistorial(); return; }
  filasCache = null;
  await abrirHistorial(true);     // lista y totales al día
}

$('ed-guardar').addEventListener('click', async () => {
  if(!ed) return;
  const f = ed.f, o = ed.orig, s = ed.sel;
  const monto = Number(($('ed-monto').value || '').replace(/\D/g,''));
  if(!monto && !f.foto_path){ toast('Poné un monto'); $('ed-monto').focus(); return; }
  const desc  = $('ed-desc').value.trim();
  const fecha = $('ed-fecha').value || o.fecha;
  const esCredito = s.metodo === 'credito';
  const conTarjeta = esCredito || s.metodo === 'debito';
  let tarjeta = '';
  if(conTarjeta){
    tarjeta = s.tarjeta === '__otra' ? ($('ed-tarjeta-otra').value.trim() || 'Otra') : (s.tarjeta || '');
  }
  const cuotas = esCredito ? Math.max(1, numE(s.cuotas) || 1) : 1;

  // Solo se manda lo que cambió: nada de reescribir campos por las dudas.
  const c = {};
  if(monto !== o.monto) c.nuevo_monto = monto;
  if(desc !== o.descripcion) c.nueva_descripcion = desc;
  if(fecha !== o.fecha) c.nueva_fecha = fecha;
  if(s.metodo !== o.metodo) c.nuevo_metodo = s.metodo;
  if(conTarjeta && tarjeta && tarjeta !== o.tarjeta) c.nueva_tarjeta = tarjeta;
  if(esCredito && cuotas !== o.cuotas) c.nuevas_cuotas = cuotas;
  if(s.categoria !== o.categoria) c.nueva_categoria = s.categoria;
  if(!Object.keys(c).length){ toast('No cambiaste nada'); cerrarEditor(); return; }

  $('ed-guardar').disabled = true; $('ed-guardar').textContent = 'Guardando…';
  $('ed-nota').hidden = true;
  const enCola = !!f._pendiente;
  const res = enCola
    ? editarEnCola(f, c)
    : await rpcMant(RPC_ED, {clave: CLAVE_PERSONAL, fila_id: f.id, ...c});
  await terminarEd(res, '✓ Cambios guardados', enCola);
});

// Borrar: dos pasos, siempre.
$('ed-borrar').addEventListener('click', () => {
  $('ed-confirmar').hidden = false;
  $('ed-borrar').hidden = true;
  $('ed-confirmar').scrollIntoView({block:'nearest', behavior:'smooth'});
});
$('ed-no').addEventListener('click', () => {
  $('ed-confirmar').hidden = true;
  $('ed-borrar').hidden = false;
});
$('ed-si').addEventListener('click', async () => {
  if(!ed) return;
  const f = ed.f;
  const enCola = !!f._pendiente;
  $('ed-si').disabled = true; $('ed-si').textContent = 'Borrando…';
  const res = enCola
    ? borrarDeCola(f)
    : await rpcMant(RPC_BO, {clave: CLAVE_PERSONAL, fila_id: f.id});
  if(!res.n || res.compat || res.error){       // no se borró: vuelve el botón
    $('ed-confirmar').hidden = true; $('ed-borrar').hidden = false;
  }
  await terminarEd(res, '✓ Gasto eliminado', enCola);
});

// ---------- arranque ----------
if(location.hash === '#historial') setVista('historial');
if(location.hash === '#resumen' || location.hash === '#proximos') setVista('resumen');
reintentarPendientes(false);
refrescarPendientes();
// Si el navegador no deja registrar el worker (modo incógnito, política del
// equipo), la app funciona igual online: no ensuciamos la consola por eso.
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
