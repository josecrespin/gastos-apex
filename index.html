// EL redondeo: cada gasto se redondea UNA sola vez, acá, al peso que se ve
// en su fila. De ahí para arriba solo se suman enteros, así cualquier total
// es exactamente la suma de lo que se muestra (igual que en las apps de
// Agus y Facu — sin esto, el total decía $1 menos que José + Facu).
const montoEnt = f => Math.round(Number(f.monto) || 0);

// Para lo único que sigue dando decimales: las cuotas (un gasto dividido en
// N). Devuelve las partes en pesos enteros ajustadas para que sumen EXACTO
// el total redondeado. Método del resto mayor: el peso que sobra o falta va
// a la parte con la fracción más grande.
function partesRedondeadas(total, partes){
  const objetivo = Math.round(Number(total) || 0);
  const base = partes.map(v => Math.floor(Number(v) || 0));
  const orden = partes
    .map((v, i) => ({i, frac: (Number(v) || 0) - Math.floor(Number(v) || 0)}))
    .sort((a, b) => b.frac - a.frac);
  let resto = objetivo - base.reduce((s, v) => s + v, 0);
  if(!orden.length) return base;
  for(let k = 0; resto > 0; k++, resto--) base[orden[k % orden.length].i]++;
  for(let k = 0; resto < 0; k++, resto++) base[orden[orden.length - 1 - (k % orden.length)].i]--;
  return base;
}

async function comprimirFoto(file){
  const img = await createImageBitmap(file);
  const max = 1600;
  const escala = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * escala);
  c.height = Math.round(img.height * escala);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

async function subirFoto(file, fecha){
  const blob = await comprimirFoto(file);
  const path = 'obras/' + fecha + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const r = await fetch(SUPABASE_URL + '/storage/v1/object/facturas/' + path, {
    method:'POST', headers:{...H, 'Content-Type':'image/jpeg'}, body: blob,
  });
  return r.ok ? path : null;
}

// ---------- persistencia local + POST con anti-duplicados ----------
function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function escribirLS(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }

// Anti-duplicados: cada gasto viaja con un local_id único (índice UNIQUE en
// la DB). Si el teléfono reintenta un envío que ya había llegado, la base
// contesta 409 (duplicado) y se toma como "ya guardado" — no se duplica.
// OJO: no se usa on_conflict/ignore-duplicates porque el RLS es insert-only
// (sin SELECT para anon) y ese modo necesita leer la fila en conflicto.
// Resiliencia de esquema: si a la DB le falta una columna nueva (p.ej.
// `recurrente_meses` antes de correr SETUP-GASTOS-V7.sql), se reintenta
// sin ella — la marca queda solo local hasta que corra el SQL.
const OPCIONALES = {local_id:true, relevar:true, recurrente_meses:true};

async function postSupabase(gasto){
  for(let i = 0; i <= Object.keys(OPCIONALES).length; i++){
    const body = {...gasto};
    for(const c in OPCIONALES) if(!OPCIONALES[c]) delete body[c];
    const r = await fetch(SUPABASE_URL + '/rest/v1/' + TABLA, {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body: JSON.stringify(body),
    });
    if(r.ok) return true;
    let msg = '';
    try{ msg = await r.text(); }catch(e){}
    if(r.status === 409 && /23505|duplicate/i.test(msg)) return true;   // ya estaba
    let cambio = false;
    for(const c in OPCIONALES){
      if(OPCIONALES[c] && (c in body) && msg.includes(c)){ OPCIONALES[c] = false; cambio = true; }
    }
    if(!cambio) return false;   // error real, no de columnas
  }
  return false;
}

function refrescarPendientes(){
  const n = leerLS().filter(x => x.estado === 'pendiente').length;
  const el = $('pendientes');
  el.textContent = n ? ('⚠ ' + n + ' en cola sin sincronizar — tocá para reintentar') : '';
  el.classList.toggle('show', n > 0);
}

let reintentando = false;
async function reintentarPendientes(avisar){
  if(reintentando || !navigator.onLine) { refrescarPendientes(); return; }
  reintentando = true;
  const hist = leerLS();
  let enviados = 0;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    const {estado, ...gasto} = item;   // el local_id VIAJA con el gasto (dedup)
    try{ if(await postSupabase(gasto)){ item.estado = 'ok'; enviados++; } }catch(e){}
  }
  if(enviados){ escribirLS(hist); filasCache = null; }
  reintentando = false;
  refrescarPendientes();
  if(avisar && enviados) toast('✓ ' + enviados + ' gasto(s) sincronizado(s)', 'ok');
}

  const esCredito = sel.metodo === 'credito';
  const conTarjeta = esCredito || sel.metodo === 'debito';
  let tarjeta = null;
  if(conTarjeta){
    tarjeta = sel.tarjeta === '__otra'
      ? ($('tarjeta-otra').value.trim() || 'Otra')
      : sel.tarjeta;
  }
  btn.disabled = true; btn.textContent = 'Guardando…';

  let foto_path = null;
  if(hayFoto){
    try{ foto_path = await subirFoto(fotoInput.files[0], fechaElegida()); }catch(e){}
  }

  const gasto = {
    fecha: fechaElegida(),
    monto: monto || 0,
    descripcion: $('descripcion').value.trim(),
    proyecto: sel.proyecto,
    quien: sel.quien,
    metodo: sel.metodo,
    tarjeta: tarjeta,

    local_id: uuid(),

  if(sel.recurrente && sel.recMeses !== 'inf') gasto.recurrente_meses = Number(sel.recMeses);

  const hist = leerLS();
  const item = {...gasto, estado:'pendiente'};
  hist.push(item); escribirLS(hist);

  let ok = false;
  try{ ok = await postSupabase(gasto); }catch(e){}
  if(ok){ item.estado = 'ok'; escribirLS(hist); }
  filasCache = null;               // el historial se refresca con el gasto nuevo

  const fotoFallo = hayFoto && !foto_path;
  if(navigator.vibrate) navigator.vibrate(ok ? 30 : [60,60,60]);
  btn.classList.add('ok');
  btn.textContent = ok ? '✓ Guardado' : '✓ Guardado acá';
  if(!ok){
    toast(navigator.onLine
      ? 'No se pudo guardar en el servidor — quedó en cola y se reintenta solo'
      : 'Sin conexión — quedó en cola, se envía al volver la señal', 'error');
  } else if(fotoFallo){
    toast(monto
      ? 'Gasto guardado, pero la foto no subió'
      : 'Guardado sin foto ni monto — completalo a mano después', 'warn');
  } else if(!monto){
    toast('✓ Guardado — Jarvis saca el monto de la factura', 'ok');
  } else {
    toast('✓ Guardado — ya figura arriba del Historial', 'ok');
  }
  setTimeout(() => {
    btn.classList.remove('ok'); btn.disabled = false; btn.textContent = 'Guardar gasto';
    montoEl.value = ''; $('descripcion').value = '';
    sel.fecha = 'hoy'; $('fecha').hidden = true; $('fecha').value = '';
    document.querySelectorAll('#chips-fecha .chip').forEach(c => c.classList.toggle('on', c.dataset.v === 'hoy'));
    sel.recurrente = false; sel.recMeses = '12';
    document.querySelectorAll('#chips-rec-meses .chip').forEach(c => c.classList.toggle('on', c.dataset.v === '12'));
    pintarRec();
    fotoInput.value = ''; btnFoto.classList.remove('on'); btnFoto.textContent = '📷 Foto de la factura';
    $('foto-hint').hidden = true;
  }, 1500);
  refrescarPendientes();
});

// ---------- datos (RPC con clave + cache en memoria) ----------
let filasCache = null;
async function traerFilas(force){
  if(filasCache && !force) return filasCache;
  const clave = localStorage.getItem(CLAVE_KEY);
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + RPC_LISTA, {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({clave}),
  });
  if(!r.ok) throw new Error('server');
  const filas = await r.json();
  // `fecha` se usa para ordenar, agrupar y proyectar. Una sola fila con
  // fecha nula tiraba TODO el render (pantalla trabada en "Cargando…").
  filasCache = (Array.isArray(filas) ? filas : [])
    .map(f => (typeof f.fecha === 'string' ? f : {...f, fecha: f.fecha ? String(f.fecha) : ''}));
  return filasCache;
}

let destinoConClave = 'historial';
function setVista(v){
  ['cargar','gate','historial','resumen'].forEach(x => { $('vista-' + x).hidden = x !== v; });
  $('tab-cargar').classList.toggle('act', v === 'cargar');
  $('tab-historial').classList.toggle('act', v === 'historial' || (v === 'gate' && destinoConClave === 'historial'));
  $('tab-resumen').classList.toggle('act', v === 'resumen' || (v === 'gate' && destinoConClave === 'resumen'));
  if(v === 'historial') abrirHistorial();
  if(v === 'resumen') abrirResumen();
}
function pedirVista(v){
  if((v === 'historial' || v === 'resumen') && !localStorage.getItem(CLAVE_KEY)){
    destinoConClave = v; setVista('gate'); return;
  }
  setVista(v);
}
$('tab-cargar').addEventListener('click', () => setVista('cargar'));
$('tab-historial').addEventListener('click', () => pedirVista('historial'));
$('tab-resumen').addEventListener('click', () => pedirVista('resumen'));
$('refrescar-hist').addEventListener('click', () => abrirHistorial(true));
$('refrescar-res').addEventListener('click', () => abrirResumen(true));

$('clave-ok').addEventListener('click', () => {
  const v = $('clave-input').value.trim();
  if(!v) return;
  localStorage.setItem(CLAVE_KEY, v);
  setVista(destinoConClave);
});
function olvidarClave(destino){
  localStorage.removeItem(CLAVE_KEY);
  filasCache = null;
  pedirVista(destino);
}
$('cambiar-clave-h').addEventListener('click', () => olvidarClave('historial'));
$('cambiar-clave-r').addEventListener('click', () => olvidarClave('resumen'));

async function abrirHistorial(force){
  const cont = $('hist-lista');
  $('cambiar-clave-h').hidden = true;
  if(!filasCache || force){
    cont.innerHTML = '<div class="vacio">Cargando…</div>';
    $('hist-stats').textContent = '';
    try{ await traerFilas(true); }
    catch(e){
      cont.innerHTML = '<div class="vacio"><b>' + (navigator.onLine ? 'Error del servidor' : 'Sin conexión') + '</b>Tocá ↻ Actualizar para probar de nuevo.</div>';
      return;
    }
  }
  try{ renderHistorial(); }
  catch(e){ cont.innerHTML = htmlFalla(e); }
  $('cambiar-clave-h').hidden = false;
}

function coincide(f){
  if(filtro.quien !== 'todos' && f.quien !== filtro.quien) return false;
  if(filtro.proyecto !== 'todos' && f.proyecto !== filtro.proyecto) return false;
  if(!filtro.q) return true;
  const blob = [f.descripcion, f.tarjeta, NOMBRES[f.quien], PROYECTOS[f.proyecto],
                METODO_TXT[f.metodo], String(f.monto)].join(' ').toLowerCase();
  return blob.includes(filtro.q);
}

function filaHTML(f){
  const badge = f.metodo === 'credito'
    ? '<span class="badge badge--credito">Crédito ' + (Number(f.cuotas) || 1) + '×</span>'
    : '<span class="badge">' + (METODO_TXT[f.metodo] || esc(f.metodo)) + '</span>';
  const extra = f.tarjeta ? '<span class="extra">' + esc(f.tarjeta) + '</span>' : '';
  const rec = f.es_recurrente
    ? '<span class="badge badge--recurrente">🔁 ' + (Number(f.recurrente_meses) ? Number(f.recurrente_meses) + ' meses' : 'fijo') + '</span>' : '';
  const rev = f.relevar ? '<span class="badge badge--relevar">🔎 Jarvis la está leyendo</span>' : '';
  const cola = f._pendiente ? '<span class="badge badge--cola">⏳ en cola</span>' : '';
  const thumb = f.foto_path
    ? '<button class="thumb" data-foto="' + esc(f.foto_path) + '" aria-label="Ver factura"><span>📷</span></button>' : '';
  const importe = (f.relevar && !Number(f.monto)) ? '$ —' : fmt$(montoEnt(f));
  return '<div class="gasto gasto--' + (PROY_CLASE[f.proyecto] || 'obra') + (thumb ? ' gasto--conthumb' : '') + '">' +
    '<div class="avatar avatar--' + esc(f.quien) + '">' + (INICIAL[f.quien] || '?') + '</div>' +
    '<div class="info"><div class="desc">' + esc(f.descripcion || '(sin detalle)') + '</div>' +
    '<div class="meta">' + badge + extra + rec + rev + cola + '</div></div>' +
    thumb +
    '<div class="importe"><div class="m money">' + importe + '</div>' +
    '<div class="f">' + (NOMBRES[f.quien] || '') + '</div></div>' +
  '</div>';
}

function renderHistorial(){
  const cont = $('hist-lista');
  if(!filasCache) return;
  // Pendientes locales arriba (todavía no llegaron al server) — sin duplicar
  const enServer = new Set(filasCache.map(f => f.local_id).filter(Boolean));
  const pendientes = leerLS()
    .filter(x => x.estado === 'pendiente' && !enServer.has(x.local_id))
    .map(x => ({...x, fecha: String(x.fecha || hoyLocal()), _pendiente:true, id: Infinity}));
  const todas = [...pendientes, ...filasCache]
    .sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || (b.id || 0) - (a.id || 0));
  const filtradas = todas.filter(coincide);

  const totalF = filtradas.reduce((s, f) => s + montoEnt(f), 0);
  $('hist-stats').textContent = filtradas.length
    ? filtradas.length + ' gasto' + (filtradas.length === 1 ? '' : 's') + ' · ' + fmt$(totalF)
    : '';

  if(!filtradas.length){
    cont.innerHTML = filasCache.length || pendientes.length
      ? '<div class="vacio"><b>Nada con ese filtro</b>Probá con otra búsqueda.</div>'
      : '<div class="vacio"><b>Sin datos</b>¿La clave está bien?</div>';
    return;
  }

  let html = '', diaActual = null;
  for(const f of filtradas){
    if(f.fecha !== diaActual){
      diaActual = f.fecha;
      const delDia = filtradas.filter(x => x.fecha === f.fecha);
      const totDia = delDia.reduce((s, x) => s + montoEnt(x), 0);
      html += '<div class="dia-head"><span class="dia">' + esc(etiquetaDia(f.fecha)) + '</span>' +
              '<b class="money">' + fmt$(totDia) + '</b></div>';
    }
    html += filaHTML(f);
  }
  cont.innerHTML = html;
  cont.querySelectorAll('[data-foto]').forEach(el => {
    cargarThumb(el);
    el.addEventListener('click', () => verFoto(el.dataset.foto));
  });
}

// Miniaturas: el bucket es privado → se bajan con la anon key y se cachean
const thumbCache = new Map();

// Regla: TODA compra a crédito impacta los meses siguientes (aun en 1 cuota).
// Recurrentes (v4): respetan el horizonte elegido — N meses en total (el
// gasto cargado cuenta como pago 1) o sin fin si no se puso límite.
// Crédito + recurrente: manda el crédito (sin doble conteo).
function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const sub = (NOMBRES[f.quien] || f.quien) + ' · ' + (PROYECTOS[f.proyecto] || f.proyecto);
    const esCredito = f.metodo === 'credito';
    if(f.es_recurrente && !esCredito){
      const N = Number(f.recurrente_meses) || 0;   // 0 = sin fin
      for(let k = Math.max(0, base + 1); k < meses.length; k++){
        const nro = k - base + 1;                  // el gasto original fue el pago 1
        if(N && nro > N) break;
        meses[k].items.push({t: etiqueta, sub, rec:true,
                             cuota: N ? nro + '/' + N : null, v: montoEnt(f)});
      }
    }
    if(esCredito){
      const n = Math.max(1, Number(f.cuotas) || 1);
      const cuota = montoEnt(f) / n;
      for(let i = 1; i <= n; i++){
        const k = base + i;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta, sub, cuota: i + '/' + n, v: cuota});
      }
    }
  }
  return meses;
}

function barPath(x, y, w, h, r){
  r = Math.min(r, h);
  return 'M' + x + ' ' + (y + h) + ' V' + (y + r) +
         ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
         ' H' + (x + w - r) +
         ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) +
         ' V' + (y + h) + ' Z';
}

// Gráfico SVG propio: gasto por mes, últimos 6 meses (una serie = un color)
function chartMeses(filas, color){
  const hoy = new Date();
  const labs = [], vals = [];
  for(let k = 5; k >= 0; k--){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - k, 1);
    const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    labs.push(d.toLocaleDateString('es-AR', {month:'short'}).replace('.',''));
    vals.push(filas.filter(f => f.fecha.startsWith(ym)).reduce((s, f) => s + montoEnt(f), 0));
  }
  const max = Math.max(...vals, 1);
  const W = 320, base = 124, top = 26, bw = 34;
  const gap = (W - 6 * bw) / 7;
  let s = '<svg class="grafico" viewBox="0 0 320 150" role="img" aria-label="Gasto por mes: ' +
    labs.map((l, i) => l + ' ' + fmt$(vals[i])).join(', ') + '">';
  s += '<line x1="0" y1="' + (base + .5) + '" x2="320" y2="' + (base + .5) + '" stroke="rgba(232,226,213,.18)" stroke-width="1"/>';
  vals.forEach((v, i) => {
    const x = gap + (bw + gap) * i;
    const h = Math.max(v / max * (base - top), 2);
    const y = base - h;
    const cur = i === 5;
    s += '<path d="' + barPath(x, y, bw, h, 4) + '" fill="' + color + '"' + (cur ? '' : ' opacity=".55"') + '/>';
    s += '<text x="' + (x + bw/2) + '" y="' + (y - 6) + '" class="g-val' + (cur ? ' g-val--cur' : '') + '" text-anchor="middle">' + (v ? fmtK(v) : '—') + '</text>';
    s += '<text x="' + (x + bw/2) + '" y="142" class="g-lab" text-anchor="middle">' + esc(labs[i]) + '</text>';
  });
  s += '</svg>';
  return s;
}

function renderResumen(filas){
  const total = filas.reduce((s, f) => s + montoEnt(f), 0);
  const porQuien = {jose:0, facu:0, agus:0};
  const porProy = {};
  const nProy = {};
  for(const f of filas){
    porQuien[f.quien] = (porQuien[f.quien] || 0) + montoEnt(f);
    porProy[f.proyecto] = (porProy[f.proyecto] || 0) + montoEnt(f);
    nProy[f.proyecto] = (nProy[f.proyecto] || 0) + 1;
  }
  const pct = q => total ? (porQuien[q] / total * 100) : 0;

  // Últimos 30 días
  const d30 = new Date(); d30.setDate(d30.getDate() - 30);
  const corte30 = isoLocal(d30);
  const ult30 = filas.filter(f => f.fecha >= corte30);
  const total30 = ult30.reduce((s, f) => s + montoEnt(f), 0);

  // Comprometido a futuro (cuotas + fijos de los próximos meses).
  // Cada mes se redondea entero y el comprometido suma esos totales,
  // para que el stat card diga exactamente lo que suman las tarjetas.
  const meses = proyectar(filas).filter(m => m.items.length);
  const comprometido = meses.reduce((s, m) => s + Math.round(m.items.reduce((x, i) => x + i.v, 0)), 0);

  // HERO: total + onda firma + apilada por hermano
  let html =
    '<section class="hero">' +
      '<div class="etiqueta">Total invertido</div>' +
      '<div class="total money">' + fmt$(total) + '</div>' +
      '<svg class="onda" viewBox="0 0 220 14" aria-hidden="true">' +
        '<path d="M2 8 Q30 2 58 8 T114 8 T170 8 T226 8" fill="none" stroke="#C98F5F" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>' +
      '</svg>' +
      '<div class="sub">' + filas.length + ' gastos entre los tres</div>' +
      '<div class="stacked" role="img" aria-label="' +
        ['jose','facu','agus'].map(q => NOMBRES[q] + ' ' + Math.round(pct(q)) + '%').join(', ') + '">' +
        ['jose','facu','agus'].filter(q => porQuien[q] > 0).map(q =>
          '<i style="width:' + pct(q).toFixed(1) + '%; background:var(--p-' + q + ')"></i>').join('') +
      '</div>' +
      '<div class="leyenda">' +
        ['jose','facu','agus'].map(q =>
          '<span><i style="background:var(--p-' + q + ')"></i>' + NOMBRES[q] + ' <b>' + fmt$(porQuien[q] || 0) + '</b></span>').join('') +
      '</div>' +
    '</section>';

  // STATS: por proyecto + últimos 30 días + comprometido
  html += '<div class="stat-grid">';
  for(const p of ['fagu_obra','tafi']){
    if(!porProy[p]) continue;
    html += '<div class="stat-card stat-card--' + PROY_CLASE[p] + '">' +
      '<div class="lbl">' + esc(PROYECTOS[p]) + '</div>' +
      '<div class="val money">' + fmt$(porProy[p]) + '</div>' +
      '<div class="sub">' + nProy[p] + ' gasto' + (nProy[p] === 1 ? '' : 's') + '</div>' +
    '</div>';
  }
  html += '<div class="stat-card stat-card--pearl">' +
      '<div class="lbl">Últimos 30 días</div>' +
      '<div class="val money">' + fmt$(total30) + '</div>' +
      '<div class="sub">' + ult30.length + ' gasto' + (ult30.length === 1 ? '' : 's') + '</div>' +
    '</div>';
  html += '<div class="stat-card stat-card--copper">' +
      '<div class="lbl">Comprometido</div>' +
      '<div class="val money">' + fmt$(comprometido) + '</div>' +
      '<div class="sub">cuotas + fijos que vienen</div>' +
    '</div>';
  html += '</div>';

  // CUÁNTO PUSO CADA UNO
  const maxQuien = Math.max(...Object.values(porQuien), 1);
  html +=
    '<section class="card"><h3>Cuánto puso cada uno</h3><div class="bars">' +
    ['jose','facu','agus'].map(q =>
      '<div class="bar-row bar-row--' + q + '">' +
        '<span class="quien">' + NOMBRES[q] + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="--w:' + ((porQuien[q] || 0) / maxQuien * 100).toFixed(1) + '%"></div></div>' +
        '<span class="cuanto">' + fmt$(porQuien[q] || 0) + '</span>' +
      '</div>').join('') +
    '</div></section>';

  // GASTO POR MES (SVG propio)
  html += '<section class="card"><h3>Gasto por mes</h3>' + chartMeses(filas, '#C98F5F') + '</section>';

  // COMPROMISOS QUE VIENEN (proyección de cuotas + fijos)
  html += '<div class="seccion"><h2>Compromisos que vienen</h2></div>';
  if(meses.length){
    // Las cuotas caen en decimales: cada mes reparte su propio redondeo
    // para que las filas den exacto el total del mes.
    html += meses.map(mes => {
      const t = mes.items.reduce((s, i) => s + i.v, 0);
      const itemsR = partesRedondeadas(t, mes.items.map(i => i.v));
      let nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long'});
      nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      if(mes.y !== new Date().getFullYear()) nombre += ' ' + mes.y;
      return '<div class="mes-card">' +
        '<div class="mes-head"><span class="mes-nombre">' + esc(nombre) + '</span><span class="mes-total money">' + fmt$(Math.round(t)) + '</span></div>' +
        mes.items.map((i, ix) =>
          '<div class="mes-item"><span class="dos-lineas">' +
            '<span class="mes-t">' + (i.rec ? '🔁 ' : '') + esc(i.t) + '</span>' +
            '<span class="mes-sub">' + esc(i.sub) + '</span></span>' +
          (i.cuota ? '<span class="cuota-n">' + i.cuota + '</span>' : '') +
          '<b class="money">' + fmt$(itemsR[ix]) + '</b></div>').join('') +
        '</div>';
    }).join('');
    html += '<p class="pie">Suma cuotas de crédito + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra.</p>';
  } else {
    html += '<div class="vacio"><b>Nada proyectado</b>Sin cuotas pendientes ni gastos recurrentes.</div>';
  }

  $('res-contenido').innerHTML = html;
}
