<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Obras · Apex Sync</title>
<meta name="theme-color" content="#0c0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obras AS">
<style>
  :root{
    --bg:#0c0d10; --panel:#15171c; --line:#23262e;
    --txt:#f2f3f5; --dim:#8b909c;
    --accent:#4f7cff; --accent2:#3b5fd9;
    --ok:#2ecc71; --warn:#f0a92e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100dvh; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px)}
  header{display:flex; align-items:center; gap:10px; padding:14px 2px 6px}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;letter-spacing:.5px}
  header h1{font-size:15px;font-weight:600;margin:0;color:var(--dim)}
  header h1 b{color:var(--txt);font-weight:700}
  #ver-proximos{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;
    color:var(--accent);font-size:13px;font-weight:700;padding:7px 11px;cursor:pointer}

  .monto-wrap{padding:14px 0 4px;text-align:center}
  .monto-box{display:flex;align-items:baseline;justify-content:center;gap:6px}
  .monto-box .signo{font-size:30px;color:var(--dim);font-weight:600}
  #monto{font-size:52px;font-weight:800;background:none;border:none;color:var(--txt);
    width:100%;max-width:260px;text-align:center;outline:none;padding:0;caret-color:var(--accent)}
  #monto::placeholder{color:#3a3e48}

  .campo{margin:10px 0}
  #descripcion{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);font-size:16px;padding:13px 14px;outline:none}
  #descripcion:focus{border-color:var(--accent)}
  #descripcion::placeholder{color:var(--dim)}
  .fila-fecha{display:flex;align-items:center;gap:10px;margin:10px 0 0}
  .fila-fecha label{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--dim)}
  #fecha{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);font-size:15px;padding:10px 12px;outline:none;color-scheme:dark}

  .grupo{margin:14px 0 0}
  .grupo label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--dim);margin:0 0 8px 2px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{flex:1 1 auto;min-width:88px;padding:11px 10px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:14.5px;font-weight:600;text-align:center;cursor:pointer;
    transition:background .12s,border-color .12s}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.off{opacity:.32;pointer-events:none}
  .chips.cuotas .chip{min-width:52px;flex:1 1 0}
  #recurrente{width:100%;margin-top:14px}
  #recurrente.on{background:var(--warn);border-color:var(--warn);color:#1a1305}

  #credito-extra{display:none}
  #credito-extra.show{display:block}
  #tarjeta-otra{display:none;margin-top:8px;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;color:var(--txt);font-size:15px;padding:11px 13px;outline:none}
  #tarjeta-otra.show{display:block}

  #guardar{margin-top:20px;width:100%;padding:17px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    font-size:17px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:transform .08s,opacity .2s}
  #guardar:active{transform:scale(.985)}
  #guardar.ok{background:var(--ok)}
  #guardar:disabled{opacity:.6}

  footer{margin-top:auto;padding-top:18px;text-align:center;font-size:12.5px;color:var(--dim)}
  #pendientes{display:none;margin-top:6px;font-size:12px;color:var(--warn)}
  #pendientes.show{display:block}
  #exportar{margin-top:8px;font-size:12px;color:var(--dim);text-decoration:underline;background:none;border:none;cursor:pointer}

  /* Vista Próximos meses */
  #vista-proximos{display:none}
  body.modo-proximos #vista-form{display:none}
  body.modo-proximos #vista-proximos{display:block}
  .clave-gate{margin:24px 0;text-align:center}
  .clave-gate input{width:100%;max-width:260px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;color:var(--txt);font-size:16px;padding:13px 14px;outline:none;text-align:center}
  .clave-gate button{margin-top:10px;padding:12px 26px;border:none;border-radius:12px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  .mes-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
  .mes-card h3{margin:0 0 4px;font-size:14px;letter-spacing:.6px;color:var(--dim);text-transform:uppercase}
  .mes-card .total{font-size:26px;font-weight:800;margin-bottom:8px}
  .mes-item{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--dim);padding:3px 0}
  .mes-item span:last-child{color:var(--txt);font-weight:600;white-space:nowrap}
  .prox-nota{font-size:12px;color:var(--dim);text-align:center;margin:10px 0}
  #cambiar-clave{background:none;border:none;color:var(--dim);font-size:11.5px;text-decoration:underline;cursor:pointer;display:block;margin:8px auto 0}
</style>
</head>
<body>
<header>
  <div class="logo">AS</div>
  <h1><b>Gasto de obra</b> · Apex Sync</h1>
  <button id="ver-proximos">Próximos →</button>
</header>

<div id="vista-form">
  <div class="monto-wrap">
    <div class="monto-box">
      <span class="signo">$</span>
      <input id="monto" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
    </div>
  </div>

  <div class="campo">
    <input id="descripcion" type="text" autocomplete="off" placeholder="¿En qué? (ej: membrana, SAT, cemento)">
  </div>

  <div class="fila-fecha">
    <label>FECHA</label>
    <input id="fecha" type="date">
  </div>

  <div class="grupo">
    <label>OBRA</label>
    <div class="chips" id="chips-proyecto">
      <button class="chip on" data-v="fagu_obra">Obra FAGU</button>
      <button class="chip" data-v="tafi">Casa Tafí</button>
    </div>
  </div>

  <div class="grupo">
    <label>PAGÓ</label>
    <div class="chips" id="chips-quien">
      <button class="chip on" data-v="jose">Yo</button>
      <button class="chip" data-v="facu">Facu</button>
      <button class="chip" data-v="agus">Agus</button>
    </div>
  </div>

  <div class="grupo">
    <label>MÉTODO</label>
    <div class="chips" id="chips-metodo">
      <button class="chip on" data-v="efectivo">Efectivo</button>
      <button class="chip" data-v="transferencia">Transf.</button>
      <button class="chip" data-v="credito">Crédito</button>
    </div>
  </div>

  <div id="credito-extra">
    <div class="grupo">
      <label>TARJETA</label>
      <div class="chips" id="chips-tarjeta">
        <button class="chip on" data-v="Visa Francés">Visa Francés</button>
        <button class="chip" data-v="__otra">Otra</button>
      </div>
      <input id="tarjeta-otra" type="text" placeholder="¿Qué tarjeta?">
    </div>
    <div class="grupo">
      <label>CUOTAS</label>
      <div class="chips cuotas" id="chips-cuotas">
        <button class="chip on" data-v="1">1</button>
        <button class="chip" data-v="3">3</button>
        <button class="chip" data-v="6">6</button>
        <button class="chip" data-v="12">12</button>
      </div>
    </div>
  </div>

  <button id="recurrente" class="chip">🔁 Se repite todos los meses</button>

  <button id="guardar">Guardar gasto</button>
</div>

<div id="vista-proximos">
  <div id="clave-gate" class="clave-gate" hidden>
    <p style="color:var(--dim);font-size:14px">Clave familiar para ver la proyección:</p>
    <input id="clave-input" type="text" autocomplete="off" placeholder="clave">
    <br><button id="clave-ok">Entrar</button>
  </div>
  <div id="meses"></div>
  <p class="prox-nota" id="prox-nota" hidden>Suma cuotas pendientes + gastos que se repiten. Las cuotas empiezan el mes siguiente a la compra.</p>
  <button id="cambiar-clave" hidden>cambiar clave</button>
</div>

<footer>
  Se guarda al instante · Jarvis lo lee y actualiza tus finanzas
  <div id="pendientes"></div>
  <button id="exportar">Exportar respaldo</button>
</footer>

<script>
const SUPABASE_URL = 'https://kfiywiqivibktzakclyv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmaXl3aXFpdmlia3R6YWtjbHl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMTA1MTgsImV4cCI6MjA5ODc4NjUxOH0.Z1DQW5ySGolzrjsqeesg824cpctqa04BOS2RSH4NTNo';
const TABLA = 'gastos_obras';
const RPC_LISTA = 'gastos_obras_lista';
const LS_KEY = 'gastos_obras_v1';
const CLAVE_KEY = 'gastos_obras_clave';

const NOMBRES = {jose:'José', facu:'Facu', agus:'Agus'};
const PROYECTOS = {fagu_obra:'Obra FAGU', tafi:'Casa Tafí'};

// Qué métodos puede usar cada uno (regla de la familia)
const METODOS_POR_PERSONA = {
  jose: ['efectivo','transferencia','credito'],
  facu: ['efectivo','transferencia'],
  agus: ['efectivo','transferencia'],
};

const sel = { proyecto:'fagu_obra', quien:'jose', metodo:'efectivo', tarjeta:'Visa Francés', cuotas:1, recurrente:false };

function initChips(id, campo, cb){
  const box = document.getElementById(id);
  box.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b || b.classList.contains('off')) return;
    box.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    b.classList.add('on');
    sel[campo] = campo === 'cuotas' ? parseInt(b.dataset.v, 10) : b.dataset.v;
    if(cb) cb(b.dataset.v);
  });
}

initChips('chips-proyecto','proyecto');
initChips('chips-quien','quien', aplicarReglaMetodos);
initChips('chips-metodo','metodo', v => {
  document.getElementById('credito-extra').classList.toggle('show', v === 'credito');
});
initChips('chips-tarjeta','tarjeta', v => {
  document.getElementById('tarjeta-otra').classList.toggle('show', v === '__otra');
});
initChips('chips-cuotas','cuotas');

const recEl = document.getElementById('recurrente');
recEl.addEventListener('click', () => {
  sel.recurrente = !sel.recurrente;
  recEl.classList.toggle('on', sel.recurrente);
});

function aplicarReglaMetodos(){
  const permitidos = METODOS_POR_PERSONA[sel.quien];
  const box = document.getElementById('chips-metodo');
  box.querySelectorAll('.chip').forEach(c => {
    const ok = permitidos.includes(c.dataset.v);
    c.classList.toggle('off', !ok);
    if(!ok && c.classList.contains('on')){
      c.classList.remove('on');
      sel.metodo = 'efectivo';
      box.querySelector('[data-v="efectivo"]').classList.add('on');
      document.getElementById('credito-extra').classList.remove('show');
    }
  });
}
aplicarReglaMetodos();

// Monto con puntos de miles mientras tipea (es-AR)
const montoEl = document.getElementById('monto');
montoEl.addEventListener('input', () => {
  const n = montoEl.value.replace(/\D/g,'');
  montoEl.value = n ? Number(n).toLocaleString('es-AR') : '';
});

function hoyLocal(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const fechaEl = document.getElementById('fecha');
fechaEl.value = hoyLocal();

function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function escribirLS(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }

async function postSupabase(g){
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + TABLA, {
    method:'POST',
    headers:{
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
    },
    body: JSON.stringify(g),
  });
  return r.status === 201;
}

function refrescarPendientes(){
  const n = leerLS().filter(x => x.estado === 'pendiente').length;
  const el = document.getElementById('pendientes');
  el.textContent = n ? ('⚠ ' + n + ' sin sincronizar — se reintenta solo') : '';
  el.classList.toggle('show', n > 0);
}

async function reintentarPendientes(){
  const hist = leerLS();
  let cambio = false;
  for(const item of hist){
    if(item.estado !== 'pendiente') continue;
    const {estado, local_id, ...gasto} = item;
    try{ if(await postSupabase(gasto)){ item.estado = 'ok'; cambio = true; } }catch(e){}
  }
  if(cambio) escribirLS(hist);
  refrescarPendientes();
}

const btn = document.getElementById('guardar');
btn.addEventListener('click', async () => {
  const monto = Number(montoEl.value.replace(/\D/g,''));
  if(!monto){ montoEl.focus(); return; }
  const esCredito = sel.metodo === 'credito';
  let tarjeta = null;
  if(esCredito){
    tarjeta = sel.tarjeta === '__otra'
      ? (document.getElementById('tarjeta-otra').value.trim() || 'Otra')
      : sel.tarjeta;
  }
  const gasto = {
    fecha: fechaEl.value || hoyLocal(),
    monto: monto,
    descripcion: document.getElementById('descripcion').value.trim(),
    proyecto: sel.proyecto,
    quien: sel.quien,
    metodo: sel.metodo,
    tarjeta: tarjeta,
    cuotas: esCredito ? sel.cuotas : 1,
    es_recurrente: sel.recurrente,
  };

  btn.disabled = true; btn.textContent = 'Guardando…';
  const hist = leerLS();
  const item = {...gasto, estado:'pendiente', local_id: Date.now()};
  hist.push(item); escribirLS(hist);

  let ok = false;
  try{ ok = await postSupabase(gasto); }catch(e){}
  if(ok){ item.estado = 'ok'; escribirLS(hist); }

  if(navigator.vibrate) navigator.vibrate(ok ? 30 : [60,60,60]);
  btn.classList.add('ok');
  btn.textContent = ok ? '✓ Guardado' : '✓ Guardado acá (sincroniza después)';
  setTimeout(() => {
    btn.classList.remove('ok'); btn.disabled = false; btn.textContent = 'Guardar gasto';
    montoEl.value = ''; document.getElementById('descripcion').value = '';
    fechaEl.value = hoyLocal();
    sel.recurrente = false; recEl.classList.remove('on');
  }, 1300);
  refrescarPendientes();
});

document.getElementById('exportar').addEventListener('click', () => {
  const data = JSON.stringify(leerLS(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gastos-obras-respaldo.json';
  a.click();
});

// ---------- Vista Próximos meses ----------
const fmt$ = n => '$' + Math.round(n).toLocaleString('es-AR');

document.getElementById('ver-proximos').addEventListener('click', () => {
  const enProximos = document.body.classList.toggle('modo-proximos');
  document.getElementById('ver-proximos').textContent = enProximos ? '← Cargar gasto' : 'Próximos →';
  if(enProximos) abrirProximos();
});

document.getElementById('clave-ok').addEventListener('click', () => {
  const v = document.getElementById('clave-input').value.trim();
  if(!v) return;
  localStorage.setItem(CLAVE_KEY, v);
  abrirProximos();
});
document.getElementById('cambiar-clave').addEventListener('click', () => {
  localStorage.removeItem(CLAVE_KEY);
  abrirProximos();
});

async function abrirProximos(){
  const gate = document.getElementById('clave-gate');
  const meses = document.getElementById('meses');
  const clave = localStorage.getItem(CLAVE_KEY);
  document.getElementById('prox-nota').hidden = true;
  document.getElementById('cambiar-clave').hidden = true;
  if(!clave){ gate.hidden = false; meses.innerHTML = ''; return; }
  gate.hidden = true;
  meses.innerHTML = '<p class="prox-nota">Cargando…</p>';
  let filas = [];
  try{
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + RPC_LISTA, {
      method:'POST',
      headers:{'apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({clave}),
    });
    filas = await r.json();
    if(!Array.isArray(filas)) filas = [];
  }catch(e){ meses.innerHTML = '<p class="prox-nota">Sin conexión — probá de nuevo.</p>'; return; }
  if(!filas.length){
    meses.innerHTML = '<p class="prox-nota">Sin datos (¿la clave está bien?).</p>';
    document.getElementById('cambiar-clave').hidden = false;
    return;
  }
  render(proyectar(filas));
  document.getElementById('prox-nota').hidden = false;
  document.getElementById('cambiar-clave').hidden = false;
}

function proyectar(filas){
  const hoy = new Date();
  const meses = [];
  for(let k = 0; k < 6; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth() + k, 1);
    meses.push({y: d.getFullYear(), m: d.getMonth(), items: []});
  }
  const idx = (y, m) => (y - meses[0].y) * 12 + (m - meses[0].m);
  for(const f of filas){
    const [fy, fm] = f.fecha.split('-').map(Number);
    const base = idx(fy, fm - 1);
    const etiqueta = f.descripcion || '(sin detalle)';
    const quien = NOMBRES[f.quien] || f.quien;
    const proy = PROYECTOS[f.proyecto] || f.proyecto;
    if(f.es_recurrente){
      for(let k = 0; k < meses.length; k++){
        if(k > base) meses[k].items.push({t:'🔁 ' + etiqueta + ' · ' + quien + ' · ' + proy, v: Number(f.monto)});
      }
    }
    if(f.cuotas > 1){
      const cuota = Number(f.monto) / f.cuotas;
      for(let n = 1; n <= f.cuotas; n++){
        const k = base + n;
        if(k >= 0 && k < meses.length)
          meses[k].items.push({t: etiqueta + ' (cuota ' + n + '/' + f.cuotas + ') · ' + quien + ' · ' + proy, v: cuota});
      }
    }
  }
  return meses;
}

function render(meses){
  const cont = document.getElementById('meses');
  cont.innerHTML = '';
  let algo = false;
  for(const mes of meses){
    if(!mes.items.length) continue;
    algo = true;
    const total = mes.items.reduce((s, i) => s + i.v, 0);
    const nombre = new Date(mes.y, mes.m, 1).toLocaleDateString('es-AR', {month:'long', year:'numeric'});
    const card = document.createElement('div');
    card.className = 'mes-card';
    card.innerHTML = '<h3>' + nombre + '</h3><div class="total">' + fmt$(total) + '</div>' +
      mes.items.map(i => '<div class="mes-item"><span>' + i.t + '</span><span>' + fmt$(i.v) + '</span></div>').join('');
    cont.appendChild(card);
  }
  if(!algo) cont.innerHTML = '<p class="prox-nota">Nada proyectado: sin cuotas pendientes ni gastos recurrentes.</p>';
}

reintentarPendientes();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
